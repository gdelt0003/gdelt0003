name: Monitor official White House videos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-whitehouse-video-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATE_BRANCH: official-video-monitoring-state
      STATE_PATH: official-video-monitoring
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install metadata collector
        run: |
          python -m pip install --upgrade yt-dlp
          yt-dlp --version

      - name: Load durable deduplication state
        id: load_state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/official-video-monitoring/runs"
          set +e
          git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null
          lookup_status=$?
          set -e
          if [ "$lookup_status" -eq 0 ]; then
            git fetch --no-tags origin "$STATE_BRANCH"
            git show "FETCH_HEAD:${STATE_PATH}/state.json" \
              > "$RUNNER_TEMP/official-video-monitoring/state.json"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$lookup_status" -eq 2 ]; then
            printf '{"schema_version":1,"videos":{},"last_run":null}\n' \
              > "$RUNNER_TEMP/official-video-monitoring/state.json"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to check the durable state branch (git ls-remote status $lookup_status)." >&2
            exit "$lookup_status"
          fi

      - name: Poll and research each new video
        id: poll
        continue-on-error: true
        run: |
          python -m scripts.monitor_official_whitehouse_videos \
            --state-file "$RUNNER_TEMP/official-video-monitoring/state.json" \
            --run-file "$RUNNER_TEMP/official-video-monitoring/runs/${GITHUB_RUN_ID}.json" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --trigger "${GITHUB_EVENT_NAME}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Persist deduplication state and run provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for required_file in \
            "$RUNNER_TEMP/official-video-monitoring/state.json" \
            "$RUNNER_TEMP/official-video-monitoring/runs/${GITHUB_RUN_ID}.json"; do
            if [ ! -f "$required_file" ]; then
              echo "Required monitor output is missing: $required_file" >&2
              exit 1
            fi
          done
          if [ "${{ steps.load_state.outputs.exists }}" = "true" ]; then
            git fetch --no-tags origin "$STATE_BRANCH"
            git checkout -B "$STATE_BRANCH" FETCH_HEAD
          else
            git checkout --orphan "$STATE_BRANCH"
            git rm -r -f --ignore-unmatch .
          fi
          mkdir -p "${STATE_PATH}/runs"
          cp "$RUNNER_TEMP/official-video-monitoring/state.json" \
            "${STATE_PATH}/state.json"
          cp "$RUNNER_TEMP/official-video-monitoring/runs/${GITHUB_RUN_ID}.json" \
            "${STATE_PATH}/runs/${GITHUB_RUN_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${STATE_PATH}/state.json" "${STATE_PATH}/runs/${GITHUB_RUN_ID}.json"
          git commit -m "chore: persist official video monitoring run" \
            -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:${STATE_BRANCH}"

      - name: Fail the run when collection failed
        if: always() && steps.poll.outcome == 'failure'
        run: exit 1
