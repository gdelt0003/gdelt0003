name: Archive official Columbus Day source

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-columbus-day-source-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Set up Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          yt-dlp --version
          ffprobe -version

      - name: Fetch metadata without downloading media
        id: metadata
        env:
          SOURCE_URL: https://www.youtube.com/watch?v=noI4BbQ2wZQ
          PACKAGE_DIR: ${{ runner.temp }}/columbus-day-source
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_DIR"
          yt-dlp \
            --dump-single-json \
            --skip-download \
            --no-warnings \
            --js-runtimes node \
            "$SOURCE_URL" > "$RUNNER_TEMP/columbus-day-yt-dlp-metadata.json" \
            2> "$RUNNER_TEMP/columbus-day-yt-dlp-metadata.stderr"
          available_bytes="$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d '[:space:]')"
          python - "$RUNNER_TEMP/columbus-day-yt-dlp-metadata.json" "$PACKAGE_DIR" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" "$available_bytes" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          metadata_path, package_dir, output_path, summary_path = map(Path, sys.argv[1:5])
          runner_available_bytes = int(sys.argv[5])
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          if metadata.get("id") != "noI4BbQ2wZQ":
              raise SystemExit("Extracted video ID does not match the allow-listed White House source.")
          if metadata.get("title") != "President Trump Hosts a Columbus Day Celebration":
              raise SystemExit("Extracted title does not match the official White House event page.")

          safe_metadata = {
              key: metadata.get(key)
              for key in (
                  "id", "title", "channel", "channel_id", "channel_url", "uploader",
                  "uploader_id", "uploader_url", "duration", "availability",
                  "upload_date", "release_timestamp",
              )
          }
          safe_metadata["formats"] = [
              {
                  key: fmt.get(key)
                  for key in (
                      "format_id", "ext", "width", "height", "format_note",
                      "vcodec", "acodec", "filesize", "filesize_approx",
                  )
              }
              for fmt in metadata.get("formats", [])
          ]
          (package_dir / "source-metadata.json").write_text(
              json.dumps(safe_metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          def known_size(fmt):
              for key in ("filesize", "filesize_approx"):
                  value = fmt.get(key)
                  if isinstance(value, (int, float)) and value > 0:
                      return int(value)
              return None

          formats = metadata.get("formats", [])
          videos = [
              fmt for fmt in formats
              if fmt.get("vcodec") not in (None, "none")
              and isinstance(fmt.get("width"), int)
              and isinstance(fmt.get("height"), int)
              and fmt["width"] >= 1920
              and fmt["height"] >= 1080
              and fmt["width"] > fmt["height"]
              and known_size(fmt) is not None
          ]
          audios = [
              fmt for fmt in formats
              if fmt.get("acodec") not in (None, "none")
              and fmt.get("vcodec") == "none"
              and known_size(fmt) is not None
          ]

          candidates = []
          for video in videos:
              video_id = str(video.get("format_id", ""))
              if not re.fullmatch(r"[A-Za-z0-9._-]+", video_id):
                  continue
              video_size = known_size(video)
              if video.get("acodec") not in (None, "none"):
                  candidates.append({
                      "format_selector": video_id,
                      "format_ids": [video_id],
                      "width": video["width"],
                      "height": video["height"],
                      "estimated_bytes": video_size,
                  })
              for audio in audios:
                  audio_id = str(audio.get("format_id", ""))
                  if not re.fullmatch(r"[A-Za-z0-9._-]+", audio_id):
                      continue
                  estimated_bytes = video_size + known_size(audio)
                  candidates.append({
                      "format_selector": f"{video_id}+{audio_id}",
                      "format_ids": [video_id, audio_id],
                      "width": video["width"],
                      "height": video["height"],
                      "estimated_bytes": estimated_bytes,
                  })

          eligible = []
          for candidate in candidates:
              candidate["estimated_working_bytes"] = candidate["estimated_bytes"] * 2
              if candidate["estimated_working_bytes"] <= runner_available_bytes:
                  eligible.append(candidate)
          eligible.sort(
              key=lambda candidate: (
                  -candidate["height"],
                  -candidate["width"],
                  candidate["estimated_bytes"],
              )
          )
          selected = eligible[0] if eligible else None

          record = {
              "workflow_run_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_commit_sha": os.environ["GITHUB_SHA"],
              "source_url": "https://www.youtube.com/watch?v=noI4BbQ2wZQ",
              "video_id": metadata["id"],
              "title": metadata["title"],
              "publisher_as_reported_by_youtube": metadata.get("channel")
                  or metadata.get("uploader"),
              "duration_seconds": metadata.get("duration"),
              "event_date": None,
              "event_date_status": "unknown; upload/publish timestamps are not event-date evidence",
              "video_formats_with_known_size": len(videos),
              "runner_available_bytes_at_preflight": runner_available_bytes,
              "preflight_reference_observation": {
                  "video_id": "noI4BbQ2wZQ",
                  "title": "President Trump Hosts a Columbus Day Celebration",
                  "format_id": "137",
                  "resolution": "1920x1080",
                  "fps": 30,
                  "content_length_bytes": 963613436,
                  "evidence": (
                      "A coordinator reported inspecting the public YouTube watch-page "
                      "adaptiveFormats metadata without requesting media segments. This is "
                      "a preliminary metadata observation only, not a download or file-integrity "
                      "check; the workflow independently rechecks current formats before downloading."
                  ),
              },
              "selected_format": selected,
              "download_status": "eligible" if selected else "not_downloaded",
              "download_blocker": None if selected else (
                  "No landscape video format at least 1920x1080 with known estimated size "
                  "fits the runner's currently available working disk space."
              ),
              "artifact_name": f"columbus-day-official-source-{os.environ['GITHUB_RUN_ID']}",
              "artifact_storage": {
                  "retention_days": 30,
                  "compression_level": 0,
                  "quota_status": (
                      "Repository/account available artifact storage is unknown; GitHub plan "
                      "quotas or billing may prevent a large upload. No upload success is "
                      "claimed until the artifact is present."
                  ),
                  "documentation": [
                      "https://github.com/actions/upload-artifact#limitations",
                      "https://docs.github.com/en/billing/concepts/product-billing/github-actions",
                  ],
              },
              "rights_evidence": {
                  "official_event_page": (
                      "https://www.whitehouse.gov/videos/"
                      "president-trump-hosts-a-columbus-day-celebration/"
                  ),
                  "white_house_copyright_policy": "https://www.whitehouse.gov/copyright/",
                  "basis": (
                      "The official event page identifies this exact YouTube video and White House "
                      "publisher. The policy says government-produced materials appearing on the "
                      "site are not copyright protected, while noting the U.S. Government may hold "
                      "transferred copyrights. This records the evidence, not a separate legal "
                      "attestation or a claim about third-party material."
                  ),
              },
              "known_in_picture_graphics": (
                  "Prior sampled frames show a White House emblem, POTUS text banner, and QR code; "
                  "these remain in the source. Full-video frame review is incomplete."
              ),
              "processing": "Original source download only; no ASR, translation, editing, or re-encoding.",
              "deferred_checks": [
                  {
                      "name": "Verified event date and local time",
                      "status": "unknown; event_date remains null",
                      "reason": "Official upload/publish timestamps do not establish when the event occurred.",
                      "risk": "Do not assign a date-specific event ID or claim event-day metadata.",
                      "follow_up": "Find a reliable event-date source before event editing or publication.",
                  },
                  {
                      "name": "Full-video frame/rights review",
                      "status": "incomplete",
                      "reason": "This workflow only archives the original source; prior samples show White House branding, banner, and QR.",
                      "risk": "No clean-frame claim; any third-party notice discovered later blocks reuse.",
                      "follow_up": "Review the full source and any additional content before edited/public release.",
                  },
                  {
                      "name": "Editorial highlights and bilingual caption review",
                      "status": "not performed",
                      "reason": "No clipping, ASR, translation, or subtitle work is in scope.",
                      "risk": "No reviewed excerpts, captions, or translation claims are made.",
                      "follow_up": "Complete source-backed highlight, ASR, translation, and human review before editing/publishing.",
                  },
                  {
                      "name": "Additional publishers, camera angles, and edit presets",
                      "status": "deferred",
                      "reason": "Not needed to archive this single official source.",
                      "risk": "No independent camera, alternate source, or multi-style coverage is claimed.",
                      "follow_up": "Revisit only if a later event-editing task requires additional sources or variants.",
                  },
              ],
              "shortcomings_for_follow_up": [
                  "Event-date/source identity linkage remains incomplete; event_date is null and must not be inferred from upload time.",
                  "Actual downloadable stream properties require runner preflight and post-download probe; full-video graphics and third-party content are not reviewed here.",
                  "The source URL, workflow run, artifact name, byte count, and SHA-256 should remain linked for end-to-end artifact traceability.",
                  "This workflow pins the exact video ID/title to avoid accidentally running another workflow's hard-coded source ID.",
                  "Runner availability, download success, actual file size, ffprobe results, and SHA-256 must all be checked before calling an archive successful.",
                  "GitHub-hosted anonymous yt-dlp can be blocked by YouTube bot verification; only a supported public official source or user-provided media permitted for processing can unblock acquisition.",
              ],
              "next_phase_shortfalls": [
                  {
                      "id": "source-to-edit-audit",
                      "title": "Original source to edited-media provenance and review remains incomplete",
                      "risk": "Event-date linkage, complete source-frame review, edit/caption review, and end-to-end source-to-output verification are not established.",
                      "follow_up": "Design and test a separate audited editing workflow after source acquisition is available.",
                  },
                  {
                      "id": "source-acquisition-method",
                      "title": "No reliable supported download/ingest method is available for the current YouTube source",
                      "risk": "GitHub-hosted anonymous yt-dlp was blocked by YouTube bot verification; the White House page provides no direct media file.",
                      "follow_up": "Use a public official direct media URL or a user-provided original file via a permitted, runner-accessible transfer path; never bypass bot verification.",
                  },
              ],
          }
          (package_dir / "source-record.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"download_allowed={'true' if selected else 'false'}\n")
              if selected:
                  output.write(f"format_selector={selected['format_selector']}\n")
          with summary_path.open("a", encoding="utf-8") as summary:
              if selected:
                  summary.write(
                      f"Metadata confirms an eligible {selected['width']}x{selected['height']} "
                      f"landscape format, estimated at {selected['estimated_bytes']} bytes. "
                      f"Estimated working space is {selected['estimated_working_bytes']} bytes; "
                      "the source will be downloaded without re-encoding.\n"
                  )
              else:
                  summary.write(record["download_blocker"] + " Metadata-only artifact will be retained.\n")
          PY
        shell: bash

      - name: Download the allow-listed source without re-encoding
        id: download
        if: steps.metadata.outputs.download_allowed == 'true'
        env:
          SOURCE_URL: https://www.youtube.com/watch?v=noI4BbQ2wZQ
          FORMAT_SELECTOR: ${{ steps.metadata.outputs.format_selector }}
          PACKAGE_DIR: ${{ runner.temp }}/columbus-day-source
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/columbus-day-source-download"
          mkdir -p "$download_dir"
          yt-dlp \
            --no-warnings \
            --no-progress \
            --concurrent-fragments 8 \
            --js-runtimes node \
            --format "$FORMAT_SELECTOR" \
            --merge-output-format mkv \
            --output "$download_dir/source.%(ext)s" \
            "$SOURCE_URL" \
            2> "$RUNNER_TEMP/columbus-day-yt-dlp-download.stderr"
          shopt -s nullglob
          files=("$download_dir"/source.*)
          if (( ${#files[@]} != 1 )); then
            echo "Expected exactly one downloaded source file." >&2
            exit 1
          fi
          source_file="${files[0]}"
          source_bytes="$(stat -c '%s' "$source_file")"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height \
            -of json "$source_file" > "$PACKAGE_DIR/source-probe.json"
          python - "$PACKAGE_DIR" "$source_file" "$source_bytes" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          package_dir = Path(sys.argv[1])
          source_file = Path(sys.argv[2])
          source_bytes = int(sys.argv[3])
          record_path = package_dir / "source-record.json"
          record = json.loads(record_path.read_text(encoding="utf-8"))
          probe = json.loads((package_dir / "source-probe.json").read_text(encoding="utf-8"))
          streams = probe.get("streams", [])
          if not streams:
              raise SystemExit("Downloaded file has no video stream.")
          width, height = streams[0].get("width"), streams[0].get("height")
          if not isinstance(width, int) or not isinstance(height, int) or width < 1920 or height < 1080 or width <= height:
              raise SystemExit("Downloaded stream failed the landscape 1920x1080 minimum.")
          digest = hashlib.sha256()
          with source_file.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(chunk)
          record["download_status"] = "downloaded_and_probe_verified"
          record["downloaded_file"] = source_file.name
          record["downloaded_bytes"] = source_bytes
          record["verified_video_resolution"] = f"{width}x{height}"
          record["sha256"] = digest.hexdigest()
          record["source_frame_review"] = "not reviewed in this download-only workflow"
          archived_file = package_dir / source_file.name
          source_file.replace(archived_file)
          record_path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with (package_dir / "SHA256SUMS").open("w", encoding="utf-8") as sums:
              sums.write(f"{digest.hexdigest()}  {archived_file.name}\n")
          PY
          cat "$PACKAGE_DIR/source-record.json" >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Preserve a diagnostic record when preflight or download fails
        if: always()
        env:
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          PACKAGE_DIR: ${{ runner.temp }}/columbus-day-source
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - "$PACKAGE_DIR" "$RUNNER_TEMP/columbus-day-yt-dlp-metadata.stderr" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          package_dir, stderr_path, summary_path = map(Path, sys.argv[1:])
          package_dir.mkdir(parents=True, exist_ok=True)
          record_path = package_dir / "source-record.json"
          download_stderr_path = stderr_path.with_name("columbus-day-yt-dlp-download.stderr")
          stderr_parts = []
          for diagnostic_path in (stderr_path, download_stderr_path):
              if diagnostic_path.exists():
                  stderr_parts.append(diagnostic_path.read_text(encoding="utf-8", errors="replace"))
          stderr = "\n".join(stderr_parts)
          known_failures = (
              ("Sign in to confirm", "YouTube required an interactive bot verification."),
              ("HTTP Error 429", "The source host returned HTTP 429."),
              ("Video unavailable", "The source was reported unavailable."),
              ("This video is private", "The source was reported private."),
              ("Extracted video ID does not match", "The extracted video ID did not match the allow-listed source."),
              ("Extracted title does not match", "The extracted title did not match the official event page."),
          )
          reason = next((message for needle, message in known_failures if needle in stderr), None)
          if record_path.exists():
              record = json.loads(record_path.read_text(encoding="utf-8"))
              if os.environ.get("DOWNLOAD_OUTCOME") == "failure":
                  if reason is None:
                      reason = "Source download or integrity verification failed; inspect the linked Actions log. No successful archive is claimed."
                  else:
                      reason += " No verified source artifact was produced."
                  record["download_status"] = "download_failed_or_unverified"
                  record["failure_reason"] = reason
                  record["sha256"] = None
                  record["next_action"] = (
                      "Use a publicly accessible official direct media URL or a user-provided original file "
                      "that the user has the right to provide and the platform permits processing. Do not "
                      "bypass bot verification or claim a download."
                  )
                  record_path.write_text(
                      json.dumps(record, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8",
                  )
                  with summary_path.open("a", encoding="utf-8") as summary:
                      summary.write(f"Diagnostic record preserved: {reason}\n")
                  print(f"Diagnostic record preserved: {reason}")
              raise SystemExit(0)

          if reason is None:
              if os.environ.get("METADATA_OUTCOME") == "failure":
                  reason = "Metadata preflight failed; inspect the linked Actions log for details. No media was downloaded."
              elif os.environ.get("DOWNLOAD_OUTCOME") == "failure":
                  reason = "Source download or integrity verification failed; inspect the linked Actions log. No successful archive is claimed."
              else:
                  reason = "The workflow did not produce a verified source record; inspect the linked Actions log."
          elif os.environ.get("METADATA_OUTCOME") == "failure":
              reason += " No media download was attempted."

          record = {
              "workflow_run_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_commit_sha": os.environ["GITHUB_SHA"],
              "artifact_name": f"columbus-day-official-source-{os.environ['GITHUB_RUN_ID']}",
              "artifact_storage": {
                  "retention_days": 30,
                  "compression_level": 0,
                  "quota_status": (
                      "Repository/account available artifact storage is unknown; GitHub plan "
                      "quotas or billing may prevent a large upload. No upload success is "
                      "claimed until the artifact is present."
                  ),
                  "documentation": [
                      "https://github.com/actions/upload-artifact#limitations",
                      "https://docs.github.com/en/billing/concepts/product-billing/github-actions",
                  ],
              },
              "source_url": "https://www.youtube.com/watch?v=noI4BbQ2wZQ",
              "video_id": "noI4BbQ2wZQ",
              "title": "President Trump Hosts a Columbus Day Celebration",
              "event_date": None,
              "event_date_status": "unknown; upload/publish timestamps are not event-date evidence",
              "download_status": "not_downloaded",
              "failure_reason": reason,
              "source_resolution": None,
              "sha256": None,
              "known_in_picture_graphics": (
                  "Prior sampled frames show a White House emblem, POTUS text banner, and QR code; "
                  "these remain in the source. Full-video frame review is incomplete."
              ),
              "shortcomings_for_follow_up": [
                  "Event-date/source identity linkage remains incomplete; event_date is null and must not be inferred from upload time.",
                  "Actual downloadable stream properties require runner preflight and post-download probe; full-video graphics and third-party content are not reviewed here.",
                  "The source URL, workflow run, artifact name, byte count, and SHA-256 should remain linked for end-to-end artifact traceability.",
                  "A fixed source ID/title guard is required to prevent accidentally archiving a different workflow's hard-coded video.",
                  "Runner availability, download success, actual file size, ffprobe results, and SHA-256 must all be checked before calling an archive successful.",
                  "Anonymous GitHub-hosted yt-dlp metadata extraction can be blocked by YouTube bot verification.",
                  "The official White House event page embeds YouTube and exposes no direct MP4, HLS, or DASH source URL.",
                  "The failed preflight did not establish current stream resolution or source-file integrity.",
                  "Full-video graphics and third-party-content review remains incomplete.",
              ],
              "next_phase_shortfalls": [
                  {
                      "id": "source-to-edit-audit",
                      "title": "Original source to edited-media provenance and review remains incomplete",
                      "risk": "Event-date linkage, complete source-frame review, edit/caption review, and end-to-end source-to-output verification are not established.",
                      "follow_up": "Design and test a separate audited editing workflow after source acquisition is available.",
                  },
                  {
                      "id": "source-acquisition-method",
                      "title": "No reliable supported download/ingest method is available for the current YouTube source",
                      "risk": "GitHub-hosted anonymous yt-dlp was blocked by YouTube bot verification; the White House page provides no direct media file.",
                      "follow_up": "Use a public official direct media URL or a user-provided original file via a permitted, runner-accessible transfer path; never bypass bot verification.",
                  },
              ],
              "next_action": (
                  "Use a publicly accessible official direct media URL or a user-provided original file "
                  "that the user has the right to provide and the platform permits processing. Do not "
                  "bypass bot verification or claim a download."
              ),
          }
          record_path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write(f"Diagnostic record preserved: {reason}\n")
          print(f"Diagnostic record preserved: {reason}")
          PY
        shell: bash

      - name: Upload source and evidence as a time-limited artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: columbus-day-official-source-${{ github.run_id }}
          path: ${{ runner.temp }}/columbus-day-source/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
