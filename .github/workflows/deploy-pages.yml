name: Update catalog and deploy Pages

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      video_limit_per_source:
        description: Maximum videos to index from each source (1-50)
        required: false
        default: '12'
        type: string
      short_video_url:
        description: Optional public video URL to turn into a vertical short
        required: false
        type: string
      clip_duration_seconds:
        description: Short duration (10-60 seconds)
        required: false
        default: '45'
        type: string
      clip_authorized:
        description: I own this video or have permission to create an edit
        required: true
        default: false
        type: boolean
      style_reference_url:
        description: Optional YouTube example; only English caption pacing is analyzed, never the video file
        required: false
        type: string
      style_reference_authorized:
        description: I own this example or have permission to use its caption pacing as a style reference
        required: true
        default: false
        type: boolean
      short_style:
        description: Caption/highlight style template
        required: false
        default: auto-hook
        type: choice
        options:
          - auto-hook
          - bold-captions
          - clean-captions
          - match-example
          - stock-broll
      short_languages:
        description: Optional comma-separated locales for translated captions and narration (max 4)
        required: false
        type: string
      tts_voice_overrides:
        description: Optional locale=AzureVoice pairs (for example es-ES=es-ES-ElviraNeural)
        required: false
        type: string
      add_pexels_broll:
        description: Search and overlay one Pexels-licensed B-roll shot (requires PEXELS_API_KEY)
        required: false
        default: false
        type: boolean
      publish_to:
        description: Optional comma-separated platforms (youtube,tiktok,instagram,facebook,x)
        required: false
        type: string
      publish_languages:
        description: Optional comma-separated localized assets to publish (default publishes all generated languages)
        required: false
        type: string
      publish_privacy:
        description: Visibility requested where the platform supports it
        required: false
        default: unlisted
        type: choice
        options:
          - unlisted
          - private
          - public

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VIDEO_LIMIT_PER_SOURCE: ${{ inputs.video_limit_per_source || vars.VIDEO_LIMIT_PER_SOURCE || '12' }}
      SHORT_VIDEO_URL: ${{ inputs.short_video_url || '' }}
      CLIP_DURATION_SECONDS: ${{ inputs.clip_duration_seconds || '45' }}
      CLIP_AUTHORIZED: ${{ inputs.clip_authorized }}
      ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || '' }}
      SHORT_LANGUAGES: ${{ inputs.short_languages || '' }}
      TTS_VOICE_OVERRIDES: ${{ inputs.tts_voice_overrides || '' }}
      SHORT_STYLE: ${{ inputs.short_style || 'auto-hook' }}
      STYLE_REFERENCE_URL: ${{ inputs.style_reference_url || '' }}
      STYLE_REFERENCE_AUTHORIZED: ${{ inputs.style_reference_authorized }}
      ENABLE_PEXELS_BROLL: ${{ inputs.add_pexels_broll || inputs.short_style == 'stock-broll' }}
    outputs:
      clip_created: ${{ steps.shorts.outputs.clip_created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v

      - name: Run client interaction tests
        run: node --test tests/app.test.js

      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Prepare static site
        run: |
          mkdir -p site/assets
          cp index.html site/index.html
          cp assets/app.js assets/style.css site/assets/

      - name: Restore previously published clips
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || '' }}
          SITE_DIR: site
        run: python scripts/preserve_pages_clips.py

      - name: Fetch configured YouTube sources
        run: python scripts/fetch_youtube.py

      - name: Install ffmpeg on GitHub-hosted runner
        if: ${{ inputs.short_video_url != '' && inputs.clip_authorized }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Create linked vertical short
        id: shorts
        if: ${{ inputs.short_video_url != '' }}
        continue-on-error: true
        env:
          SHORTS_OUTPUT_DIR: ${{ github.workspace }}/site/clips
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/create_short.py

      - name: Merge durable video history and enforce Pages media limits
        run: python scripts/persist_archive.py

      - name: Commit collected video metadata to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/catalog.json
          if git diff --cached --quiet; then
            echo "No metadata archive changes to commit."
          else
            git commit -m "Update collected video archive"
            if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "::error title=Archive write-back failed::The workflow token could not update archive/catalog.json. Check contents:write permission and branch protection or repository rules."
              exit 1
            fi
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: [build, deploy]
    if: ${{ needs.build.outputs.clip_created == 'true' && inputs.publish_to != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish selected assets through official APIs
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || '' }}
          SHORT_VIDEO_URL: ${{ inputs.short_video_url }}
          PUBLISH_PLATFORMS: ${{ inputs.publish_to }}
          PUBLISH_LANGUAGES: ${{ inputs.publish_languages || '' }}
          PUBLISH_PRIVACY: ${{ inputs.publish_privacy || 'unlisted' }}
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v22.0' }}
        run: python scripts/publish_short.py
