name: Update catalog and deploy Pages

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      video_limit_per_source:
        description: Maximum videos to index from each source (1-50)
        required: false
        default: '12'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VIDEO_LIMIT_PER_SOURCE: ${{ inputs.video_limit_per_source || vars.VIDEO_LIMIT_PER_SOURCE || '12' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Prepare static site
        run: |
          mkdir -p site/assets
          cp index.html site/index.html
          cp assets/app.js assets/style.css site/assets/

      - name: Fetch configured YouTube sources
        run: python scripts/fetch_youtube.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
