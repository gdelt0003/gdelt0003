name: Fetch YouTube and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_URL: ${{ vars.YOUTUBE_URL || 'https://www.youtube.com/@gdelt0003' }}
      VIDEO_LIMIT: ${{ vars.VIDEO_LIMIT || '8' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Deno for YouTube extraction
        uses: denoland/setup-deno@v2

      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "yt-dlp[default]"

      - name: Fetch YouTube videos
        run: python scripts/fetch_youtube.py

      - name: Generate default highlight clips
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python scripts/generate_default_video_batch.py

      - name: Save generated clips to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json generated/
          git diff --cached --quiet || git commit -m "chore: refresh default highlight batch"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
