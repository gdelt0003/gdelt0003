name: Publish stored White House clips to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerate_clips:
        description: Attempt to download and recut source clips from YouTube
        type: boolean
        required: false
        default: false
      download_full_source:
        description: Download the full source video and attach it to a GitHub Release
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate_clips
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify ffmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Download and cut White House highlight clips
        run: python scripts/generate_default_video_batch.py

      - name: Save generated clips and manifest to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/default_batch.json generated/clips
          git diff --cached --quiet || git commit -m "chore: generate White House highlight clips"
          git push

  download-source:
    if: github.event_name == 'workflow_dispatch' && inputs.download_full_source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Download complete White House source video
        run: |
          yt-dlp \
            --concurrent-fragments 50 \
            --js-runtimes node \
            --merge-output-format mp4 \
            --output "$RUNNER_TEMP/KroMEOZ8oFo.%(ext)s" \
            "https://www.youtube.com/watch?v=KroMEOZ8oFo"
          test -s "$RUNNER_TEMP/KroMEOZ8oFo.mp4"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height \
            -of csv=s=x:p=0 "$RUNNER_TEMP/KroMEOZ8oFo.mp4"
          sha256sum "$RUNNER_TEMP/KroMEOZ8oFo.mp4"

      - name: Publish complete source as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="white-house-source-KroMEOZ8oFo"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "White House source video KroMEOZ8oFo" \
              --notes "Complete source video downloaded from the official White House YouTube channel."
          fi
          gh release upload "$tag" "$RUNNER_TEMP/KroMEOZ8oFo.mp4" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  deploy:
    needs: [build, download-source]
    if: always() && needs.build.result != 'failure' && needs.download-source.result != 'failure' && needs.build.result != 'cancelled' && needs.download-source.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout generated site files
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
