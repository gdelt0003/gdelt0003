name: Publish stored White House clips to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerate_clips:
        description: Attempt to download and recut source clips from YouTube
        type: boolean
        required: false
        default: false
      download_full_source:
        description: Download the full source video and attach it to a GitHub Release
        type: boolean
        required: false
        default: false
      download_same_clip:
        description: Test the exact local yt-dlp section-download command on oW-PQlgw1wo
        type: boolean
        required: false
        default: false
      download_same_full_video:
        description: Test the full-video yt-dlp command on oW-PQlgw1wo without cookies
        type: boolean
        required: false
        default: false
      download_vimeo:
        description: Test downloading Vimeo video 1236025473 from an Ubuntu runner
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate_clips
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify ffmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Download and cut White House highlight clips
        run: python scripts/generate_default_video_batch.py

      - name: Save generated clips and manifest to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/default_batch.json generated/clips
          git diff --cached --quiet || git commit -m "chore: generate White House highlight clips"
          git push

  download-source:
    if: github.event_name == 'workflow_dispatch' && inputs.download_full_source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Restore interrupted YouTube fragments
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/whitehouse-source
          key: whitehouse-source-KroMEOZ8oFo-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whitehouse-source-KroMEOZ8oFo-

      - name: Download complete White House source video
        id: download
        run: |
          mkdir -p "$RUNNER_TEMP/whitehouse-source"
          yt-dlp \
            --concurrent-fragments 50 \
            --js-runtimes node \
            --merge-output-format mp4 \
            --output "$RUNNER_TEMP/whitehouse-source/KroMEOZ8oFo.%(ext)s" \
            "https://www.youtube.com/watch?v=KroMEOZ8oFo"
          test -s "$RUNNER_TEMP/whitehouse-source/KroMEOZ8oFo.mp4"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height \
            -of csv=s=x:p=0 "$RUNNER_TEMP/whitehouse-source/KroMEOZ8oFo.mp4"
          shasum -a 256 "$RUNNER_TEMP/whitehouse-source/KroMEOZ8oFo.mp4"
        shell: bash

      - name: Preserve partial fragments for a later retry
        if: always() && steps.download.outcome != 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/whitehouse-source
          key: whitehouse-source-KroMEOZ8oFo-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish complete source as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="white-house-source-KroMEOZ8oFo"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "White House source video KroMEOZ8oFo" \
              --notes "Complete source video downloaded from the official White House YouTube channel."
            test $? -eq 0
          fi
          gh release upload "$tag" "$RUNNER_TEMP/whitehouse-source/KroMEOZ8oFo.mp4" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        shell: bash

  download-same-clip:
    if: github.event_name == 'workflow_dispatch' && inputs.download_same_clip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          yt-dlp --version
          ffmpeg -version

      - name: Download the same highlight with the local command
        run: |
          mkdir -p "$RUNNER_TEMP/whitehouse-clip"
          yt-dlp \
            --no-warnings \
            --download-sections '*723.2-779.0' \
            --force-keyframes-at-cuts \
            --merge-output-format mp4 \
            -f 'bestvideo[height>=1080]+bestaudio/best[height>=1080]/bestvideo+bestaudio/best' \
            -o "$RUNNER_TEMP/whitehouse-clip/arsenal-production.mp4" \
            'https://www.youtube.com/watch?v=oW-PQlgw1wo'
          test -s "$RUNNER_TEMP/whitehouse-clip/arsenal-production.mp4"
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$RUNNER_TEMP/whitehouse-clip/arsenal-production.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
            -of csv=s=x:p=0 "$RUNNER_TEMP/whitehouse-clip/arsenal-production.mp4"
          sha256sum "$RUNNER_TEMP/whitehouse-clip/arsenal-production.mp4"
        shell: bash

      - name: Upload runner test clip
        uses: actions/upload-artifact@v4
        with:
          name: whitehouse-oW-PQlgw1wo-runner-test
          path: ${{ runner.temp }}/whitehouse-clip/arsenal-production.mp4
          if-no-files-found: error
          retention-days: 3

  download-same-full-video:
    if: github.event_name == 'workflow_dispatch' && inputs.download_same_full_video
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade --pre "yt-dlp[default]"
          yt-dlp --version
          python -m pip show yt-dlp-ejs
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version

      - name: Run the exact full-video command on the same video
        id: download
        run: |
          mkdir -p "$RUNNER_TEMP/whitehouse-full-video"
          cd "$RUNNER_TEMP/whitehouse-full-video"
          yt-dlp --version > runner-info.txt
          node --version >> runner-info.txt
          python -m pip show yt-dlp yt-dlp-ejs >> runner-info.txt
          set +e
          yt-dlp --concurrent-fragments 50 --js-runtimes node --merge-output-format mp4 "https://www.youtube.com/watch?v=oW-PQlgw1wo" 2>&1 | tee yt-dlp.log
          download_status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$download_status" >> "$GITHUB_OUTPUT"
          exit 0
        shell: bash

      - name: Extract a frame from the downloaded video
        if: steps.download.outputs.exit_code == '0'
        run: |
          shopt -s nullglob
          files=( "$RUNNER_TEMP"/whitehouse-full-video/*.mp4 )
          if (( ${#files[@]} == 0 )); then
            echo "yt-dlp exited successfully but produced no MP4 file" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            ffprobe -v error -show_entries format=duration,size \
              -of default=noprint_wrappers=1 "$file"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
              -of csv=s=x:p=0 "$file"
            ffmpeg -y -ss 1 -i "$file" -frames:v 1 -q:v 2 "${file%.mp4}-frame.jpg"
            sha256sum "$file" "${file%.mp4}-frame.jpg"
          done
        shell: bash

      - name: Upload runner logs, video, and extracted frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitehouse-oW-PQlgw1wo-full-video-runner-test
          path: ${{ runner.temp }}/whitehouse-full-video/
          if-no-files-found: error
          retention-days: 3

      - name: Fail if YouTube blocked the download
        if: always() && steps.download.outputs.exit_code != '0'
        run: exit 1

  download-vimeo:
    if: github.event_name == 'workflow_dispatch' && inputs.download_vimeo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade yt-dlp
          yt-dlp --version

      - name: Download Vimeo video
        id: download
        env:
          VIDEO_URL: https://vimeo.com/1236025473
        run: |
          mkdir -p "$RUNNER_TEMP/vimeo-download"
          cd "$RUNNER_TEMP/vimeo-download"
          yt-dlp --version > runner-info.txt
          python --version >> runner-info.txt 2>&1
          set +e
          yt-dlp --no-warnings --no-playlist \
            --output "$RUNNER_TEMP/vimeo-download/%(id)s.%(ext)s" \
            "$VIDEO_URL" > yt-dlp.log 2>&1
          download_status=$?
          set -e
          echo "exit_code=$download_status" >> "$GITHUB_OUTPUT"
          cat yt-dlp.log
          exit 0
        shell: bash

      - name: Upload Vimeo runner result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vimeo-1236025473-runner-test
          path: ${{ runner.temp }}/vimeo-download/
          if-no-files-found: error
          retention-days: 3

      - name: Fail if Vimeo blocked the download
        if: always() && steps.download.outputs.exit_code != '0'
        run: exit 1

  deploy:
    needs: [build, download-source, download-same-clip, download-same-full-video, download-vimeo]
    if: always() && (github.event_name == 'push' || inputs.regenerate_clips || inputs.download_full_source) && needs.build.result != 'failure' && needs.download-source.result != 'failure' && needs.download-same-clip.result != 'failure' && needs.download-same-full-video.result != 'failure' && needs.build.result != 'cancelled' && needs.download-source.result != 'cancelled' && needs.download-same-clip.result != 'cancelled' && needs.download-same-full-video.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout generated site files
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
