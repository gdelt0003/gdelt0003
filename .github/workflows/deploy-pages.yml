name: Publish stored White House clips to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerate_clips:
        description: Attempt to download and recut source clips from YouTube
        type: boolean
        required: false
        default: false
      download_full_source:
        description: Download the full source video and attach it to a GitHub Release
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate_clips
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify ffmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Download and cut White House highlight clips
        run: python scripts/generate_default_video_batch.py

      - name: Save generated clips and manifest to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/default_batch.json generated/clips
          git diff --cached --quiet || git commit -m "chore: generate White House highlight clips"
          git push

  download-source:
    if: github.event_name == 'workflow_dispatch' && inputs.download_full_source
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Setup Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade yt-dlp
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
          }
          ffmpeg -version
          ffprobe -version
        shell: pwsh

      - name: Restore interrupted YouTube fragments
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\whitehouse-source
          key: whitehouse-source-KroMEOZ8oFo-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whitehouse-source-KroMEOZ8oFo-

      - name: Download complete White House source video
        id: download
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'whitehouse-source'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $output = Join-Path $directory 'KroMEOZ8oFo.%(ext)s'
          yt-dlp `
            --concurrent-fragments 50 `
            --js-runtimes node `
            --merge-output-format mp4 `
            --output $output `
            "https://www.youtube.com/watch?v=KroMEOZ8oFo"
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp exited with code $LASTEXITCODE" }
          $video = Join-Path $directory 'KroMEOZ8oFo.mp4'
          if (-not (Test-Path -LiteralPath $video) -or (Get-Item -LiteralPath $video).Length -eq 0) {
            throw "yt-dlp did not produce a complete MP4 source."
          }
          ffprobe -v error -select_streams v:0 `
            -show_entries stream=width,height `
            -of csv=s=x:p=0 $video
          if ($LASTEXITCODE -ne 0) { throw "ffprobe could not validate the MP4 source." }
          Get-FileHash -Algorithm SHA256 -LiteralPath $video
        shell: pwsh

      - name: Preserve partial fragments for a later retry
        if: always() && steps.download.outcome != 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\whitehouse-source
          key: whitehouse-source-KroMEOZ8oFo-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish complete source as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "white-house-source-KroMEOZ8oFo"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
              --title "White House source video KroMEOZ8oFo" `
              --notes "Complete source video downloaded from the official White House YouTube channel."
            if ($LASTEXITCODE -ne 0) { throw "Could not create the source-video release." }
          fi
          $video = Join-Path $env:RUNNER_TEMP 'whitehouse-source\KroMEOZ8oFo.mp4'
          gh release upload $tag $video --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the complete source MP4." }
        shell: pwsh

  deploy:
    needs: [build, download-source]
    if: always() && needs.build.result != 'failure' && needs.download-source.result != 'failure' && needs.build.result != 'cancelled' && needs.download-source.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout generated site files
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
