name: Publish stored White House clips to Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.json'
      - '.nojekyll'
      - 'CNAME'
      - 'assets/**'
      - 'events/**'
      - 'outputs/**'
      - 'generated/**'
  workflow_dispatch:
    inputs:
      regenerate_clips:
        description: Attempt to download and recut source clips from YouTube
        type: boolean
        required: false
        default: false
      download_full_source:
        description: Download the full source video and attach it to a GitHub Release
        type: boolean
        required: false
        default: false
      download_same_clip:
        description: Test the exact local yt-dlp section-download command on oW-PQlgw1wo
        type: boolean
        required: false
        default: false
      download_same_full_video:
        description: Test the full-video yt-dlp command on oW-PQlgw1wo without cookies
        type: boolean
        required: false
        default: false
      process_full_video:
        description: Transcribe, translate, and burn bilingual subtitles into the uploaded full video
        type: boolean
        required: false
        default: false
      process_comparison_video:
        description: Process the exact uploaded pvXbHQrIvTw source on a cloud runner and save a review artifact
        type: boolean
        required: false
        default: false
      review_comparison_artifact_run_id:
        description: Extract private rendered-frame review evidence from a completed comparison processing run
        type: string
        required: false
        default: ''
      comparison_reuse_rights_confirmed:
        description: I verified the supplied rights evidence permits processing and public adaptation of this exact source
        type: boolean
        required: false
        default: false
      comparison_same_event_source_match_confirmed:
        description: I verified this exact uploaded file is the October 13 pvXbHQrIvTw event recording
        type: boolean
        required: false
        default: false
      comparison_rights_evidence_url:
        description: HTTPS rights evidence for processing and public adaptation
        type: string
        required: false
        default: https://www.whitehouse.gov/copyright/
      comparison_identity_evidence_url:
        description: HTTPS evidence for the October 13 event identity
        type: string
        required: false
        default: https://www.youtube.com/watch?v=pvXbHQrIvTw
      comparison_source_match_evidence_url:
        description: HTTPS source evidence matched to this event
        type: string
        required: false
        default: https://www.youtube.com/watch?v=pvXbHQrIvTw
      restyle_full_video:
        description: Re-render the uploaded source video with the revised bilingual subtitle style, reusing existing translations
        type: boolean
        required: false
        default: false
      compare_full_video_translations:
        description: Translate all subtitles with ten AI models and blind-score a sample with three separate AI judges
        type: boolean
        required: false
        default: false
      translation_review_budget_usd:
        description: Maximum authorized API spend in USD for the ten-model translation and judge run
        type: number
        required: false
        default: 26
      validate_release_evidence:
        description: Validate the committed release evidence without processing media or deploying Pages
        type: boolean
        required: false
        default: false
      deploy_site_only:
        description: Deploy the current branch's static site files without processing or replacing video media
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate_clips
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify ffmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Download and cut White House highlight clips
        run: python scripts/generate_default_video_batch.py

      - name: Save generated clips and manifest to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/default_batch.json generated/clips
          git diff --cached --quiet || git commit -m "chore: generate White House highlight clips"
          git push

  download-source:
    if: github.event_name == 'workflow_dispatch' && inputs.download_full_source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Restore interrupted YouTube fragments
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/whitehouse-source
          key: whitehouse-source-KroMEOZ8oFo-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whitehouse-source-KroMEOZ8oFo-

      - name: Download complete White House source video
        id: download
        run: |
          mkdir -p "$RUNNER_TEMP/whitehouse-source"
          yt-dlp \
            --concurrent-fragments 50 \
            --js-runtimes node \
            --merge-output-format mp4 \
            --output "$RUNNER_TEMP/whitehouse-source/KroMEOZ8oFo.%(ext)s" \
            "https://www.youtube.com/watch?v=KroMEOZ8oFo"
          test -s "$RUNNER_TEMP/whitehouse-source/KroMEOZ8oFo.mp4"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height \
            -of csv=s=x:p=0 "$RUNNER_TEMP/whitehouse-source/KroMEOZ8oFo.mp4"
          shasum -a 256 "$RUNNER_TEMP/whitehouse-source/KroMEOZ8oFo.mp4"
        shell: bash

      - name: Preserve partial fragments for a later retry
        if: always() && steps.download.outcome != 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/whitehouse-source
          key: whitehouse-source-KroMEOZ8oFo-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish complete source as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="white-house-source-KroMEOZ8oFo"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "White House source video KroMEOZ8oFo" \
              --notes "Complete source video downloaded from the official White House YouTube channel."
            test $? -eq 0
          fi
          gh release upload "$tag" "$RUNNER_TEMP/whitehouse-source/KroMEOZ8oFo.mp4" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        shell: bash

  download-same-clip:
    if: github.event_name == 'workflow_dispatch' && inputs.download_same_clip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          yt-dlp --version
          ffmpeg -version

      - name: Download the same highlight with the local command
        run: |
          mkdir -p "$RUNNER_TEMP/whitehouse-clip"
          yt-dlp \
            --no-warnings \
            --download-sections '*723.2-779.0' \
            --force-keyframes-at-cuts \
            --merge-output-format mp4 \
            -f 'bestvideo[height>=1080]+bestaudio/best[height>=1080]/bestvideo+bestaudio/best' \
            -o "$RUNNER_TEMP/whitehouse-clip/arsenal-production.mp4" \
            'https://www.youtube.com/watch?v=oW-PQlgw1wo'
          test -s "$RUNNER_TEMP/whitehouse-clip/arsenal-production.mp4"
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$RUNNER_TEMP/whitehouse-clip/arsenal-production.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
            -of csv=s=x:p=0 "$RUNNER_TEMP/whitehouse-clip/arsenal-production.mp4"
          sha256sum "$RUNNER_TEMP/whitehouse-clip/arsenal-production.mp4"
        shell: bash

      - name: Upload runner test clip
        uses: actions/upload-artifact@v4
        with:
          name: whitehouse-oW-PQlgw1wo-runner-test
          path: ${{ runner.temp }}/whitehouse-clip/arsenal-production.mp4
          if-no-files-found: error
          retention-days: 3

  download-same-full-video:
    if: github.event_name == 'workflow_dispatch' && inputs.download_same_full_video
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          yt-dlp --version
          ffmpeg -version

      - name: Run the exact full-video command on the same video
        run: |
          mkdir -p "$RUNNER_TEMP/whitehouse-full-video"
          cd "$RUNNER_TEMP/whitehouse-full-video"
          yt-dlp --concurrent-fragments 50 --js-runtimes node --merge-output-format mp4 "https://www.youtube.com/watch?v=oW-PQlgw1wo"
          shopt -s nullglob
          files=( *.mp4 )
          if (( ${#files[@]} == 0 )); then
            echo "yt-dlp completed without producing an MP4 file" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            ffprobe -v error -show_entries format=duration,size \
              -of default=noprint_wrappers=1 "$file"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
              -of csv=s=x:p=0 "$file"
            sha256sum "$file"
          done
        shell: bash

      - name: Upload runner test video
        uses: actions/upload-artifact@v4
        with:
          name: whitehouse-oW-PQlgw1wo-full-video-runner-test
          path: ${{ runner.temp }}/whitehouse-full-video/*.mp4
          if-no-files-found: error
          retention-days: 3

  process-full-video:
    if: github.event_name == 'workflow_dispatch' && inputs.process_full_video
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache transcription models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-full-video-models-whisper-large-v3-turbo-m2m100-1.2b

      - name: Install ffmpeg, CJK fonts, and models
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install faster-whisper transformers sentencepiece
          ffmpeg -version

      - name: Download the uploaded source video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/full-video-input"
          gh release download white-house-source-oW-PQlgw1wo \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "President.Trump.Delivers.Remarks.Oct.6.2026.oW-PQlgw1wo.mp4" \
            --dir "$RUNNER_TEMP/full-video-input"
          mv \
            "$RUNNER_TEMP/full-video-input/President.Trump.Delivers.Remarks.Oct.6.2026.oW-PQlgw1wo.mp4" \
            "$RUNNER_TEMP/full-video-input/whitehouse-oW-PQlgw1wo-source.mp4"
          test -s "$RUNNER_TEMP/full-video-input/whitehouse-oW-PQlgw1wo-source.mp4"
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$RUNNER_TEMP/full-video-input/whitehouse-oW-PQlgw1wo-source.mp4"
        shell: bash

      - name: Generate English and Chinese subtitles and burn into the full video
        run: |
          python scripts/process_full_video.py \
            --input "$RUNNER_TEMP/full-video-input/whitehouse-oW-PQlgw1wo-source.mp4" \
            --output-dir "$RUNNER_TEMP/full-video-output"
        shell: bash

      - name: Validate full-video operation audit
        run: >-
          python scripts/verify_operation_audit.py
          --audit "$RUNNER_TEMP/full-video-output/operation-audit.json"
          --manifest "$RUNNER_TEMP/full-video-output/manifest.json"
        shell: bash

      - name: Preserve full-video operation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-video-operation-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/full-video-output/operation-audit.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish the subtitled video and SRT files to the source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload white-house-source-oW-PQlgw1wo \
            "$RUNNER_TEMP/full-video-output/whitehouse-oW-PQlgw1wo-bilingual.mp4" \
            "$RUNNER_TEMP/full-video-output/whitehouse-oW-PQlgw1wo.en.srt" \
            "$RUNNER_TEMP/full-video-output/whitehouse-oW-PQlgw1wo.zh-Hans.srt" \
            "$RUNNER_TEMP/full-video-output/whitehouse-oW-PQlgw1wo.en-zh.srt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        shell: bash

      - name: Upload Pages subtitle files
        uses: actions/upload-artifact@v4
        with:
          name: full-video-pages-subtitles
          path: |
            ${{ runner.temp }}/full-video-output/whitehouse-oW-PQlgw1wo.en-zh.vtt
            ${{ runner.temp }}/full-video-output/whitehouse-oW-PQlgw1wo.en.srt
            ${{ runner.temp }}/full-video-output/whitehouse-oW-PQlgw1wo.zh-Hans.srt
            ${{ runner.temp }}/full-video-output/whitehouse-oW-PQlgw1wo.en-zh.srt
            ${{ runner.temp }}/full-video-output/operation-audit.json
            ${{ runner.temp }}/full-video-output/manifest.json
          if-no-files-found: error
          retention-days: 30

  process-comparison-video:
    if: github.event_name == 'workflow_dispatch' && inputs.process_comparison_video
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache transcription models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-full-video-models-whisper-large-v3-turbo-m2m100-1.2b

      - name: Require source and reuse-rights attestations
        env:
          RIGHTS_CONFIRMED: ${{ inputs.comparison_reuse_rights_confirmed }}
          SAME_EVENT_CONFIRMED: ${{ inputs.comparison_same_event_source_match_confirmed }}
          RIGHTS_URL: ${{ inputs.comparison_rights_evidence_url }}
          IDENTITY_URL: ${{ inputs.comparison_identity_evidence_url }}
          SOURCE_MATCH_URL: ${{ inputs.comparison_source_match_evidence_url }}
        run: |
          if [ "$RIGHTS_CONFIRMED" != "true" ]; then
            echo "Reuse-rights confirmation is required before processing." >&2
            exit 1
          fi
          if [ "$SAME_EVENT_CONFIRMED" != "true" ]; then
            echo "Exact event/source match confirmation is required before processing." >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          for name in ("RIGHTS_URL", "IDENTITY_URL", "SOURCE_MATCH_URL"):
              url = urlparse(os.environ[name])
              if url.scheme != "https" or not url.netloc:
                  raise SystemExit(f"{name} must be an HTTPS URL.")
          PY

      - name: Install ffmpeg, CJK fonts, and transcription models
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install faster-whisper transformers sentencepiece
          ffmpeg -version

      - name: Prepare event metadata and verify the uploaded cloud asset
        env:
          GH_TOKEN: ${{ github.token }}
          RIGHTS_URL: ${{ inputs.comparison_rights_evidence_url }}
          IDENTITY_URL: ${{ inputs.comparison_identity_evidence_url }}
          SOURCE_MATCH_URL: ${{ inputs.comparison_source_match_evidence_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/comparison-input" "$RUNNER_TEMP/comparison-output"
          printf '%s' \
            '{"event_date":"2026-10-13","event_time_local":null,"time_precision":"day","timezone":null,"location":"The White House","event_type":"press gaggle upon departure","title":"President Trump Gaggles with Press Upon Departure from the White House, Oct. 13, 2026","participants":["President Trump"],"official_video_url":"https://www.youtube.com/watch?v=pvXbHQrIvTw"}' \
            > "$RUNNER_TEMP/comparison-identity.json"
          python scripts/prepare_event_production.py \
            --identity-json "$RUNNER_TEMP/comparison-identity.json" \
            --source-url "https://www.youtube.com/watch?v=pvXbHQrIvTw" \
            --identity-evidence-url "$IDENTITY_URL" \
            --source-match-evidence-url "$SOURCE_MATCH_URL" \
            --confirm-same-event-match \
            --rights-evidence-url "$RIGHTS_URL" \
            --output "$RUNNER_TEMP/comparison-event-metadata.json"
          gh api repos/"$GITHUB_REPOSITORY"/releases/assets/639463349 \
            > "$RUNNER_TEMP/comparison-input/asset-metadata.json"
          python - "$RUNNER_TEMP/comparison-input/asset-metadata.json" <<'PY'
          import json
          import sys

          asset = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "name": "pvXbHQrIvTw-source.mp4",
              "size": 262338614,
              "digest": "sha256:33bf25655531190a2d73510649b780b21343481b308f993c107d87053e067171",
              "state": "uploaded",
          }
          for key, value in expected.items():
              if asset.get(key) != value:
                  raise SystemExit(
                      f"Cloud asset {key} mismatch: expected {value!r}, "
                      f"got {asset.get(key)!r}"
                  )
          PY
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/639463349" \
            --output "$RUNNER_TEMP/comparison-input/pvXbHQrIvTw-source.mp4"
          test "$(stat -c %s "$RUNNER_TEMP/comparison-input/pvXbHQrIvTw-source.mp4")" = "262338614"
          echo "33bf25655531190a2d73510649b780b21343481b308f993c107d87053e067171  $RUNNER_TEMP/comparison-input/pvXbHQrIvTw-source.mp4" \
            | sha256sum --check
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$RUNNER_TEMP/comparison-input/pvXbHQrIvTw-source.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
            -of csv=s=x:p=0 \
            "$RUNNER_TEMP/comparison-input/pvXbHQrIvTw-source.mp4"
        shell: bash

      - name: Transcribe, translate, and render the exact uploaded source
        run: |
          python scripts/process_full_video.py \
            --input "$RUNNER_TEMP/comparison-input/pvXbHQrIvTw-source.mp4" \
            --output-dir "$RUNNER_TEMP/comparison-output" \
            --asset-prefix pvXbHQrIvTw
          python scripts/verify_operation_audit.py \
            --audit "$RUNNER_TEMP/comparison-output/operation-audit.json" \
            --manifest "$RUNNER_TEMP/comparison-output/manifest.json"
          python - "$RUNNER_TEMP/comparison-output/manifest.json" \
            "$RUNNER_TEMP/comparison-input/pvXbHQrIvTw-source.mp4" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          manifest_path, source_path = map(Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          with source_path.open("rb") as source:
              source_hash = hashlib.file_digest(source, "sha256").hexdigest()
          manifest["input_size_bytes"] = source_path.stat().st_size
          manifest["input_sha256"] = source_hash
          manifest["source_match_status"] = "operator_attested_exact_event"
          manifest["reuse_rights_status"] = "operator_attested_for_processing_and_public_adaptation"
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvXbHQrIvTw-comparison-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/comparison-output/
            ${{ runner.temp }}/comparison-event-metadata.json
            ${{ runner.temp }}/comparison-input/asset-metadata.json
          if-no-files-found: error
          retention-days: 30

  review-comparison-artifact:
    if: github.event_name == 'workflow_dispatch' && inputs.review_comparison_artifact_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout review tooling
        uses: actions/checkout@v4

      - name: Download private comparison review artifact
        uses: actions/download-artifact@v4
        with:
          name: pvXbHQrIvTw-comparison-review-${{ inputs.review_comparison_artifact_run_id }}
          path: ${{ runner.temp }}/comparison-review
          repository: ${{ github.repository }}
          run-id: ${{ inputs.review_comparison_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version

      - name: Validate exact source and extract rendered review frames
        env:
          SOURCE_RUN_ID: ${{ inputs.review_comparison_artifact_run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          python scripts/create_comparison_frame_review.py \
            --manifest "$RUNNER_TEMP/comparison-review/comparison-output/manifest.json" \
            --video "$RUNNER_TEMP/comparison-review/comparison-output/pvXbHQrIvTw-bilingual.mp4" \
            --vtt "$RUNNER_TEMP/comparison-review/comparison-output/pvXbHQrIvTw.en-zh.vtt" \
            --output-dir "$RUNNER_TEMP/comparison-review/comparison-output" \
            --source-run-id "$SOURCE_RUN_ID"
        shell: bash

      - name: Upload frame-only visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvXbHQrIvTw-frame-review-${{ inputs.review_comparison_artifact_run_id }}
          path: |
            ${{ runner.temp }}/comparison-review/comparison-output/frames/
            ${{ runner.temp }}/comparison-review/comparison-output/release-report.json
            ${{ runner.temp }}/comparison-review/comparison-output/frame-review.html
          if-no-files-found: error
          retention-days: 30

  restyle-full-video:
    if: github.event_name == 'workflow_dispatch' && inputs.restyle_full_video && !inputs.process_full_video
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-cjk
          ffmpeg -version

      - name: Download the uploaded source video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/full-video-input"
          gh release download white-house-source-oW-PQlgw1wo \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "President.Trump.Delivers.Remarks.Oct.6.2026.oW-PQlgw1wo.mp4" \
            --dir "$RUNNER_TEMP/full-video-input"
          mv \
            "$RUNNER_TEMP/full-video-input/President.Trump.Delivers.Remarks.Oct.6.2026.oW-PQlgw1wo.mp4" \
            "$RUNNER_TEMP/full-video-input/whitehouse-oW-PQlgw1wo-source.mp4"
          test -s "$RUNNER_TEMP/full-video-input/whitehouse-oW-PQlgw1wo-source.mp4"
        shell: bash

      - name: Reflow existing SRT captions and burn them into the original-resolution video
        run: |
          python scripts/process_full_video.py \
            --input "$RUNNER_TEMP/full-video-input/whitehouse-oW-PQlgw1wo-source.mp4" \
            --output-dir "$RUNNER_TEMP/full-video-output" \
            --reuse-subtitles generated/full-video
        shell: bash

      - name: Validate full-video operation audit
        run: >-
          python scripts/verify_operation_audit.py
          --audit "$RUNNER_TEMP/full-video-output/operation-audit.json"
          --manifest "$RUNNER_TEMP/full-video-output/manifest.json"
        shell: bash

      - name: Preserve full-video operation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-video-operation-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/full-video-output/operation-audit.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish the restyled video and SRT files to the source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload white-house-source-oW-PQlgw1wo \
            "$RUNNER_TEMP/full-video-output/whitehouse-oW-PQlgw1wo-bilingual.mp4" \
            "$RUNNER_TEMP/full-video-output/whitehouse-oW-PQlgw1wo.en.srt" \
            "$RUNNER_TEMP/full-video-output/whitehouse-oW-PQlgw1wo.zh-Hans.srt" \
            "$RUNNER_TEMP/full-video-output/whitehouse-oW-PQlgw1wo.en-zh.srt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        shell: bash

      - name: Upload Pages subtitle files
        uses: actions/upload-artifact@v4
        with:
          name: full-video-pages-subtitles
          path: |
            ${{ runner.temp }}/full-video-output/whitehouse-oW-PQlgw1wo.en-zh.vtt
            ${{ runner.temp }}/full-video-output/whitehouse-oW-PQlgw1wo.en.srt
            ${{ runner.temp }}/full-video-output/whitehouse-oW-PQlgw1wo.zh-Hans.srt
            ${{ runner.temp }}/full-video-output/whitehouse-oW-PQlgw1wo.en-zh.srt
            ${{ runner.temp }}/full-video-output/operation-audit.json
            ${{ runner.temp }}/full-video-output/manifest.json
          if-no-files-found: error
          retention-days: 30

  compare-full-video-translations:
    if: github.event_name == 'workflow_dispatch' && inputs.compare_full_video_translations
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compare ten translation models and three blind LLM judges
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_BUDGET_USD: ${{ inputs.translation_review_budget_usd }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Repository Actions secret OPENROUTER_API_KEY is required." >&2
            exit 1
          fi
          if [ -z "$REVIEW_BUDGET_USD" ]; then
            echo "Set translation_review_budget_usd to an explicit positive USD limit." >&2
            exit 1
          fi
          python scripts/compare_full_video_translations.py \
            --input-dir generated/full-video \
            --output-dir "$RUNNER_TEMP/translation-review" \
            --max-cost-usd "$REVIEW_BUDGET_USD" \
            --sample-size 120
        shell: bash

      - name: Preserve model outputs and blind-review report
        uses: actions/upload-artifact@v4
        with:
          name: full-video-ten-model-translation-review
          path: ${{ runner.temp }}/translation-review
          if-no-files-found: error
          retention-days: 30

  main_pages_quality_gate:
    needs: [deploy, process-full-video, restyle-full-video]
    if: >-
      always() &&
      (
        (
          github.event_name == 'push' &&
          needs.deploy.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.validate_release_evidence
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.deploy_site_only ||
            inputs.process_full_video ||
            inputs.restyle_full_video
          ) &&
          needs.deploy.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verified Pages inputs
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download the manifest for the newly rendered video
        if: needs.process-full-video.result == 'success' || needs.restyle-full-video.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: full-video-pages-subtitles
          path: generated/full-video

      - name: Verify committed full-video release evidence
        run: >-
          python scripts/verify_full_video_release.py
          --manifest generated/full-video/manifest.json

  deploy:
    needs: [build, download-source, download-same-clip, download-same-full-video, process-full-video, restyle-full-video]
    if: >-
      always() &&
      (
        (
          github.event_name == 'push'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy_site_only
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            (inputs.process_full_video || inputs.restyle_full_video) &&
            (
              !inputs.process_full_video ||
              needs.process-full-video.result == 'success'
            ) &&
            (
              !inputs.restyle_full_video ||
              inputs.process_full_video ||
              needs.restyle-full-video.result == 'success'
            )
          )
        )
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout generated site files
        uses: actions/checkout@v4

      - name: Download generated full-video subtitle files
        if: needs.process-full-video.result == 'success' || needs.restyle-full-video.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: full-video-pages-subtitles
          path: generated/full-video

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
