name: Frontend checks

on:
  push:
    paths:
      - '.github/workflows/frontend-checks.yml'
      - 'assets/app.js'
      - 'assets/style.css'
      - 'index.html'
      - 'requirements.txt'
      - 'scripts/**'
      - 'outputs/whitehouse-oct-06-2026/manifest.json'
      - 'outputs/whitehouse-oct-06-2026/*.mp4'
      - 'outputs/**/*.json'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    paths:
      - '.github/workflows/frontend-checks.yml'
      - 'assets/app.js'
      - 'assets/style.css'
      - 'index.html'
      - 'requirements.txt'
      - 'scripts/**'
      - 'outputs/whitehouse-oct-06-2026/manifest.json'
      - 'outputs/whitehouse-oct-06-2026/*.mp4'
      - 'outputs/**/*.json'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/frontend-checks.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Check frontend JavaScript syntax
        run: node --check assets/app.js

      - name: Verify published clip playback paths and aspect ratios
        run: node tests/test_frontend_assets.cjs
