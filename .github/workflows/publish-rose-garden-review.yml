name: Publish Rose Garden bilingual review video

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: Pinned event ID
        type: string
        required: true
        default: rose-garden-lunch-2026-10-15
      event_title:
        description: Pinned event title
        type: string
        required: true
        default: President Trump Participates in a Rose Garden Lunch
      event_date:
        description: Pinned event date
        type: string
        required: true
        default: "2026-10-15"
      source_url:
        description: Official-source video URL for this review
        type: string
        required: true
        default: https://www.youtube.com/watch?v=IySF_8OArvw
      source_release_tag:
        description: Uploaded source release tag
        type: string
        required: true
        default: rose-garden-lunch-source-2026-10-15
      source_asset:
        description: Exact uploaded source filename
        type: string
        required: true
        default: RoseGardenLunch-IySF_8OArvw.mp4
      source_sha256:
        description: Required SHA-256 of the uploaded source asset
        type: string
        required: true
        default: e0b04fb669fd0d09f1492de6a3160bb3b6dae2e3e396be77372f4b5635da5f73
      requester_authorized_processing:
        description: Confirm requester authorization to process this exact video
        type: boolean
        required: true
        default: false
      requester_authorized_publication:
        description: Confirm requester authorization to publish this exact video as a public external-review draft
        type: boolean
        required: true
        default: false
      rights_evidence_url:
        description: Source-specific HTTPS reuse-rights evidence required before processing
        type: string
        required: true
        default: ""
      reuse_rights_confirmed:
        description: Confirm the supplied source-specific evidence establishes reuse rights for this exact video
        type: boolean
        required: true
        default: false
      event_identity_evidence_url:
        description: HTTPS evidence establishing the event identity
        type: string
        required: true
        default: ""
      exact_event_match_confirmed:
        description: Confirm the selected source depicts this exact event
        type: boolean
        required: true
        default: false
      event_match_evidence_url:
        description: HTTPS evidence for exact source/event content match
        type: string
        required: true
        default: ""
      event_time_timezone_evidence_url:
        description: HTTPS evidence for exact event time and timezone
        type: string
        required: false
        default: ""
      source_lineage_evidence_url:
        description: HTTPS evidence for source URL to uploaded release asset lineage
        type: string
        required: false
        default: ""
      source_frame_review_record_json:
        description: Structured authorized cloud frame/BBox review evidence, required only for the Rose masking exception; non-occluding layouts keep frame review pending
        type: string
        required: true
        default: "{}"
      source_frame_review_signature:
        description: Base64 OpenSSH signature of the canonical frame-review JSON from an allowlisted reviewer key
        type: string
        required: false
        default: ""
      frame_review_mode:
        description: Draft mode uses the fixed still estimate and keeps all frame/BBox review pending; trusted mode requires an allowlisted signed source-frame review
        type: choice
        options:
          - unverified-review-draft
          - trusted-signed-review
        required: true
        default: unverified-review-draft
      caption_position:
        description: Selected caption area; defaults to the requested Rose lower-third mask
        type: choice
        options:
          - top
          - center
          - mask-lower-third
        required: true
        default: mask-lower-third
      caption_safe_region_reviewed:
        description: Confirm the source graphics BBoxes and selected caption position were visually reviewed
        type: boolean
        required: true
        default: false
      source_graphics_regions_json:
        description: Actual source graphic BBoxes; masking requires a human-verified source lower-third BBox
        type: string
        required: true
        default: "[]"
      rose_mask_authorized:
        description: Confirm use of the user-authorized Rose-only lower-third masking exception
        type: boolean
        required: true
        default: true
      mask_padding_px_per_edge:
        description: Implementation-selected outward mask expansion per edge (1–5 output pixels; default 2)
        type: number
        required: true
        default: 2

permissions:
  contents: read

concurrency:
  group: rose-garden-review-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Prepare diagnostics
        id: prepare_diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/rose-garden-diagnostics"
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/rose-garden-diagnostics/run-context.txt"
        shell: bash

      - name: Check out main
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate run authorization and pinned event/source inputs
        id: input_validation
        env:
          EVENT_ID: ${{ inputs.event_id }}
          EVENT_TITLE: ${{ inputs.event_title }}
          EVENT_DATE: ${{ inputs.event_date }}
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag }}
          SOURCE_ASSET: ${{ inputs.source_asset }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          RIGHTS_EVIDENCE_URL: ${{ inputs.rights_evidence_url }}
          EVENT_IDENTITY_EVIDENCE_URL: ${{ inputs.event_identity_evidence_url }}
          EVENT_MATCH_EVIDENCE_URL: ${{ inputs.event_match_evidence_url }}
          EVENT_TIMEZONE_EVIDENCE_URL: ${{ inputs.event_time_timezone_evidence_url }}
          SOURCE_LINEAGE_EVIDENCE_URL: ${{ inputs.source_lineage_evidence_url }}
          EXACT_EVENT_MATCH_CONFIRMED: ${{ inputs.exact_event_match_confirmed }}
          REUSE_RIGHTS_CONFIRMED: ${{ inputs.reuse_rights_confirmed }}
          PROCESSING_AUTHORIZED: ${{ inputs.requester_authorized_processing }}
          PUBLICATION_AUTHORIZED: ${{ inputs.requester_authorized_publication }}
          CAPTION_POSITION: ${{ inputs.caption_position }}
          CAPTION_SAFE_REGION_REVIEWED: ${{ inputs.caption_safe_region_reviewed }}
          SOURCE_GRAPHICS_REGIONS_JSON: ${{ inputs.source_graphics_regions_json }}
          ROSE_MASK_AUTHORIZED: ${{ inputs.rose_mask_authorized }}
          MASK_PADDING_PX_PER_EDGE: ${{ inputs.mask_padding_px_per_edge }}
          SOURCE_FRAME_REVIEW_RECORD_JSON: ${{ inputs.source_frame_review_record_json }}
          SOURCE_FRAME_REVIEW_SIGNATURE: ${{ inputs.source_frame_review_signature }}
          FRAME_REVIEW_MODE: ${{ inputs.frame_review_mode }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This production workflow may only run from main." >&2
            exit 1
          fi
          if [[ "$PROCESSING_AUTHORIZED" != "true" || "$PUBLICATION_AUTHORIZED" != "true" ]]; then
            echo "Requester authorization for processing and public review publication is required." >&2
            exit 1
          fi
          python scripts/verify_rose_garden_review.py \
            --validate-dispatch-inputs \
            --event-id "$EVENT_ID" \
            --event-title "$EVENT_TITLE" \
            --event-date "$EVENT_DATE" \
            --source-url "$SOURCE_URL" \
            --source-release-tag "$SOURCE_RELEASE_TAG" \
            --source-asset "$SOURCE_ASSET" \
            --source-sha256 "$SOURCE_SHA256" \
            --rights-evidence-url "$RIGHTS_EVIDENCE_URL" \
            --event-identity-evidence-url "$EVENT_IDENTITY_EVIDENCE_URL" \
            --event-match-evidence-url "$EVENT_MATCH_EVIDENCE_URL" \
            --event-time-timezone-evidence-url "$EVENT_TIMEZONE_EVIDENCE_URL" \
            --source-lineage-evidence-url "$SOURCE_LINEAGE_EVIDENCE_URL" \
            --exact-event-match-confirmed "$EXACT_EVENT_MATCH_CONFIRMED" \
            --reuse-rights-confirmed "$REUSE_RIGHTS_CONFIRMED"
          layout_args=(
            --validate-layout-inputs
            --caption-position "$CAPTION_POSITION"
            --source-graphics-regions-json "$SOURCE_GRAPHICS_REGIONS_JSON"
            --mask-padding-px-per-edge "$MASK_PADDING_PX_PER_EDGE"
            --frame-review-mode "$FRAME_REVIEW_MODE"
          )
          if [[ "$CAPTION_SAFE_REGION_REVIEWED" == "true" ]]; then
            layout_args+=(--caption-safe-region-reviewed)
          fi
          if [[ "$ROSE_MASK_AUTHORIZED" == "true" ]]; then
            layout_args+=(--rose-mask-authorized)
          fi
          python scripts/verify_rose_garden_review.py "${layout_args[@]}"
          review_args=(
            --validate-review-gates
            --caption-position "$CAPTION_POSITION"
            --rights-evidence-url "$RIGHTS_EVIDENCE_URL"
            --event-match-evidence-url "$EVENT_MATCH_EVIDENCE_URL"
            --event-time-timezone-evidence-url "$EVENT_TIMEZONE_EVIDENCE_URL"
            --source-lineage-evidence-url "$SOURCE_LINEAGE_EVIDENCE_URL"
            --source-frame-review-record-json "$SOURCE_FRAME_REVIEW_RECORD_JSON"
            --source-frame-review-signature "$SOURCE_FRAME_REVIEW_SIGNATURE"
            --source-graphics-regions-json "$SOURCE_GRAPHICS_REGIONS_JSON"
            --dispatch-actor "$GITHUB_ACTOR"
            --frame-review-mode "$FRAME_REVIEW_MODE"
          )
          python scripts/verify_rose_garden_review.py "${review_args[@]}"
          python - "$RUNNER_TEMP/rose-garden-diagnostics/run-context.txt" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          fields = {
              "event_id": "EVENT_ID",
              "event_title": "EVENT_TITLE",
              "event_date": "EVENT_DATE",
              "source_url": "SOURCE_URL",
              "source_release_tag": "SOURCE_RELEASE_TAG",
              "source_asset": "SOURCE_ASSET",
              "source_sha256": "SOURCE_SHA256",
              "rights_evidence_url": "RIGHTS_EVIDENCE_URL",
          }
          context_path = Path(sys.argv[1])
          context = {"run_id": os.environ["GITHUB_RUN_ID"]}
          context.update({key: os.environ[value] for key, value in fields.items()})
          context["requester_authorized_processing"] = True
          context["requester_authorized_publication"] = True
          context["independent_rights_review"] = "pending"
          context_path.with_name("run-input.json").write_text(
              json.dumps(context, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
        shell: bash

      - name: Install ffmpeg and CJK fonts
        id: install_ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-cjk
          ffmpeg -version
          ffprobe -version
        shell: bash

      - name: Download and verify the pinned uploaded source
        id: source_download
        env:
          GH_TOKEN: ${{ github.token }}
          RIGHTS_EVIDENCE_URL: ${{ inputs.rights_evidence_url }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/rose-garden-input"
          gh release download rose-garden-lunch-source-2026-10-15 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "RoseGardenLunch-IySF_8OArvw.mp4" \
            --dir "$RUNNER_TEMP/rose-garden-input" \
            2>&1 | tee "$RUNNER_TEMP/rose-garden-diagnostics/source-download.log"
          if ! python scripts/verify_rose_garden_review.py \
            --source "$RUNNER_TEMP/rose-garden-input/RoseGardenLunch-IySF_8OArvw.mp4" \
            --rights-evidence-url "$RIGHTS_EVIDENCE_URL" \
            > "$RUNNER_TEMP/rose-garden-diagnostics/source-probe.json" \
            2> "$RUNNER_TEMP/rose-garden-diagnostics/source-verify.log"; then
            cat "$RUNNER_TEMP/rose-garden-diagnostics/source-verify.log" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/rose-garden-diagnostics/source-probe.json"
        shell: bash

      - name: Cache transcription and translation models
        id: model_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-rose-garden-full-video-whisper-large-v3-turbo-m2m100-1.2b

      - name: Install CPU transcription and translation dependencies
        id: install_dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install faster-whisper transformers sentencepiece pysubs2==1.8.0
        shell: bash

      - name: Transcribe, translate, and burn bilingual captions
        id: render_video
        env:
          CAPTION_POSITION: ${{ inputs.caption_position }}
          CAPTION_SAFE_REGION_REVIEWED: ${{ inputs.caption_safe_region_reviewed }}
          SOURCE_GRAPHICS_REGIONS_JSON: ${{ inputs.source_graphics_regions_json }}
          SOURCE_FRAME_REVIEW_RECORD_JSON: ${{ inputs.source_frame_review_record_json }}
          SOURCE_FRAME_REVIEW_SIGNATURE: ${{ inputs.source_frame_review_signature }}
          FRAME_REVIEW_MODE: ${{ inputs.frame_review_mode }}
          DISPATCH_ACTOR: ${{ github.actor }}
          ROSE_MASK_AUTHORIZED: ${{ inputs.rose_mask_authorized }}
          MASK_PADDING_PX_PER_EDGE: ${{ inputs.mask_padding_px_per_edge }}
        run: |
          set -o pipefail
          render_args=(
            --input "$RUNNER_TEMP/rose-garden-input/RoseGardenLunch-IySF_8OArvw.mp4" \
            --output-dir "$RUNNER_TEMP/rose-garden-output" \
            --asset-prefix RoseGardenLunch-IySF_8OArvw \
            --subtitle-layout rose-garden-source-aware-bilingual \
            --caption-position "$CAPTION_POSITION" \
            --source-graphics-regions-json "$SOURCE_GRAPHICS_REGIONS_JSON" \
            --mask-padding-px-per-edge "$MASK_PADDING_PX_PER_EDGE" \
            --source-frame-review-record-json "$SOURCE_FRAME_REVIEW_RECORD_JSON" \
            --source-frame-review-signature "$SOURCE_FRAME_REVIEW_SIGNATURE" \
            --frame-review-mode "$FRAME_REVIEW_MODE" \
            --dispatch-actor "$DISPATCH_ACTOR"
          )
          if [[ "$CAPTION_SAFE_REGION_REVIEWED" == "true" ]]; then
            render_args+=(--caption-safe-region-reviewed)
          fi
          if [[ "$ROSE_MASK_AUTHORIZED" == "true" ]]; then
            render_args+=(--occlusion-exception-authorized)
          fi
          python scripts/process_full_video.py "${render_args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/rose-garden-diagnostics/render.log"
        shell: bash

      - name: Validate media operation audit
        id: validate_audit
        run: >-
          python scripts/verify_operation_audit.py
          --audit "$RUNNER_TEMP/rose-garden-output/operation-audit.json"
          --manifest "$RUNNER_TEMP/rose-garden-output/manifest.json"
        shell: bash

      - name: Validate render and record provenance and pending reviews
        id: finalize_manifest
        env:
          RIGHTS_EVIDENCE_URL: ${{ inputs.rights_evidence_url }}
          EVENT_IDENTITY_EVIDENCE_URL: ${{ inputs.event_identity_evidence_url }}
          EVENT_MATCH_EVIDENCE_URL: ${{ inputs.event_match_evidence_url }}
          EVENT_TIMEZONE_EVIDENCE_URL: ${{ inputs.event_time_timezone_evidence_url }}
          SOURCE_LINEAGE_EVIDENCE_URL: ${{ inputs.source_lineage_evidence_url }}
          EXACT_EVENT_MATCH_CONFIRMED: ${{ inputs.exact_event_match_confirmed }}
          REUSE_RIGHTS_CONFIRMED: ${{ inputs.reuse_rights_confirmed }}
        run: |
          python scripts/verify_rose_garden_review.py \
            --source "$RUNNER_TEMP/rose-garden-input/RoseGardenLunch-IySF_8OArvw.mp4" \
            --output-dir "$RUNNER_TEMP/rose-garden-output" \
            --rights-evidence-url "$RIGHTS_EVIDENCE_URL" \
            --event-identity-evidence-url "$EVENT_IDENTITY_EVIDENCE_URL" \
            --event-match-evidence-url "$EVENT_MATCH_EVIDENCE_URL" \
            --event-time-timezone-evidence-url "$EVENT_TIMEZONE_EVIDENCE_URL" \
            --source-lineage-evidence-url "$SOURCE_LINEAGE_EVIDENCE_URL" \
            --exact-event-match-confirmed "$EXACT_EVENT_MATCH_CONFIRMED" \
            --reuse-rights-confirmed "$REUSE_RIGHTS_CONFIRMED"
        shell: bash

      - name: Require nonempty MP4, manifest, and operation audit
        id: validate_bundle
        run: |
          test -s "$RUNNER_TEMP/rose-garden-output/RoseGardenLunch-IySF_8OArvw-bilingual.mp4"
          test -s "$RUNNER_TEMP/rose-garden-output/RoseGardenLunch-IySF_8OArvw.en-zh.ass"
          test -s "$RUNNER_TEMP/rose-garden-output/manifest.json"
          test -s "$RUNNER_TEMP/rose-garden-output/operation-audit.json"
        shell: bash

      - name: Upload unique render, manifest, and audit artifact
        id: upload_bundle
        uses: actions/upload-artifact@v4
        with:
          name: rose-garden-review-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rose-garden-output/RoseGardenLunch-IySF_8OArvw-bilingual.mp4
            ${{ runner.temp }}/rose-garden-output/RoseGardenLunch-IySF_8OArvw.en.srt
            ${{ runner.temp }}/rose-garden-output/RoseGardenLunch-IySF_8OArvw.zh-Hans.srt
            ${{ runner.temp }}/rose-garden-output/RoseGardenLunch-IySF_8OArvw.en-zh.srt
            ${{ runner.temp }}/rose-garden-output/RoseGardenLunch-IySF_8OArvw.en-zh.vtt
            ${{ runner.temp }}/rose-garden-output/RoseGardenLunch-IySF_8OArvw.en-zh.ass
            ${{ runner.temp }}/rose-garden-output/manifest.json
            ${{ runner.temp }}/rose-garden-output/operation-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect render diagnostics
        id: collect_diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/rose-garden-diagnostics"
          for name in manifest.json operation-audit.json; do
            if [[ -s "$RUNNER_TEMP/rose-garden-output/$name" ]]; then
              cp "$RUNNER_TEMP/rose-garden-output/$name" "$RUNNER_TEMP/rose-garden-diagnostics/$name"
            fi
          done
        shell: bash

      - name: Upload per-run diagnostics
        id: upload_diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rose-garden-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/rose-garden-diagnostics
          if-no-files-found: warn
          retention-days: 90

      - name: Write run outcome summary
        id: run_summary
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          PYTHON: ${{ steps.setup_python.outcome }}
          FFMPEG: ${{ steps.install_ffmpeg.outcome }}
          AUTHORIZATION: ${{ steps.input_validation.outcome }}
          SOURCE: ${{ steps.source_download.outcome }}
          DEPENDENCIES: ${{ steps.install_dependencies.outcome }}
          RENDER: ${{ steps.render_video.outcome }}
          AUDIT: ${{ steps.validate_audit.outcome }}
          MANIFEST: ${{ steps.finalize_manifest.outcome }}
          BUNDLE: ${{ steps.validate_bundle.outcome }}
          ARTIFACT: ${{ steps.upload_bundle.outcome }}
          DIAGNOSTICS: ${{ steps.upload_diagnostics.outcome }}
          MP4_PATH: ${{ runner.temp }}/rose-garden-output/RoseGardenLunch-IySF_8OArvw-bilingual.mp4
          MANIFEST_PATH: ${{ runner.temp }}/rose-garden-output/manifest.json
          AUDIT_PATH: ${{ runner.temp }}/rose-garden-output/operation-audit.json
          ARTIFACT_NAME: rose-garden-review-run-${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mp4_size="missing or empty"
          mp4_sha256="missing"
          manifest_size="missing or empty"
          audit_size="missing or empty"
          if [[ -s "$MP4_PATH" ]]; then
            mp4_size="$(stat -c '%s bytes' "$MP4_PATH")"
            mp4_sha256="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["rendered_video"]["sha256"])' "$MANIFEST_PATH" 2>/dev/null || echo missing)"
          fi
          if [[ -s "$MANIFEST_PATH" ]]; then
            manifest_size="$(stat -c '%s bytes' "$MANIFEST_PATH")"
          fi
          if [[ -s "$AUDIT_PATH" ]]; then
            audit_size="$(stat -c '%s bytes' "$AUDIT_PATH")"
          fi
          blockers=()
          for status in \
            "checkout:$CHECKOUT" \
            "Python setup:$PYTHON" \
            "ffmpeg setup:$FFMPEG" \
            "authorization:$AUTHORIZATION" \
            "source download:$SOURCE" \
            "model dependencies:$DEPENDENCIES" \
            "render:$RENDER" \
            "operation audit:$AUDIT" \
            "manifest:$MANIFEST" \
            "nonempty bundle:$BUNDLE" \
            "private artifact:$ARTIFACT"; do
            stage="${status%%:*}"
            outcome="${status#*:}"
            if [[ "$outcome" != "success" ]]; then
              blockers+=("$stage=$outcome")
            fi
          done
          {
            echo "## Rose Garden private review render"
            echo
            echo "- Run: [${GITHUB_RUN_ID}](${RUN_URL})"
            echo "- Event: \`rose-garden-lunch-2026-10-15\`"
            echo "- Source: \`RoseGardenLunch-IySF_8OArvw.mp4\` (\`e0b04fb669fd0d09f1492de6a3160bb3b6dae2e3e396be77372f4b5635da5f73\`)"
            echo "- Publication state: private Actions artifact plus a separate public Pages review preview; no public Release is created or changed."
            echo "- Review state: the Pages preview is clearly pending; source-frame, event-match, rights, ASR, and translation checks remain unverified."
            echo
            echo "| Stage | Outcome |"
            echo "| --- | --- |"
            echo "| Checkout | ${CHECKOUT:-not started} |"
            echo "| Python setup | ${PYTHON:-not started} |"
            echo "| ffmpeg/fonts setup | ${FFMPEG:-not started} |"
            echo "| Authorization and pinned inputs | ${AUTHORIZATION:-not started} |"
            echo "| Download and source probe | ${SOURCE:-not started} |"
            echo "| Model dependencies | ${DEPENDENCIES:-not started} |"
            echo "| Render/burn | ${RENDER:-not started} |"
            echo "| Operation audit | ${AUDIT:-not started} |"
            echo "| Manifest/provenance | ${MANIFEST:-not started} |"
            echo "| Nonempty output bundle | ${BUNDLE:-not started} |"
            echo "| Private MP4/manifest/audit artifact | ${ARTIFACT:-not started} |"
            echo "| Diagnostic artifact | ${DIAGNOSTICS:-not started} |"
            echo
            echo "- Unique artifact name: \`${ARTIFACT_NAME}\` (step outcome: ${ARTIFACT:-not started})"
            echo "- Rendered MP4 on runner: ${mp4_size}"
            echo "- Rendered MP4 SHA-256: \`${mp4_sha256}\`"
            echo "- Manifest on runner: ${manifest_size}"
            echo "- Operation audit on runner: ${audit_size}"
            if (( ${#blockers[@]} )); then
              echo "- **Failure/blocker:** ${blockers[*]}"
            else
              echo "- **Failure/blocker:** none; render and private artifact validation succeeded."
            fi
            echo "- Public Release creation is a separate workflow and requires five post-build review passes and protected-environment approval."
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  deploy-review-preview:
    needs: render
    if: needs.render.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download this run's private render artifact
        uses: actions/download-artifact@v4
        with:
          name: rose-garden-review-run-${{ github.run_id }}
          path: ${{ runner.temp }}/rose-garden-preview

      - name: Check out the pending review page
        uses: actions/checkout@v4

      - name: Prepare pending public Pages preview
        run: |
          python scripts/prepare_rose_garden_review_preview.py \
            --artifact-dir "$RUNNER_TEMP/rose-garden-preview" \
            --site-dir "$GITHUB_WORKSPACE" \
            --render-run-id "$GITHUB_RUN_ID"
        shell: bash

      - name: Upload Pages review preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy pending review preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write Pages preview deployment summary
        if: always()
        env:
          DEPLOY_RESULT: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Rose Garden pending Pages review preview"
            echo
            echo "- Render run: [${GITHUB_RUN_ID}](${RUN_URL})"
            echo "- Pages deployment: ${DEPLOY_RESULT:-not started}"
            echo "- URL: ${PAGE_URL:-not deployed}"
            echo "- This is a public, unreviewed preview only. It does not create or alter a GitHub Release."
            echo "- Five distinct post-build HTTPS evidence URLs and protected-environment approval remain required before Release publication."
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
