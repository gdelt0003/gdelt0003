name: Publish reviewed Rose Garden artifact

on:
  workflow_dispatch:
    inputs:
      render_run_id:
        description: Successful private Rose Garden render workflow run ID
        type: string
        required: true
      review_record_json:
        description: JSON with five built-artifact review confirmations and distinct HTTPS evidence URLs
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: rose-garden-publication-${{ inputs.render_run_id }}
  cancel-in-progress: false

jobs:
  validate-review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      render_sha: ${{ steps.render_run.outputs.head_sha }}
      render_run_id: ${{ steps.render_run.outputs.run_id }}
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Public Rose Garden publication can only be dispatched from main." >&2
          exit 1
        shell: bash

      - name: Check out main
        uses: actions/checkout@v4

      - name: Validate successful render run
        id: render_run
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_RUN_ID: ${{ inputs.render_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          run_id = os.environ["RENDER_RUN_ID"]
          if not re.fullmatch(r"\d{1,20}", run_id):
              raise SystemExit("render_run_id must be numeric.")
          result = subprocess.run(
              [
                  "gh", "run", "view", run_id,
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--json", "status,conclusion,headBranch,event,workflowName,headSha",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          run = json.loads(result.stdout)
          expected = {
              "status": "completed",
              "conclusion": "success",
              "headBranch": "main",
              "event": "workflow_dispatch",
              "workflowName": "Publish Rose Garden bilingual review video",
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(
                      f"Selected render run is not eligible: {key}={run.get(key)!r}."
                  )
          head_sha = run.get("headSha")
          if not isinstance(head_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit("Selected render run has no valid source commit SHA.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"head_sha={head_sha}\n")
              output.write(f"run_id={run_id}\n")
          PY
        shell: bash

      - name: Download the exact render artifact
        uses: actions/download-artifact@v4
        with:
          name: rose-garden-review-run-${{ inputs.render_run_id }}
          path: ${{ runner.temp }}/rose-garden-build
          run-id: ${{ inputs.render_run_id }}
          github-token: ${{ github.token }}

      - name: Validate five post-build reviews and bind them to the MP4
        env:
          REVIEW_RECORD_JSON: ${{ inputs.review_record_json }}
          RENDER_RUN_ID: ${{ inputs.render_run_id }}
          REVIEWED_BY: ${{ github.actor }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          review_path = Path(os.environ["RUNNER_TEMP"]) / "rose-garden-review-record.json"
          review_path.write_text(os.environ["REVIEW_RECORD_JSON"], encoding="utf-8")
          PY
          python scripts/verify_rose_garden_publication_review.py \
            --artifact-dir "$RUNNER_TEMP/rose-garden-build" \
            --review-json "$RUNNER_TEMP/rose-garden-review-record.json" \
            --render-run-id "$RENDER_RUN_ID" \
            --reviewed-by "$REVIEWED_BY" \
            --output "$RUNNER_TEMP/rose-garden-build/publication-review-verification.json"
          cp "$RUNNER_TEMP/rose-garden-review-record.json" \
            "$RUNNER_TEMP/rose-garden-build/publication-review-input.json"
        shell: bash

      - name: Upload validated review bundle
        uses: actions/upload-artifact@v4
        with:
          name: rose-garden-validated-review-${{ inputs.render_run_id }}
          path: ${{ runner.temp }}/rose-garden-build
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: validate-review
    runs-on: ubuntu-latest
    environment:
      name: rose-garden-publication
    permissions:
      actions: read
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      render_run_id: ${{ needs.validate-review.outputs.render_run_id }}
    steps:
      - name: Download validated review bundle
        uses: actions/download-artifact@v4
        with:
          name: rose-garden-validated-review-${{ needs.validate-review.outputs.render_run_id }}
          path: ${{ runner.temp }}/rose-garden-release

      - name: Create a new, non-overwriting review prerelease
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_RUN_ID: ${{ needs.validate-review.outputs.render_run_id }}
          RENDER_SHA: ${{ needs.validate-review.outputs.render_sha }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/rose-garden-release"
          tag="rose-garden-lunch-review-${RENDER_RUN_ID}"
          test -s "$bundle/RoseGardenLunch-IySF_8OArvw-bilingual.mp4"
          test -s "$bundle/manifest.json"
          test -s "$bundle/operation-audit.json"
          test -s "$bundle/publication-review-input.json"
          test -s "$bundle/publication-review-verification.json"
          gh release create "$tag" \
            "$bundle/RoseGardenLunch-IySF_8OArvw-bilingual.mp4" \
            "$bundle/RoseGardenLunch-IySF_8OArvw.en.srt" \
            "$bundle/RoseGardenLunch-IySF_8OArvw.zh-Hans.srt" \
            "$bundle/RoseGardenLunch-IySF_8OArvw.en-zh.srt" \
            "$bundle/RoseGardenLunch-IySF_8OArvw.en-zh.vtt" \
            "$bundle/RoseGardenLunch-IySF_8OArvw.en-zh.ass" \
            "$bundle/manifest.json" \
            "$bundle/operation-audit.json" \
            "$bundle/publication-review-input.json" \
            "$bundle/publication-review-verification.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RENDER_SHA" \
            --title "Rose Garden Lunch reviewed external-review draft (${RENDER_RUN_ID})" \
            --notes "New, per-render public external-review draft. Its five post-build review attestations and distinct HTTPS evidence URLs are bound to the MP4 SHA-256 in publication-review-verification.json. This remains an external-review draft, not final publication approval. The pre-existing rose-garden-lunch-review release is unchanged." \
            --prerelease
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
        shell: bash

  deploy-pages:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out the published site
        uses: actions/checkout@v4

      - name: Update the Rose Garden page to the reviewed release
        env:
          RELEASE_TAG: ${{ needs.publish-release.outputs.release_tag }}
          RENDER_RUN_ID: ${{ needs.publish-release.outputs.render_run_id }}
        run: |
          python scripts/update_rose_garden_review_page.py \
            --page events/rose-garden-lunch-2026-10-15/index.html \
            --release-tag "$RELEASE_TAG"
          python scripts/update_rose_garden_main_video_catalog.py \
            --main-videos outputs/main-videos.json \
            --release-tag "$RELEASE_TAG" \
            --render-run-id "$RENDER_RUN_ID"
        shell: bash

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy reviewed Pages update
        id: deployment
        uses: actions/deploy-pages@v4
