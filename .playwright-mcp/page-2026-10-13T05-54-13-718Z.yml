    - generic [ref=f163e276]:
      - heading "TASK DESCRIPTION" [level=2] [ref=f163e277]
      - generic [ref=f163e278]:
        - paragraph [ref=f163e280]: The task is to improve and evaluate current MT methods. We encourage a broad participation — if you feel that your method is interesting but not state-of-the-art, then please participate in order to disseminate it and measure progress. Participants will use their systems to translate a testset of unseen documents. The translation quality is measured by a human evaluation and various automatic evaluation metrics.
        - paragraph [ref=f163e282]:
          - text: You may participate in any or all of the language pairs. If your system is multilingual, please, participate in
          - link "Multilingual subtask" [ref=f163e283] [cursor=pointer]:
            - /url: "#multilingual-subtask"
          - text: . To lower the entry barrier, we define a constrained track allowing to compare systems from same category.
        - paragraph [ref=f163e285]:
          - text: Each participant is required to submit submission paper, which will describe the process of how the model was built and highlight in which ways their own methods and data differ from the usual training pipeline. You should make it clear which tools and training sets you used. Each participant has to submit at least one page long abstract of the system description one week after the system submission deadline. The abstract must contain, at a minimum, basic information about the system and the approaches/data/tools used. It can be a full description paper or a draft that can be later modified for the final system description paper. See the
          - link "Main page" [ref=f163e286] [cursor=pointer]:
            - /url: .
          - text: for the link to the submission site.
        - generic [ref=f163e287]:
          - heading "Constrained/Unconstrained track" [level=3] [ref=f163e288]
          - paragraph [ref=f163e290]: The General MT task has two separate tracks with different constraints on the models allowing for better comparability. Constrained models compete only against other constrained, while unconstrained compete against all.
          - list [ref=f163e292]:
            - listitem [ref=f163e293]:
              - paragraph [ref=f163e294]: Constrained open weights systems
            - listitem [ref=f163e295]:
              - paragraph [ref=f163e296]: you are allowed to use any training data, models, and frameworks, under any open source license that allows unrestricted use for non-commercial purposes (e.g. Apache, MIT, …) allowing to make your work replicable by any research group
            - listitem [ref=f163e297]:
              - paragraph [ref=f163e298]: the final model’s total number of parameters must me smaller than 20B parameters. See suggested LLMs that falls into this category below. Intermediate steps may use larger models, such as distilling.
            - listitem [ref=f163e299]:
              - paragraph [ref=f163e300]: you are required to release the model weights under some open source license before camera-ready deadline
            - listitem [ref=f163e301]:
              - paragraph [ref=f163e302]: Unconstrained track - track that do not place any limitations, neither requires publishing the model. Closed systems such as GPT are part of this track.
          - paragraph [ref=f163e304]:
            - text: Although we no longer restric training data, we currated
            - link "corpora" [ref=f163e305] [cursor=pointer]:
              - /url: mtdata
            - text: that should cover majority of available data.
          - paragraph [ref=f163e307]: "Here is a non-exhaustive list of suggested LLMs that falls into the category under 20B parameters:"
          - list [ref=f163e309]:
            - listitem [ref=f163e310]:
              - paragraph [ref=f163e311]:
                - text: "Textual:"
                - link "Aya Expanse 8B" [ref=f163e312] [cursor=pointer]:
                  - /url: https://huggingface.co/CohereForAI/aya-expanse-8b
                - text: ","
                - link "Aya 101 (13B)" [ref=f163e313] [cursor=pointer]:
                  - /url: https://huggingface.co/CohereForAI/aya-101
                - text: ","
                - link "Cohere R 7B" [ref=f163e314] [cursor=pointer]:
                  - /url: https://huggingface.co/CohereForAI/c4ai-command-r7b-12-2024
                - text: ","
                - link "Llama 7B" [ref=f163e315] [cursor=pointer]:
                  - /url: https://huggingface.co/meta-llama/Llama-2-7b-chat
                - text: ","
                - link "Llama 13B" [ref=f163e316] [cursor=pointer]:
                  - /url: https://huggingface.co/meta-llama/Llama-2-13b-chat
                - text: ","
                - link "Qwen 2.5 7B" [ref=f163e317] [cursor=pointer]:
