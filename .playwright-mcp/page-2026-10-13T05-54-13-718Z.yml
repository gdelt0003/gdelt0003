        - generic [ref=f163e326]:
          - heading "Domains" [level=3] [ref=f163e327]
          - paragraph [ref=f163e329]: "We plan following domains: news, social, speech, and literary. There may be some differences in domains for non-English source languages. All testsets will be provided as a document-level."
          - generic [ref=f163e330]:
            - heading "Speech domain" [level=4] [ref=f163e331]
            - paragraph [ref=f163e333]:
              - text: The speech domain is going to be released with the original video together with machine generated transcript. We will use only the original video as a source for human evaluation. All testsets will contain the transcript which will be generated with speech recognition model, therefore the audio is not required to be used but could improve the performance. You may utilize models such as
              - link "Whisper" [ref=f163e334] [cursor=pointer]:
                - /url: https://huggingface.co/openai/whisper-large-v3
              - text: to get a cleaner transcript.
            - paragraph [ref=f163e336]: As a useful development set, we recommend using WMT24 that was released together with videos.
          - generic [ref=f163e337]:
            - heading "Social domain" [level=4] [ref=f163e338]
            - paragraph [ref=f163e340]: In addition to the textual content, we will provide the printscreen of the original social page that may or may not be useful to the translation. However, human evaluation will use the printscreens when judging the quality of the translation.
            - paragraph [ref=f163e342]:
              - text: Our setup will have a similar printscreens as released by
              - link "WMT24++" [ref=f163e343] [cursor=pointer]:
                - /url: https://arxiv.org/pdf/2502.12404
              - text: which can be used as a development set.
        - generic [ref=f163e344]:
          - heading "Test Suites subtask" [level=3] [ref=f163e345]
          - paragraph [ref=f163e347]:
            - text: This year’s shared task will also include the “Test suites” sub-task, which has been part of WMT since 2018. The participants of the test suite track will provide challenge testsets that will be used to test specific phenomena of machine translation. More details about the test suites are provided in a
            - link "separate page" [ref=f163e348] [cursor=pointer]:
              - /url: testsuite-subtask.html
            - text: .
        - generic [ref=f163e349]:
          - heading "Multilingual subtask" [level=3] [ref=f163e350]
          - paragraph [ref=f163e352]: As modern MT systems are able to translate into multiple languages, we define additional list of languages and ask participants of multilingual subtask to translate test containing all General MT and additional languages.
          - paragraph [ref=f163e354]: Systems from multilingual subtask will also compete in General MT track as usually, but in addition are evaluated automatically for the following languages and compete in additional multilingual category.
          - paragraph [ref=f163e356]: "The sources for translation will be identical to English sources from main task, while systems will be evaluated in additional following languages:"
          - list [ref=f163e358]:
            - listitem [ref=f163e359]:
              - paragraph [ref=f163e360]: Bengali, German, Greek, Hindi, Indonesian, Italian, Kannada, Lithuanian, Marathi, Farsi (Persian), Romanian, Serbian (Cyrillic), Swedish, Thai, Turkish, Vietnamese
          - paragraph [ref=f163e362]:
            - text: A development test containing all these languages in all investigated domains is available at
            - link "WMT24++" [ref=f163e363] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/google/wmt24pp
    - generic [ref=f163e364]:
      - heading "DATA" [level=2] [ref=f163e365]
      - generic [ref=f163e366]:
        - generic [ref=f163e367]:
          - heading "Licensing" [level=3] [ref=f163e368]
          - paragraph [ref=f163e370]: The data released for the General MT task can be freely used for research purposes, we ask that you cite the shared task overview findings paper, and respect any additional citation requirements on the individual data sets. For other uses of the data, you should consult with original owners of the data sets.
        - generic [ref=f163e371]:
          - heading "Recommended training data" [level=3] [ref=f163e372]
          - paragraph [ref=f163e374]:
            - text: We aim to use publicly available datasets wherever possible.
            - link "Click here" [ref=f163e375] [cursor=pointer]:
              - /url: mtdata
            - text: "to view all details. You can download all corpora via command line:"
          - code [ref=f163e379]: "pip install mtdata==0.4.3 # on python 3.9-3.11 wget https://www.statmt.org/wmt25/mtdata/mtdata.recipes.wmt25-constrained.yml mtdata -no-pb cache -j 8 -ri \"wmt25-*\" for id in wmt25-{eng-{ara,bho,ces,est,isl,jpn,kor,rus,srp,ukr,zho},ces-{ukr,deu},jpn-zho}; do mtdata get-recipe -i $id -o $id --compress --no-merge -j 8 done"
        - generic [ref=f163e380]:
          - heading "Development Data" [level=3] [ref=f163e381]
          - paragraph [ref=f163e383]:
            - text: To evaluate your system during development, we suggest using testsets from past WMT years. For automatic evaluation, we recommend to use
            - link "COMET" [ref=f163e384] [cursor=pointer]:
              - /url: https://github.com/Unbabel/COMET
            - text: automatic metric that has been
            - link "shown to have high correlation with humans" [ref=f163e385] [cursor=pointer]:
              - /url: https://aclanthology.org/2021.wmt-1.57/
            - text: . You can use following testsets when developing your systems
          - list [ref=f163e387]:
            - listitem [ref=f163e388]:
              - paragraph [ref=f163e389]:
                - link "WMT devsets" [ref=f163e390] [cursor=pointer]:
                  - /url: https://data.statmt.org/wmt24/general-mt/wmt24_GeneralMT-devsets.zip
            - listitem [ref=f163e391]:
              - paragraph [ref=f163e392]:
                - link "WMT24++ translated into 55 languages" [ref=f163e393] [cursor=pointer]:
                  - /url: https://huggingface.co/datasets/google/wmt24pp
            - listitem [ref=f163e394]:
              - paragraph [ref=f163e395]:
                - link "NTREX-128" [ref=f163e396] [cursor=pointer]:
                  - /url: https://github.com/MicrosoftTranslator/NTREX
            - listitem [ref=f163e397]:
              - paragraph [ref=f163e398]:
                - link "Flores-200 (outdated for modern MT)" [ref=f163e399] [cursor=pointer]:
                  - /url: https://github.com/facebookresearch/flores/blob/main/flores200
    - generic [ref=f163e400]:
      - heading "EVALUATION" [level=2] [ref=f163e401]
      - generic [ref=f163e402]:
        - paragraph [ref=f163e404]:
          - text: Primary systems (for which abstract papers have been submitted to
          - link "SoftConf" [ref=f163e405] [cursor=pointer]:
            - /url: https://softconf.com/emnlp2025/wmt2025/
          - text: ) will be included in the human evaluation. We will collect subjective judgments about the translation quality from annotators based likely on the
          - link "ESA protocol" [ref=f163e406] [cursor=pointer]:
            - /url: https://aclanthology.org/2024.wmt-1.131/
          - text: ", taking the document context into account."
        - paragraph [ref=f163e408]: We are able to evaluate with humans only about 15 systems from each language pair. Therefore, for language pairs where we obtain more submissions than we can evaluate, we will prioritize constained systems and remove from human evaluation unconstrained systems with the lowest automatic performance and clear outliers with low performance under automatic evaluation. We will follow similar approach as in 2025 with AutoRank, while adding LLM-as-a-judge to metrics.
        - paragraph [ref=f163e410]: We collect translation from online services and popular LLM systems. The collection will happen during the evaluation period between releasing the testset and translation deadline.
        - generic [ref=f163e411]:
          - heading "Testset Submission" [level=3] [ref=f163e412]
          - paragraph [ref=f163e414]:
            - text: "Here is a link to OCELoT submission system:"
            - link "https://aka.ms/wmt25submissions" [ref=f163e415] [cursor=pointer]:
              - /url: https://aka.ms/wmt25submissions
          - paragraph [ref=f163e417]: "Here are detailed instructions to make submission process seamless. To participate, please, follow the steps outlined below:"
          - paragraph [ref=f163e419]:
            - text: "1) Translate blind testsets:"
            - link "wmt25.jsonl" [ref=f163e420] [cursor=pointer]:
              - /url: https://data.statmt.org/wmt25/general-mt/wmt25.jsonl
            - text: ; multimodal resources are
            - link "wmt25_genmt_assets.zip" [ref=f163e421] [cursor=pointer]:
              - /url: https://data.statmt.org/wmt25/general-mt/wmt25_genmt_assets.zip
          - list [ref=f163e423]:
            - listitem [ref=f163e424]:
              - paragraph [ref=f163e425]:
                - text: Blindset is Jsonlines formated input with several metadata. The core fields are
                - code [ref=f163e426]: tgt_lang
                - text: and
                - code [ref=f163e427]: src_text
                - text: . It also contain
                - code [ref=f163e428]: prompt_instruction
                - text: for LLMs that you may use as it is adjusted for each domain.
            - listitem [ref=f163e429]:
              - paragraph [ref=f163e430]: Blindset is document-level with paragraphs separated by double new line. You may segment it in any way, however, the translation must contain same number of paragraphs (separated by double new line). For this, we share with you following verification script (see below)
            - listitem [ref=f163e431]:
              - paragraph [ref=f163e432]: Speech domain textual information is collected by automatic speech recognition process, multimodal systems may benefit from the original video
            - listitem [ref=f163e433]:
              - paragraph [ref=f163e434]: Social domain contain original printscreens from Mastodon containing pictures
            - listitem [ref=f163e435]:
              - paragraph [ref=f163e436]: Although you can participate in only a subset of languages, we strongly encourage you to translate all languages, even those not supported by your system, and mark in the poll which languages you focussed on and which are only contrastive.
          - paragraph [ref=f163e438]:
            - text: 2) Submit translations to OCELoT[
            - link "aka.ms/wmt25submissions" [ref=f163e439] [cursor=pointer]:
              - /url: https://aka.ms/wmt25submissions
            - text: "] (deadline is 3th July AoE, please, don’t leave it to the last minute). Use verification script to double check submission"
          - list [ref=f163e441]:
            - listitem [ref=f163e442]:
              - paragraph [ref=f163e443]: You won’t get any feedback on your system in OCELoT, human references do not exist at the time of submission. You may use quality estimation (e.g. CometKiwi) to check if everything is well translated.
            - listitem [ref=f163e444]:
              - paragraph [ref=f163e445]: Select the primary system in OCELoT, in case you did multiple submissions and fill a poll about your system in OCELoT.
            - listitem [ref=f163e446]:
              - paragraph [ref=f163e447]: The output file needs to contain "hypothesis" column for your translations and contain "doc_id", "tgt_lang", "dataset_id" from blindset. Submitted in format JSON Lines.
          - paragraph [ref=f163e449]:
            - text: 3) Before 11th July AoE, submit a short abstract paper to
            - link "SoftConf" [ref=f163e450] [cursor=pointer]:
              - /url: https://softconf.com/emnlp2025/wmt2025/
            - text: . It can be a one page summary of your submission which you later replace with a system description paper, you may already submit the system description paper if you want.
          - generic [ref=f163e451]:
            - heading "Verification script" [level=4] [ref=f163e452]
            - paragraph [ref=f163e454]:
              - text: We are releasing a script
              - link "wmt_gen_mt_tool.py" [ref=f163e455] [cursor=pointer]:
                - /url: https://www2.statmt.org/wmt25/wmt_gen_mt_tool.py
              - text: "to simplify handling the blindset. Example usage:"
            - code [ref=f163e459]: "python wmt_gen_mt_tool.py --task verify-submission ARGS # to verify, you maintained paragraph alignment python wmt_gen_mt_tool.py --task split-documents-into-paragraphs ARGS # To simplify paragraph level translation python wmt_gen_mt_tool.py --task merge-paragraphs-into-documents ARGS # This needs to be used to merge back to the document-level"
