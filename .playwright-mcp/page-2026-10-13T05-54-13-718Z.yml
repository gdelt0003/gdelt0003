    - generic [ref=f163e111]:
      - heading "DESCRIPTION" [level=2] [ref=f163e112]
      - generic [ref=f163e113]:
        - paragraph [ref=f163e115]:
          - text: Formerly known as News translation task of the
          - link "WMT" [ref=f163e116] [cursor=pointer]:
            - /url: index.html
          - text: focusses on evaluation of general capabilities of machine translation (MT) systems. Its primary goal is to test performance across a wide range of languages, domains, genres, and modalities. Systems are evaluated with humans.
        - paragraph [ref=f163e118]: "In addition to the main General MT task, there are two separate subtasks:"
        - list [ref=f163e120]:
          - listitem [ref=f163e121]:
            - paragraph [ref=f163e122]:
              - link "Test suite subtask" [ref=f163e123] [cursor=pointer]:
                - /url: testsuite-subtask.html
              - text: "- design challenge testset and analyze the system translations"
          - listitem [ref=f163e124]:
            - paragraph [ref=f163e125]:
              - link "Multilingual subtask" [ref=f163e126] [cursor=pointer]:
                - /url: "#multilingual-subtask"
              - text: "- develop a system that can translate into multiple languages simultaneously. The participating system needs to translate all General MT + additional 15 languages"
        - paragraph [ref=f163e128]: "The goals of the shared translation task are:"
        - list [ref=f163e130]:
          - listitem [ref=f163e131]:
            - paragraph [ref=f163e132]: To investigate the applicability of current MT techniques when translating into languages other than English across various domains
          - listitem [ref=f163e133]:
            - paragraph [ref=f163e134]: To investigate the translation of low-resource, morphologically rich languages
          - listitem [ref=f163e135]:
            - paragraph [ref=f163e136]: To create publicly available testset for machine translation evaluation
          - listitem [ref=f163e137]:
            - paragraph [ref=f163e138]: To generate up-to-date performance scores in order to provide a basis of comparison in future research
          - listitem [ref=f163e139]:
            - paragraph [ref=f163e140]: To offer newcomers a smooth start with hands-on experience in state-of-the-art machine translation methods
          - listitem [ref=f163e141]:
            - paragraph [ref=f163e142]: To investigate the usefulness of multilingual and third language resources
          - listitem [ref=f163e143]:
            - paragraph [ref=f163e144]: To assess the effectiveness of document-level approaches and uses of non-textual modalities
        - paragraph [ref=f163e146]: We hope that both beginners and established research groups will participate in this task.
        - generic [ref=f163e147]:
          - heading "Main changes of 2025" [level=3] [ref=f163e148]
          - list [ref=f163e150]:
            - listitem [ref=f163e151]:
              - paragraph [ref=f163e152]: "New modalities as an additional context: video, image"
            - listitem [ref=f163e153]:
              - paragraph [ref=f163e154]: Testset will be document-level by default rather than paragraph-level with document context
            - listitem [ref=f163e155]:
              - paragraph [ref=f163e156]: "Redefined constrained/open/closed tracks. Only two tracks:"
              - list [ref=f163e158]:
                - listitem [ref=f163e159]:
                  - paragraph [ref=f163e160]: constrained open weights track - any public training data allowed, any public model smaller than 20B is allowed, model must be publicly released
                - listitem [ref=f163e161]:
                  - paragraph [ref=f163e162]: unconstrained track - no limitations, only system description paper is required
            - listitem [ref=f163e163]:
              - paragraph [ref=f163e164]: New language pairs (English-Arabic, English-Estonian, English-Korean, English-Serbian, Czech-German, English-Bhojpuri, English-Maasai)
            - listitem [ref=f163e165]:
              - paragraph [ref=f163e166]:
                - text: New
                - link "Multilingual subtask" [ref=f163e167] [cursor=pointer]:
                  - /url: "#multilingual-subtask"
                - text: "- participating systems are required to translate ~30 language pairs"
            - listitem [ref=f163e168]:
              - paragraph [ref=f163e169]: "Testsets will focus on four different domains:"
              - list [ref=f163e171]:
                - listitem [ref=f163e172]:
                  - paragraph [ref=f163e173]: News - we employ difficulty sampling to select most challenging articles
                - listitem [ref=f163e174]:
                  - paragraph [ref=f163e175]: Speech - we provide ASR transcript together with the original video
                - listitem [ref=f163e176]:
                  - paragraph [ref=f163e177]: Social - in addition to textual content, we provide printscreen image that may contain useful context
                - listitem [ref=f163e178]:
                  - paragraph [ref=f163e179]: Literary - a domain focussing on a long-context
            - listitem [ref=f163e180]:
              - paragraph [ref=f163e181]: Providing preamble prompt for each domain containing translation brief of expected translation output useful with instruction LLMs
            - listitem [ref=f163e182]:
              - paragraph [ref=f163e183]: XML format will be replaced with JSONs
            - listitem [ref=f163e184]:
              - paragraph [ref=f163e185]: Automatic system ranking will be based on panel of LLM-as-a-judge to minimize the metric bias
