                - /url: "#Size"
            - paragraph [ref=e1185]: "The final displayed size of closed captions text is determined by multiple factors: the instructions in the subtitle file, the processor and the set of installed fonts available to it, the device screen size and resolution and (on some devices) also user-defined preferences."
            - paragraph [ref=e1186]: While it is not possible (or advisable) to pre-determine the final subtitle size, adhering to the below guidelines will ensure that subtitles are legible at a typical distance from the device and that lines do not reflow or overflow for the vast majority of users. In particular, the final size should never be larger than the authored size so that the subtitler can ensure that important parts of the of the video are not obscured.
            - generic [ref=e1187]:
              - heading "9.2.1 Authoring font size" [level=5] [ref=e1188]
              - link "Link to Authoring font size" [ref=e1189] [cursor=pointer]:
                - /url: "#Authoring-font-size"
            - paragraph [ref=e1191]: Font size should be set to fit within a line height in the range 7% to 8% of the active video height for 16:9, 4:3 and 1:1 aspect ratio videos, for example a computed line height of 7.5% would be acceptable.
            - paragraph [ref=e1192]: Font size should be set to fit within a line height in the range 3.9% to 4.5% of the active video height for 9:16 aspect ratio videos, for example a computed line height of 4.2% would be acceptable.
            - paragraph [ref=e1193]: This font height is the largest size needed for presentation and is an authoring requirement.
            - img "Image showing line height being 8% of active video height, character height being sized to fit" [ref=e1194]
            - paragraph [ref=e1195]:
              - text: Use a wide font such as Reith Sans when authoring subtitles (see
              - link "Fonts" [ref=e1196] [cursor=pointer]:
