            - paragraph [ref=e614]: In the examples given above, no markers are used to indicate that segmentation is taking place. It is also acceptable to use sequences of dots (three at the end of a to-be-continued subtitle, and two at the beginning of a continuation) to mark the fact that a segmentation is taking place, especially in legacy subtitle files.
            - complementary [ref=e615]:
              - paragraph [ref=e616]:
                - text: Because line breaks require considering all of the above, they are better inserted manually. Implementers should avoid automatic line breaking. See the
                - link [ref=e617] [cursor=pointer]:
