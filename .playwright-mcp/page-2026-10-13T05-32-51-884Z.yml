              - heading "4.1 Target minimum timing" [level=4] [ref=e674]
              - link "Link to Target minimum timing" [ref=e675] [cursor=pointer]:
                - /url: "#Target-minimum-timing"
            - paragraph [ref=e677]: Based on the recommended rate of 160-180 words per minute, you should aim to leave a subtitle on screen for a minimum period of around 0.3 seconds per word (e.g. 1.2 seconds for a 4-word subtitle). However, timings are ultimately an editorial decision that depends on other considerations, such as the speed of speech, text editing and shot synchronisation. When assessing the amount of time that a subtitle needs to remain on the screen, think about much more than the number of words on the screen; this would be an unacceptably crude approach.
            - generic [ref=e678]:
              - heading "4.2 When to give less time" [level=4] [ref=e679]
              - link "Link to When to give less time" [ref=e680] [cursor=pointer]:
                - /url: "#When-to-give-less-time"
            - paragraph [ref=e682]: "Do not dip below the target timing unless there is no other way of getting round a problem. Circumstances which could mean giving less reading time are:"
            - generic [ref=e683]:
              - heading "4.2.1 Shot changes" [level=5] [ref=e684]
              - link "Link to Shot changes" [ref=e685] [cursor=pointer]:
                - /url: "#Shot-changes"
            - paragraph [ref=e687]: Give less time if the target timing would involve clipping a shot, or crossing into an unrelated, "empty" [containing no speech] shot. However, always consider the alternative of merging with another subtitle.
            - generic [ref=e688]:
              - heading "4.2.2 Lip reading" [level=5] [ref=e689]
              - link "Link to Lip reading" [ref=e690] [cursor=pointer]:
                - /url: "#Lip-reading"
            - paragraph [ref=e692]: "Give less time to avoid editing out words that can be lip-read, but only in very specific circumstances: i.e. when a word or phrase can be read very clearly even by non-lip-readers, and if it would look ridiculous to take out or change the word."
            - generic [ref=e693]:
              - heading "4.2.3 Catchwords" [level=5] [ref=e694]
              - link "Link to Catchwords" [ref=e695] [cursor=pointer]:
                - /url: "#Catchwords"
            - paragraph [ref=e697]: Avoid editing out catchwords if a phrase would become unrecognisable if edited.
            - generic [ref=e698]:
              - heading "4.2.4 Retaining humour" [level=5] [ref=e699]
              - link "Link to Retaining humour" [ref=e700] [cursor=pointer]:
                - /url: "#Retaining-humour"
            - paragraph [ref=e702]: Give less time if a joke would be destroyed by adhering to the standard timing, but only if there is no other way around the problem, such as merging or crossing a shot.
            - generic [ref=e703]:
              - heading "4.2.5 Critical information" [level=5] [ref=e704]
              - link "Link to Critical information" [ref=e705] [cursor=pointer]:
                - /url: "#Critical-information"
            - paragraph [ref=e707]: In a news item or factual content, the main aim is to convey the "what, when, who, how, why". If an item is already particularly concise, it may be impossible to edit it into subtitles at standard timings without losing a crucial element of the original.
            - generic [ref=e708]:
              - heading "4.2.6 Very technical items" [level=5] [ref=e709]
              - link "Link to Very technical items" [ref=e710] [cursor=pointer]:
                - /url: "#Very-technical-items"
            - paragraph [ref=e712]: These may be similarly hard to edit. For instance, a detailed explanation of an economic or scientific story may prove almost impossible to edit without depriving the viewer of vital information. In these situations a subtitler should be prepared to vary the timing to convey the full meaning of the original.
            - generic [ref=e713]:
              - heading "4.3 When to give extra time" [level=4] [ref=e714]
              - link "Link to When to give extra time" [ref=e715] [cursor=pointer]:
                - /url: "#When-to-give-extra-time"
            - paragraph [ref=e717]: "Try to allow extra reading time for your subtitles in the following circumstances:"
            - generic [ref=e718]:
              - heading "4.3.1 Unfamiliar words" [level=5] [ref=e719]
              - link "Link to Unfamiliar words" [ref=e720] [cursor=pointer]:
                - /url: "#Unfamiliar-words"
            - paragraph [ref=e722]: Try to give more generous timings whenever you consider that viewers might find a word or phrase extremely hard to read without more time.
            - generic [ref=e723]:
              - heading "4.3.2 Several speakers" [level=5] [ref=e724]
              - link "Link to Several speakers" [ref=e725] [cursor=pointer]:
                - /url: "#Several-speakers"
            - paragraph [ref=e727]: Aim to give more time when there are several speakers in one subtitle.
            - generic [ref=e728]:
              - heading "4.3.3 Labels" [level=5] [ref=e729]
              - link "Link to Labels" [ref=e730] [cursor=pointer]:
                - /url: "#Labels"
            - paragraph [ref=e732]: Allow an extra second for labels where possible, but only if appropriate.
            - generic [ref=e733]:
              - heading "4.3.4 Visuals and graphics" [level=5] [ref=e734]
              - link "Link to Visuals and graphics" [ref=e735] [cursor=pointer]:
                - /url: "#Visuals-and-graphics"
            - paragraph [ref=e737]: When there is a lot happening in the picture, e.g. a football match or a map, allow viewers enough time both to read the subtitle and to take in the visuals.
            - generic [ref=e738]:
              - heading "4.3.5 Placed subtitles" [level=5] [ref=e739]
              - link "Link to Placed subtitles" [ref=e740] [cursor=pointer]:
                - /url: "#Placed-subtitles"
            - paragraph [ref=e742]: If, for example, two speakers are placed in the same subtitle, and the person on the right speaks first, the eye has more work to do, so try to allow more time.
            - generic [ref=e743]:
              - heading "4.3.6 Long figures" [level=5] [ref=e744]
              - link "Link to Long figures" [ref=e745] [cursor=pointer]:
                - /url: "#Long-figures"
            - paragraph [ref=e747]: Give viewers more time to read long figures (e.g. 12,353).
            - generic [ref=e748]:
              - heading "4.3.7 Shot changes" [level=5] [ref=e749]
              - link "Link to Shot changes" [ref=e750] [cursor=pointer]:
                - /url: "#Shot-changes-2"
            - paragraph [ref=e752]: Aim for longer timing if your subtitle crosses one shot or more, as viewers will need longer to read it.
            - generic [ref=e753]:
              - heading "4.3.8 Slow speech" [level=5] [ref=e754]
              - link "Link to Slow speech" [ref=e755] [cursor=pointer]:
                - /url: "#Slow-speech"
            - paragraph [ref=e757]: Slower timings should be used to keep in sync with slow speech.
            - generic [ref=e758]:
              - heading "4.4 Use consistent timing" [level=4] [ref=e759]
              - link "Link to Use consistent timing" [ref=e760] [cursor=pointer]:
                - /url: "#Use-consistent-timing"
            - paragraph [ref=e762]: "It is also very important to keep your timings consistent. For instance, if you have given 3:12 for one subtitle, you must not then give 4:12 to subsequent subtitles of similar length - unless there is a very good reason: e.g. slow speaker/on-screen action."
            - generic [ref=e763]:
              - heading "4.5 Gaps" [level=4] [ref=e764]
              - link "Link to Gaps" [ref=e765] [cursor=pointer]:
                - /url: "#Gaps"
            - paragraph [ref=e767]: If there is a pause between two pieces of speech, you may leave a gap between the subtitles - but this must be a minimum of one second, preferably a second and a half. Anything shorter than this produces a very jerky effect. Try to not squeeze gaps in if the time can be used for text.
          - generic [ref=e768]:
            - generic [ref=e769]:
              - heading "5 Synchronisation" [level=3] [ref=e770]
              - link "Link to Synchronisation" [ref=e771] [cursor=pointer]:
                - /url: "#Synchronisation"
            - generic [ref=e773]:
              - heading "5.1 Match subtitle to speech onset" [level=4] [ref=e774]
              - link "Link to Match subtitle to speech onset" [ref=e775] [cursor=pointer]:
                - /url: "#Match-subtitle-to-speech-onset"
            - paragraph [ref=e777]: Impaired viewers make use of visual cues from the faces of television speakers. Therefore subtitle appearance should coincide with speech onset. Subtitle disappearance should coincide roughly with the end of the corresponding speech segment, since subtitles remaining too long on the screen are likely to be re-read by the viewer.
            - paragraph [ref=e778]: When two or more people are speaking, it is particularly important to keep in sync. Subtitles for new speakers must, as far as possible, come up as the new speaker starts to speak. Whether this is possible will depend on the action on screen and rate of speech.
            - paragraph [ref=e779]: The same rules of synchronisation should apply with off-camera speakers and even with off-screen narrators, since viewers with a certain amount of residual hearing make use of auditory cues to direct their attention to the subtitle area.
            - generic [ref=e780]:
              - heading "5.2 Match subtitle to pace of speaking" [level=4] [ref=e781]
              - link "Link to Match subtitle to pace of speaking" [ref=e782] [cursor=pointer]:
                - /url: "#Match-subtitle-to-pace-of-speaking"
            - paragraph [ref=e784]: The subtitles should match the pace of speaking as closely as possible. Ideally, when the speaker is in shot, your subtitles should not anticipate speech by more than 1.5 seconds or hang up on the screen for more than 1.5 seconds after speech has stopped.
            - paragraph [ref=e785]: However, if the speaker is very easy to lip-read, slipping out of sync even by a second may spoil any dramatic effect and make the subtitles harder to follow. The subtitle should not be on the screen after the speaker has disappeared.
            - paragraph [ref=e786]: Note that some decoders might override the end timing of a subtitle so that it stays on screen until the next one appears. This is a non-compliant behaviour that the subtitle author and broadcaster have no control over.
            - complementary [ref=e787]:
              - paragraph [ref=e788]:
                - text: Decoders need to match the begin and end timing specified in documents as closely as possible to maintain the careful synchronisation we expect from subtitle authors. In particular, see Annex E of
                - link "EBU-TT-D" [ref=e789] [cursor=pointer]:
                  - /url: https://tech.ebu.ch/publications/tech3380
                - text: regarding quantisation of timing for example if the video can only be presented at a low frame rate, such as in poor network conditions.
            - generic [ref=e790]:
              - heading "5.3 Display subtitles when lips are moving" [level=4] [ref=e791]
              - link "Link to Display subtitles when lips are moving" [ref=e792] [cursor=pointer]:
                - /url: "#Display-subtitles-when-lips-are-moving"
            - paragraph [ref=e794]:
              - text: A subtitle (or an explanatory label) should always be on the screen if someone's lips are moving. If a speaker speaks very slowly, then the subtitles will have to be slow, too - even if this means breaking the timing conventions. If a speaker speaks very fast, you have to edit as much as is necessary in order to meet the timing requirements (see
              - link "timing" [ref=e795] [cursor=pointer]:
                - /url: "#Timing"
              - text: ).
            - generic [ref=e796]:
              - heading "5.4 Keep lag behind speech to a minimum" [level=4] [ref=e797]
              - link "Link to Keep lag behind speech to a minimum" [ref=e798] [cursor=pointer]:
                - /url: "#Keep-lag-behind-speech-to-a-minimum"
            - paragraph [ref=e800]: Your aim is to minimise lag between speech and the appearance of the subtitle. But sometimes, in order to meet other requirements (e.g. matching shots), you will find it difficult to avoid slipping slightly out of sync. In this case, subtitles should never appear more than 2 seconds after the words were spoken. This should be avoided by editing the previous subtitles.
            - paragraph [ref=e801]: It is permissible to slip out of sync when you have a sequence of subtitles for a single speaker, providing the subtitles are back in sync by the end of the sequence.
            - paragraph [ref=e802]: If the speech belongs to an out-of-shot speaker or is voice-over commentary, then it's not so essential for the subtitles to keep in sync.
            - generic [ref=e803]:
              - heading "5.5 Do not pre-empt an effect" [level=4] [ref=e804]
              - link "Link to Do not pre-empt an effect" [ref=e805] [cursor=pointer]:
                - /url: "#Do-not-pre-empt-an-effect"
            - paragraph [ref=e807]: Do not bring in any dramatic subtitles too early. For example, if there is a loud bang at the end of, say, a two-second shot, do not anticipate it by starting the label at the beginning of the shot. Wait until the bang actually happens, even if this means a fast timing.
            - generic [ref=e808]:
              - heading "5.6 Keep speakers separate" [level=4] [ref=e809]
              - link "Link to Keep speakers separate" [ref=e810] [cursor=pointer]:
                - /url: "#Keep-speakers-separate"
            - paragraph [ref=e812]: Do not simultaneously caption different speakers if they are not speaking at the same time.
          - generic [ref=e813]:
            - generic [ref=e814]:
              - heading "6 Matching shots" [level=3] [ref=e815]
              - link "Link to Matching shots" [ref=e816] [cursor=pointer]:
                - /url: "#Matching-shots"
            - generic [ref=e818]:
              - heading "6.1 Match subtitles to shot" [level=4] [ref=e819]
              - link "Link to Match subtitles to shot" [ref=e820] [cursor=pointer]:
                - /url: "#Match-subtitles-to-shot"
            - paragraph [ref=e822]: It is likely to be less tiring for the viewer if shot changes and subtitle changes occur at the same time. Many subtitles therefore start on the first frame of the shot and end on the last frame.
            - generic [ref=e823]:
              - heading "6.2 Maintain a minimum gap when mismatched" [level=4] [ref=e824]
              - link "Link to Maintain a minimum gap when mismatched" [ref=e825] [cursor=pointer]:
                - /url: "#Maintain-a-minimum-gap-when-mismatched"
            - paragraph [ref=e827]: If you have to let a subtitle hang over a shot change, do not remove it too soon after the cut. The duration of the overhang will depend on the content.
            - generic [ref=e828]:
              - heading "6.3 Avoid straddling shot changes" [level=4] [ref=e829]
              - link "Link to Avoid straddling shot changes" [ref=e830] [cursor=pointer]:
                - /url: "#Avoid-straddling-shot-changes"
            - paragraph [ref=e832]: Avoid creating subtitles that straddle a shot change (i.e. a subtitle that starts in the middle of shot one and ends in the middle of shot two). To do this, you may need to split a sentence at an appropriate point, or delay the start of a new sentence to coincide with the shot change.
            - complementary [ref=e833]:
              - paragraph [ref=e834]: Authoring tools may use automated shot detection to avoid this scenario.
            - generic [ref=e835]:
              - heading "6.4 Merge subtitles for short shots" [level=4] [ref=e836]
              - link "Link to Merge subtitles for short shots" [ref=e837] [cursor=pointer]:
                - /url: "#Merge-subtitles-for-short-shots"
            - paragraph [ref=e839]: If one shot is too fast for a subtitle, then you can merge the speech for two shots – provided your subtitle then ends at the second shot change.
            - paragraph [ref=e840]: "Bear in mind, however, that it will not always be appropriate to merge the speech from two shots: e.g. if it means that you are thereby \"giving the game away\" in some way. For example, if someone sneezes on a very short shot, it is more effective to leave the \"Atchoo!\" on its own with a fast timing (or to merge it with what comes afterwards) than to anticipate it by merging with the previous subtitle."
            - generic [ref=e841]:
              - heading "6.5 End subtitle with speech" [level=4] [ref=e842]
              - link "Link to End subtitle with speech" [ref=e843] [cursor=pointer]:
                - /url: "#End-subtitle-with-speech"
            - paragraph [ref=e845]: Where possible, avoid extending a subtitle into the next shot when the speaker has stopped speaking, particularly if this is a dramatic reaction shot.
            - generic [ref=e846]:
              - heading "6.6 End subtitle with scene" [level=4] [ref=e847]
              - link "Link to End subtitle with scene" [ref=e848] [cursor=pointer]:
                - /url: "#End-subtitle-with-scene"
            - paragraph [ref=e850]: Never carry a subtitle over into the next shot if this means crossing into another scene or if it is obvious that the speaker is no longer around (e.g. if they have left the room).
            - generic [ref=e851]:
              - heading "6.7 Wait for scene change to subtitle speaker" [level=4] [ref=e852]
              - link "Link to Wait for scene change to subtitle speaker" [ref=e853] [cursor=pointer]:
                - /url: "#Wait-for-scene-change-to-subtitle-speaker"
            - paragraph [ref=e855]: Some film techniques introduce the soundtrack for the next scene before the scene change has occurred. If possible, the subtitler should wait for the scene change before displaying the subtitle. If this is not possible, the subtitle should be clearly labelled to explain the technique.
