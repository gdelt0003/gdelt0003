                - generic [ref=e2727]:
                  - heading "23.3 Timecode" [level=4] [ref=e2728]
                  - link "Link to Timecode" [ref=e2729] [cursor=pointer]:
                    - /url: "#Timecode"
                - paragraph [ref=e2731]:
                  - text: The Time Code Out (TCO) values in STL files are
                  - emphasis [ref=e2732]: inclusive
                  - text: of the last frame; in other words the subtitle shall be visible on the frame indicated in the TCO value but not on subsequent frames. This differs from the end time expressions in EBU-TT and TTML, which are
                  - emphasis [ref=e2733]: exclusive
                  - text: .
                - paragraph [ref=e2734]:
                  - text: For example, in an STL file a subtitle with a TCO of
                  - code [ref=e2735]: 10:10:10:20
                  - text: would map in an EBU-TT document to an
                  - code [ref=e2736]: end
                  - text: attribute value of
                  - code [ref=e2737]: 10:10:10:21
                  - text: .
                - generic [ref=e2738]:
                  - heading "23.4 Subtitle zero" [level=4] [ref=e2739]
                  - link "Link to Subtitle zero" [ref=e2740] [cursor=pointer]:
                    - /url: "#Subtitle-zero"
                - paragraph [ref=e2742]: It is common practice to place metadata (programme ID, name etc.) in a subtitle at the beginning of the file. This first subtitle is typically known as 'subtitle zero' and is used for example to check that the correct subtitles have been loaded during pre-roll. A 'subtitle zero' is not intended to be broadcast, and this is achieved by setting the in-cue and out-cue times for this subtitle earlier than the first timecode value that occurs in the corresponding media (for example, setting subtitle zero to display between 00:00:00 and 00:00:01 when the programme starts at 10:00:00).
                - paragraph [ref=e2743]:
                  - text: Subtitles that begin (TCI) at timecode
                  - code [ref=e2744]: 00:00:00:00
                  - text: in documents that have a start of programme timecode (TCP) other than
                  - code [ref=e2745]: "00000000"
                  - text: SHALL end (TCO) no later than
                  - code [ref=e2746]: 00:00:00:02
                  - text: ", in other words they must have a duration no longer than 3 frames. They SHOULD have a duration of 1 frame."
                - paragraph [ref=e2747]: "Subtitle Zero is optional but common in legacy STL files. When an STL file is embedded in an EBU-TT document, the subtitle zero must be handled as detailed below:"
                - table [ref=e2748]:
                  - rowgroup [ref=e2752]:
                    - row [ref=e2753]:
                      - columnheader "File" [ref=e2754]
                      - columnheader "Notes" [ref=e2755]
                  - rowgroup [ref=e2756]:
                    - row [ref=e2757]:
                      - cell "EBU-TT v1.0" [ref=e2758]
                      - cell [ref=e2759]:
                        - paragraph [ref=e2760]: Subtitle zero MAY be included in the body of the document.
                        - paragraph [ref=e2761]: If the subtitle zero is included in the embedded STL file and is included in the body of the EBU-TT document then they SHALL be identical.
                        - paragraph [ref=e2762]:
                          - text: If the subtitle zero is included in the body of the EBU-TT document then it SHALL have an
                          - code [ref=e2763]: end
                          - text: attribute no later than
                          - code [ref=e2764]: 00:00:00:03
                          - text: .
                        - paragraph [ref=e2765]: If subtitle zero is not included in the embedded STL file then the EBU-TT file SHALL NOT contain a subtitle zero.
                    - row [ref=e2766]:
                      - cell "EBU-TT v1.1" [ref=e2767]
                      - cell [ref=e2768]:
                        - paragraph [ref=e2769]: Subtitle zero MAY be included in the body of the document.
                        - paragraph [ref=e2770]:
                          - text: If a subtitle zero is included in the embedded STL file then its content SHALL be copied into
                          - code [ref=e2771]: ebuttm:subtitleZero
                          - text: element.
                        - paragraph [ref=e2772]:
                          - text: If the subtitle zero is included in the embedded STL file and is included in the body of the EBU-TT document then they SHALL be identical. See
                          - link "ebuttm:documentMetadata" [ref=e2773] [cursor=pointer]:
                            - /url: "#ebuttm-documentMetadata-elements--v1-1"
                          - text: .
                        - paragraph [ref=e2774]:
                          - text: If the subtitle zero is included in the body of the EBU-TT document then it SHALL have an
                          - code [ref=e2775]: end
                          - text: attribute no later than
                          - code [ref=e2776]: 00:00:00:03
                          - text: .
                        - paragraph [ref=e2777]:
                          - text: If a subtitle zero is not included in the embedded STL file then the element
                          - code [ref=e2778]: ebuttm:subtitleZero
                          - text: SHALL NOT be included.
              - generic [ref=e2779]:
                - generic [ref=e2780]:
                  - heading "24 EBU-TT file" [level=3] [ref=e2781]
                  - link "Link to EBU-TT file" [ref=e2782] [cursor=pointer]:
                    - /url: "#EBU-TT-file"
                - paragraph [ref=e2784]: "EBU-TT is the BBC's strategic file format for capturing subtitles and associated metadata. The BBC needs to continue to operate systems that use older formats such as Teletext: in cases where those legacy systems impose constraints, those constraints are incorporated into these guidelines. In the future, as legacy systems are phased out, the constrained requirements will be relaxed. Where we have control over the distribution and presentation chain those constraints are already removed; for example the requirements for EBU-TT-D delivery for online distribution allow greater flexibility in how to achieve the presentation requirements."
                - paragraph [ref=e2785]: Teletext and STL constraints
                - paragraph [ref=e2786]:
                  - text: Teletext is still used on some platforms to carry and/or display subtitles; the BBC expects EBU-TT files that preserve some aspects of this technology (or that have been converted from STL files). For example, Teletext uses a fixed grid of 40x24 cells that (for BBC use) must be preserved in EBU-TT files authored for linear broadcast (
                  - code [ref=e2787]: ttp:cellResolution="40 24"
                  - text: ), even though EBU-TT does not require use of this specific grid. Subtitles authored for non-linear platforms are already free of these constraints. For example, EBU-TT-D files for online distribution can use the default cell resolution of 32x15 (see
                  - link "EBU-TT-D cell resolution" [ref=e2788] [cursor=pointer]:
                    - /url: "#ttp-cellResolution"
                  - text: ).
                - paragraph [ref=e2789]: When present, the STL file(s) must be embedded in an EBU-TT document. See below for further details.
                - paragraph [ref=e2790]: Embedded STL files may be omitted if the subtitles are created live and then captured.
                - paragraph [ref=e2791]: Avoid pixel units
                - paragraph [ref=e2792]:
                  - text: Although EBU-TT allows pixel length units, the BBC requires that only percent or cell units are used. Pixel length values are sometimes misunderstood in the context of video resolutions. It is less confusing to avoid use of pixel units when authoring resolution-independent content. It is also simpler to transform EBU-TT Part 1 into EBU-TT-D if pixel units are not used, since no calculations need to be made relating pixel values to the
                  - link [ref=e2793] [cursor=pointer]:
                    - /url: "#tts:extent"
                    - code [ref=e2794]: tts:extent
                  - text: attribute of the
                  - code [ref=e2795]: tt:tt
                  - text: element.
                - paragraph [ref=e2796]: EBU-TT Part 1 Versions
                - paragraph [ref=e2797]: The BBC currently uses version 1.0 of EBU-TT, but intends to move to version 1.1. Significant changes were made to the metadata structure between the versions, with some elements moved from the BBC to the EBU namespace. Both versions are given here but only v1.0 specifications are stable. Delivery of v1.1 files must be approved in advance and the specification confirmed.
                - generic [ref=e2798]:
                  - generic [ref=e2799]:
