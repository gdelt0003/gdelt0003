            - generic [ref=e619]:
              - heading "3.10 Prioritise editing and timing over line breaks" [level=4] [ref=e620]
              - link "Link to Prioritise editing and timing over line breaks" [ref=e621] [cursor=pointer]:
                - /url: "#Prioritise-editing-and-timing-over-line-breaks"
            - paragraph [ref=e623]: Good line-breaks are extremely important because they make the process of reading and understanding far easier. However, it is not always possible to produce good line-breaks as well as well-edited text and good timing. Where these constraints are mutually exclusive, then well-edited text and timing are more important than line-breaks.
