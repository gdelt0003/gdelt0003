            - paragraph [ref=e2212]: "Any serious or misleading errors in real-time subtitling should be corrected clearly and promptly. The correction should be preceded by two dashes:"
            - paragraph [ref=e2213]: The minster’s shrew is unchanged -- view.
            - paragraph [ref=e2214]: However be aware that too many on-air corrections, or corrections that are not sufficiently prompt, can actually make the subtitles harder for a viewer to follow.
            - paragraph [ref=e2215]: Ultimately the subtitler may have to decide whether to make a correction or omit some speech in order to catch up. Sometimes this can be done without detracting from the integrity of the subtitling, but this is not always the case. Do not correct minor errors where the reader can reasonably be expected to deduce the intended meaning (e.g. typos and misspellings).
            - paragraph [ref=e2216]: If necessary, an apology should be made at the end of the programme. If possible, repeat the subtitle with the error corrected.
