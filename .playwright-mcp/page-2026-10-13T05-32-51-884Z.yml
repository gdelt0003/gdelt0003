            - paragraph [ref=e553]: "broadcast Left, right and centre justification can be useful to identify speaker position, especially in cases where there are more than three speakers on screen. In such cases, line breaks should be inserted at linguistically coherent points, taking eye-movement into careful consideration. For example:"
            - paragraph [ref=e554]:
              - generic [ref=e555]: We all hope you are feeling much better.
            - paragraph [ref=e556]: This is left justified. The eye has least distance to travel from ‘hope’ to ‘you’.
