            - paragraph [ref=e2202]: Subtitles should use upper and lower case as appropriate.
            - paragraph [ref=e2203]: Standard spelling and punctuation should be used at all times, even on the fastest programmes.
            - paragraph [ref=e2204]: Produce complete sentences even for short comments because this makes the result look less staccato and hurried.
            - paragraph [ref=e2205]: Strong or inappropriate language must not appear on screen in error.
            - paragraph [ref=e2206]: For news programmes, current affairs programmes and most other genres, subtitles should be verbatim, up to a subtitling speed of around 160-180wpm. Above that speed, some editing would be expected.
            - paragraph [ref=e2207]: For some genres, such as in-play sporting action, the subtitling may be edited more heavily so as to convey vital commentary information while allowing better access to the visuals. (BBC-SPG)
            - generic [ref=e2208]:
