                  - text: and
                  - link "Example EBU-TT-D document" [ref=e159] [cursor=pointer]:
                    - /url: "#Example-EBU-TT-D-document"
                  - text: . Then follow the
                  - link "quick EBU-TT-D how-to." [ref=e160] [cursor=pointer]:
                    - /url: "#Appendix-Quick-EBU-TT-D-how-to"
            - paragraph [ref=e161]: Further assistance
            - paragraph [ref=e162]:
              - text: Assistance with these guidelines and specific technical questions can be emailed to
              - link "subtitle-guidelines@bbc.co.uk" [ref=e163] [cursor=pointer]:
                - /url: mailto:subtitle-guidelines@bbc.co.uk
              - text: . For help with requirements for specific subtitle documents contact the commissioning editor.
            - generic [ref=e164]:
              - heading "1.1 Document conventions" [level=4] [ref=e165]
