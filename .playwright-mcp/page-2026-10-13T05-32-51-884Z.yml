              - heading "7.6 Use double quotes for mechanical speech and for quoting" [level=4] [ref=e966]
              - link "Link to Use double quotes for mechanical speech and for quoting" [ref=e967] [cursor=pointer]:
                - /url: "#Use-double-quotes-for-mechanical-speech-and-for-quoting"
            - paragraph [ref=e969]: "Double quotes \"...\" can suggest mechanically reproduced speech, e.g. radio, loudspeakers etc., or a quotation from a person or book. Start the quote with a capital letter:"
            - paragraph [ref=e970]: He said, "You're so tall".
            - generic [ref=e971]:
              - heading "7.7 Use arrows for off-screen voices" [level=4] [ref=e972]
              - link "Link to Use arrows for off-screen voices" [ref=e973] [cursor=pointer]:
                - /url: "#Use-arrows-for-off-screen-voices"
