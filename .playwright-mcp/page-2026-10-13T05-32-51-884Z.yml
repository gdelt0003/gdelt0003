            - paragraph [ref=e906]: This is a legacy technique that is no longer used in new content for identifying in-vision speakers (it may be present in files created before it was deprecated). Use colour instead.
            - paragraph [ref=e907]: Horizontal positioning is used in combination with arrows to indicate out-of-vision voices.
            - paragraph [ref=e908]: broadcast Where colours cannot be used you can distinguish between speakers with placing.
            - paragraph [ref=e909]: Put each piece of speech on a separate line or lines and place it underneath the relevant speaker. You may have to edit more to ensure that the lines are short enough to look placed.
            - paragraph [ref=e910]: Try to make sure that pieces of speech placed right and left are "joined at the hip" if possible, so that the eye does not have to leap from one side of the screen to the other.
