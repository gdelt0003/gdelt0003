              - listitem [ref=e2069]:
                - paragraph [ref=e2070]: In quizzes - to separate questions and answers
              - listitem [ref=e2071]:
                - paragraph [ref=e2072]: In songs - e.g. for backing singers. They are particularly effective when one line starts before the previous one finishes
              - listitem [ref=e2073]:
