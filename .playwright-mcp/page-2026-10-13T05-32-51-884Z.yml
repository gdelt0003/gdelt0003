            - generic [ref=e1915]:
              - heading "17.1 Subtitle effects only when necessary" [level=4] [ref=e1916]
              - link "Link to Subtitle effects only when necessary" [ref=e1917] [cursor=pointer]:
                - /url: "#Subtitle-effects-only-when-necessary"
            - paragraph [ref=e1919]: As well as dialogue, all editorially significant sound effects must be subtitled. This does not mean that every single creak and gurgle must be covered - only those which are crucial for the viewer's understanding of the events on screen, or which may be needed to convey flavour or atmosphere, or enable them to progress in gameplay, as well as those which are not obvious from the action. A dog barking in one scene could be entirely trivial; in another it could be a vital clue to the story-line. Similarly, if a man is clearly sobbing or laughing, or if an audience is clearly clapping, do not label.
            - paragraph [ref=e1920]: Do not put up a sound-effect label for something that can be subtitled. For instance, if you can hear what John is saying, JOHN SHOUTS ORDERS would not be necessary.
            - generic [ref=e1921]:
              - heading "17.2 Describe sounds, not actions" [level=4] [ref=e1922]
              - link "Link to Describe sounds, not actions" [ref=e1923] [cursor=pointer]:
