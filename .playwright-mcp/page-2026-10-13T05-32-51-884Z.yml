              - text: .
            - paragraph [ref=e1138]:
              - text: To minimise the risk of unwanted line wrapping, use a wide font such as Reith Sans, Verdana or Tiresias when authoring the subtitles. Presentation processors usually use a narrower font (e.g. Arial) so the rendered line will likely fit within the authored area. Note that platforms may use different reference fonts when resolving the generic font family name specified in the subtitle file. For example, the HbbTV standard maps both
              - code [ref=e1139]: default
              - text: and
              - code [ref=e1140]: proportionalSansSerif
              - text: to Tiresias, whereas IMSC maps
              - code [ref=e1141]: proportionalSansSerif
              - text: only to any font with substantially the same dimensions for rendered text as Arial. See also
              - link "Conformance with IMSC 1.0.1 Text Profile" [ref=e1142] [cursor=pointer]:
