            - generic [ref=e1886]:
              - heading "16.9 Punctuation" [level=4] [ref=e1887]
              - link "Link to Punctuation" [ref=e1888] [cursor=pointer]:
                - /url: "#Punctuation"
            - paragraph [ref=e1890]: It is generally simpler to keep punctuation in songs to a minimum, with punctuation only within lines (when it is grammatically necessary) and not at the end of lines (except for question marks). You should, though, avoid full stops in the middle of otherwise unpunctuated lines. For example,
            - paragraph [ref=e1891]:
              - generic [ref=e1892]: Turn to wisdom. Turn to joy There’s no wisdom to destroy
            - paragraph [ref=e1893]: "Could be changed to:"
            - paragraph [ref=e1894]:
              - generic [ref=e1895]: "# Turn to wisdom, turn to joy There’s no wisdom to destroy"
            - paragraph [ref=e1896]: In formal songs, however, e.g. opera and hymns, where it could be easier to determine the correct punctuation, it is more appropriate to punctuate throughout.
            - paragraph [ref=e1897]: The last song subtitle should end with a full stop, unless the song continues in the background.
            - paragraph [ref=e1898]: "If the subtitles for a song don't start from its first line, show this by using two continuation dots at the beginning:"
            - paragraph [ref=e1899]:
