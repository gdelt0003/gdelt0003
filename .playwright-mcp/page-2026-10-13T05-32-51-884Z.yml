                          - text: attribute must have one or more space-separated values ("IDREFS" in XML terminology), each of which must be the value of an
                          - code [ref=e6071]: xml:id
                          - text: attribute of a
                          - code [ref=e6072]:
                            - generic [ref=e6073]:
                              - generic [ref=e6074]: <ttm:agent
