                            - listitem [ref=e5770]:
                              - paragraph [ref=e5771]: "Timecount-value: value followed by an optional fraction and a symbol for the time metric, e.g. 3.2h (3 hours and 12 minutes). Allowed time metrics are h, m, s, ms (millisecond)"
