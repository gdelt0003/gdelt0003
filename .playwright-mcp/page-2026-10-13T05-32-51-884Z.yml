            - paragraph [ref=e2054]: A cumulative subtitle consists of two or three parts - usually complete sentences. Each part will appear on screen at a different time, in sync with its speaker, but all parts will have an identical out-cue.
            - generic [ref=e2055]:
              - heading "19.1 Use only when necessary" [level=4] [ref=e2056]
              - link "Link to Use only when necessary" [ref=e2057] [cursor=pointer]:
                - /url: "#Use-only-when-necessary"
            - paragraph [ref=e2059]: Cumulatives should only be used when there is a good reason to delay part of the subtitle (e.g. dramatic impact/song rhythm) and no other way of doing it - i.e. there is insufficient time available to split the subtitle completely.
            - paragraph [ref=e2060]: This is most likely to happen in an interchange between speakers, where the first speaker talks much faster than the second. Delaying the speech of the second person by using a cumulative means that the first subtitle will still be on screen long enough to be read, while at the same time the speech is kept in sync.
            - generic [ref=e2061]:
