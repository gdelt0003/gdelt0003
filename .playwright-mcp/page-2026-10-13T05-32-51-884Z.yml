                - /url: "#Identifying-speakers"
            - paragraph [ref=e862]: Several techniques can be used to assist the viewer in identifying speakers. The BBC's preferred techniques are colour and single quotes, but other techniques exist in legacy subtitle files and subtitles repurposed from non-UK sources. Re-use of existing files with legacy techniques is acceptable, but unless specifically requested, new content should not use legacy techniques.
            - paragraph [ref=e863]: "The available techniques include:"
            - list [ref=e864]:
              - listitem [ref=e865]:
                - paragraph [ref=e866]:
                  - link "Colour" [ref=e867] [cursor=pointer]:
                    - /url: "#Use-colours"
                  - text: ": This is the preferred method that should be used in most cases."
              - listitem [ref=e868]:
                - paragraph [ref=e869]:
                  - link "Single quotes" [ref=e870] [cursor=pointer]:
                    - /url: "#Use-single-quotes-for-voice-over"
                  - text: ": Used to indicate an out-of-vision speaker, such as someone speaking via telephone, or to distinguish between in- and out-of-vision voices when both are spoken by the same character (or by the narrator) and therefore using the same colour (e.g. a narrator who is sometimes in-vision)."
              - listitem [ref=e871]:
                - paragraph [ref=e872]:
                  - link "Arrows" [ref=e873] [cursor=pointer]:
                    - /url: "#Use-arrows-for-off-screen-voices"
                  - text: ": Used to indicate the direction of out-of-vision sounds when the origin of the sound is not apparent. (infrequently used)"
              - listitem [ref=e874]:
                - paragraph [ref=e875]:
                  - link "Label" [ref=e876] [cursor=pointer]:
                    - /url: "#Use-labels-for-off-screen-voices"
                  - text: ": Can be used to resolve ambiguity as to who is speaking."
              - listitem [ref=e877]:
                - paragraph [ref=e878]:
                  - link "Horizontal positioning" [ref=e879] [cursor=pointer]:
                    - /url: "#Use-horizontal-positioning"
                  - text: ": This is a legacy technique for identifying in-vision speakers, but it is still used for indicating"
                  - link "off-screen speech" [ref=e880] [cursor=pointer]:
                    - /url: "#Use-arrows-for-off-screen-voices"
                  - text: . It is also used with
                  - link "Vertical positioning" [ref=e881] [cursor=pointer]:
                    - /url: "#Vertical-positioning"
                  - text: to avoid obscuring important information.
              - listitem [ref=e882]:
                - paragraph [ref=e883]:
                  - link "Dashes" [ref=e884] [cursor=pointer]:
                    - /url: "#Use-dashes"
                  - text: ": This is a legacy technique. Must only be used with colour when unavoidable."
            - generic [ref=e885]:
              - heading "7.1 Use colours" [level=4] [ref=e886]
              - link "Link to Use colours" [ref=e887] [cursor=pointer]:
                - /url: "#Use-colours"
            - paragraph [ref=e889]:
              - text: Use colours to distinguish speakers from each other (see
              - link "Colours" [ref=e890] [cursor=pointer]:
