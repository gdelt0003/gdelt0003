                  - /url: "#Appendix-BBC-metadata-XSD"
              - paragraph [ref=e8319]: This is the XSD for the BBC metadata section of the EBU-TT document. It includes elements for audio description and signs-language documents that can be omitted for subtitle files. To validate the document fully an EBU-TT schema should also be used.
              - paragraph [ref=e8320]:
