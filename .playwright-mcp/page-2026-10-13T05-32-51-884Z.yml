            - list [ref=e116]:
              - listitem [ref=e117]:
                - paragraph [ref=e118]:
                  - text: The BBC Academy has produced an
                  - link "online guide to subtitling" [ref=e119] [cursor=pointer]:
                    - /url: https://www.bbc.co.uk/guides/zmgnng8
                  - text: . If you are new to subtitling, please start there.
            - paragraph [ref=e120]:
              - text: "Subtitles are primarily intended to serve viewers with loss of hearing, but they are used by a wide range of people:"
              - link "around 10% of broadcast viewers use subtitles regularly, increasing to 35% for some online content" [ref=e121] [cursor=pointer]:
                - /url: https://downloads.bbc.co.uk/rd/pubs/whp/whp-pdf-files/WHP323.pdf
              - text: . The majority of these viewers are not hard of hearing.
            - paragraph [ref=e122]: This document describes 'closed' subtitles only, also known as 'closed captions'. Typically delivered as a separate file, closed subtitles can be switched off by the user and are not 'burnt in' to the image.
            - paragraph [ref=e123]:
              - text: There are many formats in circulation for subtitle files. In general, the BBC accepts EBU-TT part 1 with STL embedded for broadcast, and EBU-TT-D for online only content. For a full description of the delivery requirements, see the
              - link "File format" [ref=e124] [cursor=pointer]:
                - /url: "#FILE-FORMAT"
              - text: section.
            - paragraph [ref=e125]:
              - text: The Subtitle Guidelines describe best practice for authoring subtitles and provide instructions for making subtitle files for the BBC. This document brings together
              - link "documents previously published by Ofcom and the BBC" [ref=e126] [cursor=pointer]:
                - /url: "#Appendix-References"
              - text: "and is intended to serve as the basis for all subtitle work across the BBC: prepared and live, online and broadcast, internal and supplied."
            - paragraph [ref=e127]: Who should read this?
            - paragraph [ref=e128]: "Anyone providing or handling subtitles for the BBC:"
            - list [ref=e129]:
              - listitem [ref=e130]:
                - paragraph [ref=e131]: authors of subtitle (respeakers, stenographers, editors);
              - listitem [ref=e132]:
                - paragraph [ref=e133]: producers and distributors of content;
              - listitem [ref=e134]:
                - paragraph [ref=e135]: developers of software tools for authoring, validating, converting and presenting subtitles;
              - listitem [ref=e136]:
                - paragraph [ref=e137]: anyone involved in controlling subtitle quality and compliance.
            - paragraph [ref=e138]: In addition, if you have an interest in accessibility you will find a lot of useful information here.
            - paragraph [ref=e139]: What prior knowledge is expected?
            - paragraph [ref=e140]:
              - text: The editorial guidelines in the
              - link "Presentation section" [ref=e141] [cursor=pointer]:
                - /url: "#presentation"
              - text: are written in plain English, requiring only general familiarity with subtitles. In contrast, to follow the technical instructions in the
              - link "File format" [ref=e142] [cursor=pointer]:
                - /url: "#FILE-FORMAT"
              - text: section you will need good working knowledge of XML and CSS. It is recommended that you also familiarise yourself with
              - link "Timed Text Markup Language" [ref=e143] [cursor=pointer]:
                - /url: https://www.w3.org/TR/ttml1/
              - text: and
              - link "SMPTE timecodes" [ref=e144] [cursor=pointer]:
                - /url: https://dx.doi.org/10.5594/SMPTE.ST12-1.2014
              - text: .
            - paragraph [ref=e145]: What should I read for...
            - list [ref=e146]:
              - listitem [ref=e147]:
                - paragraph [ref=e148]:
                  - text: "An overview of subtitles: read this introduction and the first few sections of"
                  - link "Presentation" [ref=e149] [cursor=pointer]:
                    - /url: "#presentation"
                  - text: ","
                  - link "Timing" [ref=e150] [cursor=pointer]:
                    - /url: "#Timing"
