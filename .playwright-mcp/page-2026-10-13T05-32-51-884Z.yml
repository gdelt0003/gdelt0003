              - text: .
            - generic [ref=e1634]:
              - heading "12.1 Indicate accent only when required" [level=4] [ref=e1635]
              - link "Link to Indicate accent only when required" [ref=e1636] [cursor=pointer]:
                - /url: "#Indicate-accent-only-when-required"
            - paragraph [ref=e1638]: Do not indicate accent as a matter of course, but only where it is relevant for the viewer's understanding. This is rarely the case in serious/straight news reports, but may well be relevant in lighter factual items. For example, you would only indicate the nationality of a foreign scientist being interviewed on Horizon or the Ten O’Clock News if it were relevant to the subject matter and the viewer could not pick the information up from any other source, e.g. from their actual words or any accompanying graphics. However, in a drama or comedy where a character's accent is crucial to the plot or enjoyment, the subtitles must establish the accent when we first see the character and continue to reflect it from then on.
            - generic [ref=e1639]:
              - heading "12.2 Indicate accent sparingly" [level=4] [ref=e1640]
              - link "Link to Indicate accent sparingly" [ref=e1641] [cursor=pointer]:
                - /url: "#Indicate-accent-sparingly"
            - paragraph [ref=e1643]: When it is necessary to indicate accent, bear in mind that, although the subtitler's aim should always be to reproduce the soundtrack as faithfully as possible, a phonetic representation of a speaker's foreign or regional accent or dialect is likely to slow up the reading process and may ridicule the speaker. Aim to give the viewer a flavour of the accent or dialect by spelling a few words phonetically and by including any unusual vocabulary or sentence construction that can be easily read. For a Cockney speaker, for instance, it would be appropriate to include quite a few "caffs", "missus" and "ain'ts", but not to replace every single dropped "h" and "g" with an apostrophe.
            - generic [ref=e1644]:
              - heading "12.3 Incorrect grammar" [level=4] [ref=e1645]
              - link "Link to Incorrect grammar" [ref=e1646] [cursor=pointer]:
                - /url: "#Incorrect-grammar"
            - paragraph [ref=e1648]: You should not correct any incorrect grammar that forms an essential part of dialect, e.g. the Cockney "you was".
            - paragraph [ref=e1649]: "A foreign speaker may make grammatical mistakes that do not render the sense incomprehensible but make the subtitle difficult to read in the given time. In this case, you should either give the subtitle more time or change the text as necessary:"
            - paragraph [ref=e1650]: I and my wife is being marrying four years since and are having four childs, yes
            - paragraph [ref=e1651]: "This could be changed to:"
            - paragraph [ref=e1652]: I and my wife have been married four years and have four childs, yes
            - generic [ref=e1653]:
              - heading "12.4 Use label" [level=4] [ref=e1654]
              - link "Link to Use label" [ref=e1655] [cursor=pointer]:
                - /url: "#Use-label"
            - paragraph [ref=e1657]: "The speech text alone may not always be enough to establish the origin of an overseas/regional speaker. In that case, and if it is necessary for the viewer's understanding of the context of the content, use a label to make the accent clear:"
            - paragraph [ref=e1658]:
              - generic [ref=e1659]: "AMERICAN ACCENT: All the evidence points to a plot."
          - generic [ref=e1660]:
            - generic [ref=e1661]:
              - heading "13 Difficult speech" [level=3] [ref=e1662]
              - link "Link to Difficult speech" [ref=e1663] [cursor=pointer]:
                - /url: "#Difficult-speech"
            - generic [ref=e1665]:
              - heading "13.1 Edit lightly" [level=4] [ref=e1666]
              - link "Link to Edit lightly" [ref=e1667] [cursor=pointer]:
                - /url: "#Edit-lightly"
            - paragraph [ref=e1669]:
              - text: Remember that what might make sense when it is heard might make little or no sense when it is read. So, if you think the viewer will have difficulty following the text, you should make it read clearly. This does not mean that you should always sub-edit incoherent speech into beautiful prose. You should aim to tamper with the original as little as possible - just give it the odd tweak to make it intelligible. (Also see
              - link "Accents" [ref=e1670] [cursor=pointer]:
                - /url: "#Accents"
              - text: )
            - generic [ref=e1671]:
              - heading "13.2 Consider the dramatic effect" [level=4] [ref=e1672]
              - link "Link to Consider the dramatic effect" [ref=e1673] [cursor=pointer]:
                - /url: "#Consider-the-dramatic-effect"
            - paragraph [ref=e1675]: The above is more applicable to factual content, e.g. News and documentaries. Do not tidy up incoherent speech in drama when the incoherence is the desired effect.
            - generic [ref=e1676]:
              - heading "13.3 Use labels for incoherent speech" [level=4] [ref=e1677]
              - link "Link to Use labels for incoherent speech" [ref=e1678] [cursor=pointer]:
                - /url: "#Use-labels-for-incoherent-speech"
            - paragraph [ref=e1680]: "If a piece of speech is impossible to make out, you will have to put up a label saying why:"
            - paragraph [ref=e1681]: "(SLURRED): But I love you!"
            - paragraph [ref=e1682]: Avoid subjective labels such as "UNINTELLIGIBLE" or "INCOMPREHENSIBLE" or "HE BABBLES INCOHERENTLY".
            - generic [ref=e1683]:
              - heading "13.4 Use labels for inaudible speech" [level=4] [ref=e1684]
              - link "Link to Use labels for inaudible speech" [ref=e1685] [cursor=pointer]:
                - /url: "#Use-labels-for-inaudible-speech"
            - paragraph [ref=e1687]: Speech can be inaudible for different reasons. The subtitler should put up a label explaining the cause.
            - paragraph [ref=e1688]: APPLAUSE DROWNS SPEECH
            - paragraph [ref=e1689]: TRAIN DROWNS HIS WORDS
            - paragraph [ref=e1690]: MUSIC DROWNS SPEECH
            - paragraph [ref=e1691]: HE MOUTHS
            - generic [ref=e1692]:
              - heading "13.5 Explain pauses in speech" [level=4] [ref=e1693]
              - link "Link to Explain pauses in speech" [ref=e1694] [cursor=pointer]:
                - /url: "#Explain-pauses-in-speech"
            - paragraph [ref=e1696]: "Long speechless pauses can sometimes lead the viewer to wonder whether the subtitles have failed. It can help in such cases to insert explanatory text such as:"
            - paragraph [ref=e1697]: INTRODUCTORY MUSIC
            - paragraph [ref=e1698]: LONG PAUSE
            - paragraph [ref=e1699]: ROMANTIC MUSIC
            - generic [ref=e1700]:
              - heading "13.6 Break up subtitles slow speech" [level=4] [ref=e1701]
              - link "Link to Break up subtitles slow speech" [ref=e1702] [cursor=pointer]:
                - /url: "#Break-up-subtitles-slow-speech"
            - paragraph [ref=e1704]: If a speaker speaks very slowly or falteringly, break your subtitles more often to avoid having slow subtitles on the screen. However, do not break a sentence up so much that it becomes difficult to follow.
            - generic [ref=e1705]:
              - heading "13.7 Indicate stammer" [level=4] [ref=e1706]
              - link "Link to Indicate stammer" [ref=e1707] [cursor=pointer]:
                - /url: "#Indicate-stammer"
            - paragraph [ref=e1709]: If a speaker stammers, give some indication (but not too much) by using hyphens between repeated sounds. This is more likely to be needed in drama than factual content. Letters to show a stammer should follow the case of the first letter of the word.
            - paragraph [ref=e1710]: I'm g-g-going home
            - paragraph [ref=e1711]: W-W-What are you doing?
          - generic [ref=e1712]:
            - generic [ref=e1713]:
              - heading "14 Hesitation and interruption" [level=3] [ref=e1714]
              - link "Link to Hesitation and interruption" [ref=e1715] [cursor=pointer]:
                - /url: "#Hesitation-and-interruption"
            - generic [ref=e1717]:
              - heading "14.1 Indicate hesitation only if important" [level=4] [ref=e1718]
              - link "Link to Indicate hesitation only if important" [ref=e1719] [cursor=pointer]:
                - /url: "#Indicate-hesitation-only-if-important"
            - paragraph [ref=e1721]: If a speaker hesitates, do not edit out the "ums" and "ers" if they are important for characterisation or plot. However, if the hesitation is merely incidental and the "ums" actually slow up the reading process, then edit them out. (This is most likely to be the case in factual content, and too many "ums" can make the speaker appear ridiculous.)
            - generic [ref=e1722]:
              - heading "14.2 Within a single subtitle" [level=4] [ref=e1723]
              - link "Link to Within a single subtitle" [ref=e1724] [cursor=pointer]:
                - /url: "#Within-a-single-subtitle"
            - paragraph [ref=e1726]: "When the hesitation or interruption is to be shown within a single subtitle, follow these rules:"
            - generic [ref=e1727]:
              - heading "14.2.1 Pause within a sentence" [level=5] [ref=e1728]
              - link "Link to Pause within a sentence" [ref=e1729] [cursor=pointer]:
                - /url: "#Pause-within-a-sentence"
            - paragraph [ref=e1731]: To indicate a pause within a sentence, insert three dots at the point of pausing, then continue the sentence immediately after the dots, without leaving a space.
            - paragraph [ref=e1732]: Everything that matters...is a mystery
            - paragraph [ref=e1733]: You may need to show a pause between two sentences within one subtitle. For example, where a phone call is taking place and we can only witness one side of it, there may not be time to split the sentences into separate subtitles to show that someone we can't see or hear is responding. In this case, you should put two dots immediately before the second sentence.
            - paragraph [ref=e1734]: How are you? ..Oh, I'm glad to hear that.
            - paragraph [ref=e1735]:
              - text: A very effective technique is to use
              - link "cumulative subtitles" [ref=e1736] [cursor=pointer]:
                - /url: "#Cumulative-subtitles"
              - text: ", where the first part appears before the second, and both remain on screen until the next subtitle. Use this method only when the content justifies it; standard prepared subtitles should be displayed in blocks."
            - generic [ref=e1737]:
              - heading "14.2.2 Unfinished sentence" [level=5] [ref=e1738]
              - link "Link to Unfinished sentence" [ref=e1739] [cursor=pointer]:
                - /url: "#Unfinished-sentence"
            - paragraph [ref=e1741]: If the speaker simply trails off without completing a sentence, put three dots at the end of their speech. If they then start a new sentence, no continuation dots are necessary.
            - paragraph [ref=e1742]: Hello, Mr... Oh, sorry! I've forgotten your name
            - generic [ref=e1743]:
              - heading "14.2.3 Unfinished question/exclamation" [level=5] [ref=e1744]
              - link "Link to Unfinished question/exclamation" [ref=e1745] [cursor=pointer]:
                - /url: "#Unfinished-question-exclamation"
            - paragraph [ref=e1747]: If the unfinished sentence is a question or exclamation, put three dots (not two) before the question mark or exclamation mark.
            - paragraph [ref=e1748]: What do you think you're...?!
            - generic [ref=e1749]:
              - heading "14.2.4 Interruption" [level=5] [ref=e1750]
              - link "Link to Interruption" [ref=e1751] [cursor=pointer]:
                - /url: "#Interruption"
            - paragraph [ref=e1753]: If a speaker is interrupted by another speaker or event, put three dots at the end of the incomplete speech.
            - generic [ref=e1754]:
              - heading "14.3 Across subtitles" [level=4] [ref=e1755]
              - link "Link to Across subtitles" [ref=e1756] [cursor=pointer]:
                - /url: "#Across-subtitles"
            - paragraph [ref=e1758]: "When the hesitation or interruption occurs in the middle of a sentence that is split across two subtitles, do the following:"
            - generic [ref=e1759]:
              - heading "14.3.1 Indicate time lapse with dots" [level=5] [ref=e1760]
              - link "Link to Indicate time lapse with dots" [ref=e1761] [cursor=pointer]:
                - /url: "#Indicate-time-lapse-with-dots"
            - paragraph [ref=e1763]: Where there is no time-lapse between the two subtitles, put three dots at the end of the first subtitle but no dots in the second one.
            - paragraph [ref=e1764]:
              - generic [ref=e1765]: I think... I would like to leave now.
            - paragraph [ref=e1766]: Where there is a time-lapse between the two subtitles, put three dots at the end of the first subtitle and two dots at the beginning of the second, so that it is clear that it is a continuation.
            - paragraph [ref=e1767]: I'd like...
            - paragraph [ref=e1768]: ..a piece of chocolate cake
            - paragraph [ref=e1769]: Remember that dots are only used to indicate a pause or an unfinished sentence. You do not need to use dots every time you split a sentence across two or more subtitles.
          - generic [ref=e1770]:
            - generic [ref=e1771]:
              - heading "15 Humour" [level=3] [ref=e1772]
              - link "Link to Humour" [ref=e1773] [cursor=pointer]:
                - /url: "#Humour"
            - paragraph [ref=e1775]: In humorous sequences, it is important to retain as much of the humour as possible. This will affect the editing process as well as when to leave the screen clear.
            - generic [ref=e1776]:
              - heading "15.1 Separate punchlines" [level=4] [ref=e1777]
              - link "Link to Separate punchlines" [ref=e1778] [cursor=pointer]:
                - /url: "#Separate-punchlines"
            - paragraph [ref=e1780]: Try wherever possible to keep punchlines separate from the preceding text.
            - generic [ref=e1781]:
              - heading "15.2 Reactions" [level=4] [ref=e1782]
              - link "Link to Reactions" [ref=e1783] [cursor=pointer]:
                - /url: "#Reactions"
            - paragraph [ref=e1785]: Where possible, allow viewers to see actions and facial expressions which are part of the humour by leaving the screen clear or by editing. Try not to leave a subtitle on screen when the next shot contains no speech and shows the character's reaction, as this distracts from the reaction and spoils the punchline.
            - generic [ref=e1786]:
              - heading "15.3 Keep catchphrases" [level=4] [ref=e1787]
              - link "Link to Keep catchphrases" [ref=e1788] [cursor=pointer]:
                - /url: "#Keep-catchphrases"
            - paragraph [ref=e1790]: Never edit characters' catchphrases.
          - generic [ref=e1791]:
            - generic [ref=e1792]:
              - heading "16 Music and songs" [level=3] [ref=e1793]
              - link "Link to Music and songs" [ref=e1794] [cursor=pointer]:
                - /url: "#Music-and-songs"
            - complementary [ref=e1796]:
              - paragraph [ref=e1797]:
                - text: EBU-TT 1.0 documents should set
                - code [ref=e1798]: ttm:role="music"
                - text: on the relevant
                - link [ref=e1799] [cursor=pointer]:
                  - /url: "#tt:p"
                  - code [ref=e1800]: tt:p
                - text: or
                - link [ref=e1801] [cursor=pointer]:
                  - /url: "#tt:span"
                  - code [ref=e1802]: tt:span
                - text: element to indicate that the contents represent music.
            - generic [ref=e1803]:
              - heading "16.1 Label source music" [level=4] [ref=e1804]
              - link "Link to Label source music" [ref=e1805] [cursor=pointer]:
                - /url: "#Label-source-music"
            - paragraph [ref=e1807]: "All music that is part of the action, or significant to the plot, must be indicated in some way. If it is part of the action, e.g. somebody playing an instrument/a record playing/music on a jukebox or radio, then write the label in upper case:"
            - paragraph [ref=e1808]: SHE WHISTLES A JOLLY TUNE
            - paragraph [ref=e1809]: POP MUSIC ON RADIO
            - paragraph [ref=e1810]: MILITARY BAND PLAYS SWEDISH NATIONAL ANTHEM
            - generic [ref=e1811]:
              - heading "16.2 Describe incidental music" [level=4] [ref=e1812]
              - link "Link to Describe incidental music" [ref=e1813] [cursor=pointer]:
                - /url: "#Describe-incidental-music"
            - paragraph [ref=e1815]: If the music is "incidental music" (i.e. not part of the action) and well known or identifiable in some way, the label begins "MUSIC:" followed by the name of the music (music titles should be fully researched). "MUSIC" is in caps (to indicate a label), but the words following it are in upper and lower case, as these labels are often fairly long and a large amount of text in upper case is hard to read.
            - paragraph [ref=e1816]:
              - generic [ref=e1817]: "MUSIC: \"The Dance Of The Sugar Plum Fairy\" by Tchaikovsky"
            - paragraph [ref=e1818]: "MUSIC: \"God Save The Queen\""
            - paragraph [ref=e1819]: "MUSIC: A waltz by Victor Herbert"
            - paragraph [ref=e1820]: "MUSIC: The Swedish National Anthem"
            - paragraph [ref=e1821]: (The Swedish National Anthem does not have quotation marks around it as it is not the official title of the music.)
            - generic [ref=e1822]:
              - heading "16.3 Combine source and incidental music" [level=4] [ref=e1823]
              - link "Link to Combine source and incidental music" [ref=e1824] [cursor=pointer]:
                - /url: "#Combine-source-and-incidental-music"
            - paragraph [ref=e1826]: "Sometimes a combination of these two styles will be appropriate:"
            - paragraph [ref=e1827]: HE HUMS "God Save The Queen"
            - paragraph [ref=e1828]:
              - generic [ref=e1829]: SHE WHISTLES "The Dance Of The Sugar Plum Fairy" by Tchaikovsky
            - generic [ref=e1830]:
              - heading "16.4 Label mood music only when required" [level=4] [ref=e1831]
              - link "Link to Label mood music only when required" [ref=e1832] [cursor=pointer]:
                - /url: "#Label-mood-music-only-when-required"
            - paragraph [ref=e1834]: "If the music is \"incidental music\" but is an unknown piece, written purely to add atmosphere or dramatic effect, do not label it. However, if the music is not part of the action but is crucial for the viewer’s understanding of the plot, a sound-effect label should be used:"
            - paragraph [ref=e1835]: EERIE MUSIC
            - generic [ref=e1836]:
              - 'heading "16.5 Indicate song lyrics with #" [level=4] [ref=e1837]'
              - 'link "Link to Indicate song lyrics with #" [ref=e1838] [cursor=pointer]':
                - /url: "#Indicate-song-lyrics-with"
            - paragraph [ref=e1840]: "Song lyrics are almost always subtitled - whether they are part of the action or not. Every song subtitle starts with a white hash mark (#) and the final song subtitle has a hash mark at the start and the end:"
            - paragraph [ref=e1841]: "# These foolish things remind me of you #"
            - paragraph [ref=e1842]: "There are two exceptions:"
            - list [ref=e1843]:
              - listitem [ref=e1844]:
                - paragraph [ref=e1845]: In cases where you consider the visual information on the screen to be more important than the song lyrics, leave the screen free of subtitles.
              - listitem [ref=e1846]:
                - paragraph [ref=e1847]: Where snippets of a song are interspersed with any kind of speech, and it would be confusing to subtitle both the lyrics and the speech, it is better to put up a music label and to leave the lyrics unsubtitled.
            - paragraph [ref=e1848]: "online Instead of # the symbol, ♫ may be used."
            - generic [ref=e1849]:
              - heading "16.6 Avoid editing lyrics" [level=4] [ref=e1850]
              - link "Link to Avoid editing lyrics" [ref=e1851] [cursor=pointer]:
                - /url: "#Avoid-editing-lyrics"
            - paragraph [ref=e1853]: Song lyrics should generally be verbatim, particularly in the case of well-known songs (such as God Save The Queen), which should never be edited. This means that the timing of song lyric subtitles will not always follow the conventional timings for speech subtitles, and the subtitles may sometimes be considerably faster.
            - paragraph [ref=e1854]: "If, however, you are subtitling an unknown song, specially written for the content and containing lyrics that are essential to the plot or humour of the piece, there are a number of options:"
            - list [ref=e1855]:
              - listitem [ref=e1856]:
                - paragraph [ref=e1857]: edit the lyrics to give viewers more time to read them
              - listitem [ref=e1858]:
                - paragraph [ref=e1859]: combine song-lines wherever possible
              - listitem [ref=e1860]:
                - paragraph [ref=e1861]: do a mixture of both - edit and combine song-lines.
            - paragraph [ref=e1862]: "NB: If you do have to edit, make sure that you leave any rhymes intact."
            - generic [ref=e1863]:
              - heading "16.7 Synchronise with audio" [level=4] [ref=e1864]
              - link "Link to Synchronise with audio" [ref=e1865] [cursor=pointer]:
                - /url: "#Synchronise-with-audio"
            - paragraph [ref=e1867]: Song lyric subtitles should be kept closely in sync with the soundtrack. For instance, if it takes 15 seconds to sing one line of a hymn, your subtitle should be on the screen for 15 seconds.
            - paragraph [ref=e1868]: Song subtitles should also reflect as closely as possible the rhythm and pace of a performance, particularly when this is the focus of the editorial proposition. This will mean that the subtitles could be much faster or slower than the conventional timings.
            - paragraph [ref=e1869]: There will be times where the focus of the content will be on the lyrics of the song rather than on its rhythm - for example, a humorous song like Ernie by Benny Hill. In such cases, give the reader time to read the lyrics by combining song-lines wherever possible. If the song is unknown, you could also edit the lyrics, but famous songs like Ernie must not be edited.
            - paragraph [ref=e1870]: Where shots are not timed to song-lines, you should either take the subtitle to the end of the shot (if it's only a few frames away) or end the subtitle before the end of the shot (if it's 12 frames or more away).
            - generic [ref=e1871]:
              - heading "16.8 Centre lyrics subtitles" [level=4] [ref=e1872]
              - link "Link to Centre lyrics subtitles" [ref=e1873] [cursor=pointer]:
                - /url: "#Centre-lyrics-subtitles"
            - paragraph [ref=e1875]: All song-lines should be centred on the screen.
            - complementary [ref=e1876]:
              - paragraph [ref=e1877]:
