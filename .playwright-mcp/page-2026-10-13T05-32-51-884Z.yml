            - paragraph [ref=e1479]: The subtitles should overlay the video image, and may be placed within any black bars present within the video at the top or bottom.
            - paragraph [ref=e1480]: online For 16:9 video in landscape mode, subtitles should not be placed outside the central 90% vertically and the central 75% horizontally.
            - paragraph [ref=e1481]: "online For 9:16 video in portrait or vertical mode, this is reversed: subtitles should not be placed outside the central 75% vertically and the central 90% horizontally."
            - paragraph [ref=e1482]: online For 4:3 and 1:1 (square) video, subtitles should not be placed outside the central 90% vertically and the central 90% horizontally.
            - paragraph [ref=e1483]: online Regions can be extended horizontally to allow extra space for line padding.
            - paragraph [ref=e1484]: "online For online subtitles, the subtitle rendering area (root container in EBU-TT-D) should exactly overlap the video player area unless controls or other overlays are visible, in which case the system should take steps to avoid the subtitles being obscured by the overlays. These could include:"
            - list [ref=e1485]:
              - listitem [ref=e1486]:
                - paragraph [ref=e1487]: Scaling the root container to avoid overlap
              - listitem [ref=e1488]:
                - paragraph [ref=e1489]: Detecting and resolving screen area clashes by moving subtitles around
              - listitem [ref=e1490]:
                - paragraph [ref=e1491]: Pausing the presentation while the overlays are visible.
            - generic [ref=e1492]:
              - heading "10.1 Vertical positioning" [level=4] [ref=e1493]
              - link "Link to Vertical positioning" [ref=e1494] [cursor=pointer]:
                - /url: "#Vertical-positioning"
            - paragraph [ref=e1496]: The normally accepted position for subtitles is towards the bottom of the screen (Teletext lines 20 and 22. Line 18 is used if three subtitle lines are required). In obeying this convention it is most important to avoid obscuring ‘on-screen’ captions, any part of a speaker’s mouth or any other important activity. Certain special programme types carry a lot of information in the lower part of the screen (e.g. snooker, where most of the activity tends to centre around the black ball) and in such cases top screen positioning will be a more acceptable standard.
            - paragraph [ref=e1497]: In vertical (9:16) videos, it is common to position subtitles a little higher up, though still generally in the lower third of the screen. This is because faces are generally in the top half of the screen, and positioning the subtitles at the bottom makes it harder for the viewer to read the text and see the person speaking.
            - paragraph [ref=e1498]:
              - text: Generally, vertical displacement should be used to avoid obscuring important information (such as captions) while horizontal displacement should be reserved for indicating speakers (see
              - link "Identifying Speakers" [ref=e1499] [cursor=pointer]:
                - /url: "#Identifying-speakers"
              - text: ).
            - generic [ref=e1501]:
