                - /url: "#Preparation"
            - paragraph [ref=e2188]: Find out specialist vocabulary, and specific editorial guidelines for the genre (e.g. sport). Familiarise yourself with Prepared segments that have been subtitled and their place in the running order, but be prepared for the order to change.
            - paragraph [ref=e2189]: When available to the subtitler, pre-recorded segments should be subtitled prior to broadcast (not live) and cued out at the appropriate moment.
            - paragraph [ref=e2190]: "When cueing prepared texts for scripted parts of the programme:"
            - list [ref=e2191]:
              - listitem [ref=e2192]:
                - paragraph [ref=e2193]: Try to cue the texts of pre-recorded segments so that they closely match the spoken words in terms of start time.
              - listitem [ref=e2194]:
                - paragraph [ref=e2195]: Do not cue texts out rapidly to catch up if you get left behind - skip some and continue from the correct place.
              - listitem [ref=e2196]:
                - paragraph [ref=e2197]: Try to include speakers' names if available where in-vision captions have been obliterated.
            - generic [ref=e2198]:
