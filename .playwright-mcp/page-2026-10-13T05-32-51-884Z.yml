            - paragraph [ref=e1901]: "Similarly, if the song subtitles do not finish at the end of the song, put three dots at the end of the line to show that the song continues in the background or is interrupted:"
            - paragraph [ref=e1902]: "# I hear words I never heard in the Bible... #"
