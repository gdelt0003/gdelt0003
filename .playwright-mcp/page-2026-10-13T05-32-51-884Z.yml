                - /url: "#Break-at-natural-points"
            - paragraph [ref=e512]: "Subtitles and lines should be broken at logical points. The ideal line-break will be at a piece of punctuation like a full stop, comma or dash. If the break has to be elsewhere in the sentence, avoid splitting the following parts of speech:"
            - list [ref=e513]:
