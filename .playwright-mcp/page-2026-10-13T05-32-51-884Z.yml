                            - text: If the timebase is
                            - code [ref=e5758]: "\"smpte\""
                            - text: ", subtitle begin and end time expressions are interpreted in the SMPTE 12M-1-2008 system: hh:mm:ss:ff (hour:minute:second:frame). If this timebase is used,"
                            - code [ref=e5759]: ttp:markerMode
