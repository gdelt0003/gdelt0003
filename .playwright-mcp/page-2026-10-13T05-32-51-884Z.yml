                      - paragraph [ref=e6808]: In EBU-TT-D only, adds padding on the start and end edges of each rendered line. Background color applies to the line area including the padding.
                      - paragraph [ref=e6809]:
                        - text: Application of padding affects the layout of text, for example by reducing the maximum width available in which to render text on a single line (see
                        - link "line length" [ref=e6810] [cursor=pointer]:
