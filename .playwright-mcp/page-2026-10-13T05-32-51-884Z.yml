            - generic [ref=e284]:
              - heading "1.4 How to contribute" [level=4] [ref=e285]
              - link "Link to How to contribute" [ref=e286] [cursor=pointer]:
                - /url: "#How-to-contribute"
            - paragraph [ref=e288]:
              - text: Queries and comments may be raised at any time on the
              - link "subtitle guidelines github project" [ref=e289] [cursor=pointer]:
                - /url: https://github.com/bbc/subtitle-guidelines
              - text: by those with
              - emphasis [ref=e290]: sufficient project access levels
              - text: . Readers who do not have access to the project should email
              - link "subtitle-guidelines@bbc.co.uk" [ref=e291] [cursor=pointer]:
                - /url: mailto:subtitle-guidelines@bbc.co.uk
              - text: .
            - paragraph [ref=e292]: When raising new issues please summarise in a short line the issue in the Title field and include enough information in the Description field, as well as the selected text, to allow the team to identify the relevant part(s) of the document.
          - generic [ref=e293]:
            - generic [ref=e294]:
              - heading "PRESENTATION" [level=2] [ref=e295]
              - link "Link to PRESENTATION" [ref=e296] [cursor=pointer]:
                - /url: "#PRESENTATION"
            - paragraph [ref=e298]: Good subtitling is an art that requires negotiating conflicting requirements. On the whole, you should aim for subtitles that are faithful to the audio. However, you will need to balance this against considerations such as the action on the screen, speed of speech or editing and visual content.
            - generic [ref=e299]:
              - paragraph [ref=e300]: "For example, if you subtitle a scene where a character is speaking rapidly, these are some of the decisions you may have to make:"
              - list [ref=e301]:
                - listitem [ref=e302]:
                  - paragraph [ref=e303]: Can viewers read the subtitles at the rate of speech?
                - listitem [ref=e304]:
                  - paragraph [ref=e305]: Should you edit out some words to allow more time?
                - listitem [ref=e306]:
                  - paragraph [ref=e307]: Can subtitles carry over to the next scene so they ‘catch up’ with the speaker?
                - listitem [ref=e308]:
                  - paragraph [ref=e309]: Should you use cumulative subtitles to convey the rhythm of speech (for example, if rapping)?
                - listitem [ref=e310]:
                  - paragraph [ref=e311]: If there are shot changes within the sequence, should the subtitles be synchronised with those?
                - listitem [ref=e312]:
                  - paragraph [ref=e313]: Should you use one, two or three lines of subtitles?
                - listitem [ref=e314]:
                  - paragraph [ref=e315]: Should you change the position of the subtitle to avoid obscuring important visual information or to indicate the speaker?
            - paragraph [ref=e316]: Clearly, it is not possible (or advisable) to provide a set of hard rules that cover all situations. Instead, this document provides some guidelines and practical advice. Their implementation will depend on the content, the genre and on the subtitler’s expertise.
          - generic [ref=e317]:
            - generic [ref=e318]:
              - heading "2 Editing text" [level=3] [ref=e319]
              - link "Link to Editing text" [ref=e320] [cursor=pointer]:
                - /url: "#Editing-text"
            - generic [ref=e322]:
              - heading "2.1 Prefer verbatim" [level=4] [ref=e323]
              - link "Link to Prefer verbatim" [ref=e324] [cursor=pointer]:
                - /url: "#Prefer-verbatim"
            - paragraph [ref=e326]: If there is time for verbatim speech, do not edit unnecessarily. Your aim should be to give the viewer as much access to the soundtrack as you possibly can within the constraints of time, space, shot changes, and on-screen visuals, etc. You should never deprive the viewer of words/sounds when there is time to include them and where there is no conflict with the visual information.
            - paragraph [ref=e327]: However, if you have a very "busy" scene, full of action and disconnected conversations, it might be confusing if you subtitle fragments of speech here and there, rather than allowing the viewer to watch what is going on.
            - paragraph [ref=e328]: Don't automatically edit out words like "but", "so" or "too". They may be short but they are often essential for expressing meaning.
            - paragraph [ref=e329]: Similarly, conversational phrases like "you know", "well", "actually" often add flavour to the text.
            - generic [ref=e330]:
              - heading "2.2 Don’t simplify" [level=4] [ref=e331]
              - link "Link to Don’t simplify" [ref=e332] [cursor=pointer]:
                - /url: "#Don-t-simplify"
            - paragraph [ref=e334]: It is not necessary to simplify or translate for deaf or hard-of-hearing viewers. This is not only condescending, it is also frustrating for lip-readers.
            - generic [ref=e335]:
              - heading "2.3 Retain speaker’s first and last words" [level=4] [ref=e336]
              - link "Link to Retain speaker’s first and last words" [ref=e337] [cursor=pointer]:
                - /url: "#Retain-speaker-s-first-and-last-words"
            - paragraph [ref=e339]: If the speaker is in shot, try to retain the start and end of their speech, as these are most obvious to lip-readers who will feel cheated if these words are removed.
            - generic [ref=e340]:
              - heading "2.4 Edit evenly" [level=4] [ref=e341]
              - link "Link to Edit evenly" [ref=e342] [cursor=pointer]:
                - /url: "#Edit-evenly"
            - paragraph [ref=e344]: Do not take the easy way out by simply removing an entire sentence. Sometimes this will be appropriate, but normally you should aim to edit out a bit of every sentence.
            - generic [ref=e345]:
              - heading "2.5 Keep names" [level=4] [ref=e346]
              - link "Link to Keep names" [ref=e347] [cursor=pointer]:
                - /url: "#Keep-names"
            - paragraph [ref=e349]: Avoid editing out names when they are used to address people. They are often easy targets, but can be essential for following the plot.
            - generic [ref=e350]:
              - heading "2.6 Preserve the style" [level=4] [ref=e351]
              - link "Link to Preserve the style" [ref=e352] [cursor=pointer]:
                - /url: "#Preserve-the-style"
            - paragraph [ref=e354]: "Your editing should be faithful to the speaker's style of speech, taking into account register, nationality, era, etc. This will affect your choice of vocabulary. For instance:"
            - list [ref=e355]:
              - listitem [ref=e356]:
                - paragraph [ref=e357]: "register: mother vs mum; deceased vs dead; intercourse vs sex;"
              - listitem [ref=e358]:
                - paragraph [ref=e359]: "nationality: mom vs mum; trousers vs pants;"
              - listitem [ref=e360]:
