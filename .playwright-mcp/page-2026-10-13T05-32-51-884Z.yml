            - paragraph [ref=e168]: The following symbols are used throughout this document.
            - paragraph [ref=e169]:
              - text: "Examples indicate the appearance of a subtitle. When illustrating bad or unrecommended practice, the example has a strike-though, like this:"
              - generic [ref=e170]: counter-example
              - text: . Note that the subtitle style used here is only an approximation. It should not be used as a reference for real-world files or processors.
            - paragraph [ref=e171]: "Most of this document applies to both online and broadcast subtitles. When there are differences between subtitles intended for either platform, this is indicated with one of these flags: online - applies only to subtitles for online use (not for broadcast). broadcast - applies to broadcast-only subtitles (not online). When no broadcast or online flag is indicated, the text applies to all subtitles."
            - paragraph [ref=e172]: "Subtitles must conform to one of two specifications: EBU-TT-D (subtitles intended for online distribution only) or EBU-TT version 1.0 (for broadcast and online). Sections that only apply to one of the specifications are indicated by one of these flags: EBU-TT-D or EBU-TT 1.0."
