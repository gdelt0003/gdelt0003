                - paragraph [ref=e1511]: This is better, in this instance, the subtitles should go here so that the names can be read.
            - paragraph [ref=e1512]:
              - text: In some cases vertical displacement is not sufficient to avoid obscuring important information, for example when placing the captions above a graphic would cover a face. In such cases,
              - link "horizontal positioning" [ref=e1513] [cursor=pointer]:
                - /url: "#Horizontal-positioning"
              - text: may be used.
