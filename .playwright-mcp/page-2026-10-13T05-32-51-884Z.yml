            - generic [ref=e8322]:
              - generic [ref=e8323]:
                - 'heading "31 Appendix 4: Quick EBU-TT-D how-to" [level=3] [ref=e8324]'
                - 'link "Link to Appendix 4: Quick EBU-TT-D how-to" [ref=e8325] [cursor=pointer]':
                  - /url: "#Appendix-Quick-EBU-TT-D-how-to"
              - paragraph [ref=e8327]:
                - text: This section provides a step-by-step guide for making an EBU-TT-D file using a template for online distribution only. These instructions assume no prior knowledge and if followed closely will produce a valid but minimal file. You can then use this file as a basis for additional styling such elements such as
                - link "colour" [ref=e8328] [cursor=pointer]:
                  - /url: "#tts-color"
                - text: .
              - paragraph [ref=e8329]:
                - text: Note that these instructions are for creating a
                - emphasis [ref=e8330]: bare-bones file that does not include many of the features required by the BBC
                - text: . All subtitles will appear in white text on a black background and centred at the bottom of the screen. This minimal formatting excludes features like colour (to identify speakers), positioning (to avoid obscuring important information) and cumulative subtitles. You should therefore check with the commissioning editor that this minimal file is suitable.
              - paragraph [ref=e8331]:
                - strong [ref=e8332]: "This is important:"
                - text: Do not follow these instructions if you need to deliver subtitles for broadcast or if the presentation requires more than simple white-on-black text centred at the bottom of the screen. Consult the rest of this Guidelines document for these cases.
              - list [ref=e8333]:
                - listitem [ref=e8334]:
                  - paragraph [ref=e8335]: Prepare the text. If available, begin with a transcript file so you don't have to type in the text. Add labels if required (e.g. to describe action).
                - listitem [ref=e8336]:
                  - paragraph [ref=e8337]: "Add line breaks and timings. This is commonly done with an authoring tool. Ideally, the tool should allow you to configure all of the features that determine line length (line padding, region definition, cell resolution, font family and font size). This will allow you to preview the subtitles as reliably as possible (the final appearance will be determined by the user's system). If your tool does not support these features, use a WYSIWYG tool to define a subtitle region of 71.25% of the width of the video (for a 16:9 video). Use a wide font such as Verdana to minimise the risk of text overflowing the region when rendered in the final display font. It is not recommended to control line length using a character count limit only: this is a crude method that does not take into account the width of individual letters and fonts. Although 37 characters would fit most of the time, in some cases they might not (e.g. too many 'M's and 'W's). If you use this method you should test your subtitles in different browsers and operating systems before delivery."
                  - list [ref=e8338]:
                    - listitem [ref=e8339]:
                      - paragraph [ref=e8340]: If you don't have access to an authoring tool, you can use a simple text editor, although this method is slow and error-prone. Create a paragraph with manual line breaks for each subtitle and add timings for each paragraph. In this case you can only control line length by counting characters per line, and you should test your file thoroughly on different browsers and systems before delivery.
                  - paragraph [ref=e8341]:
                    - text: Timings must be relative to a programme begin time of
                    - code [ref=e8342]: 00:00:00.000
                - listitem [ref=e8343]:
                  - paragraph [ref=e8344]: Save or export the subtitles as a simple text file. The file should include nothing but the subtitle text with line breaks and timings.
                - listitem [ref=e8345]:
                  - paragraph [ref=e8346]:
                    - text: Format timings. Timings must be in the format HH:MM:SS followed by a fraction (e.g.
                    - code [ref=e8347]: 00:01:29.265
                    - text: ). In EBU-TT-D, the
                    - code [ref=e8348]: begin
                    - text: time of the subtitle is inclusive, but the
                    - code [ref=e8349]: end
                    - text: time is exclusive. This means that if you want one subtitle to follow another without any gaps, you should set the
                    - code [ref=e8350]: end
                    - text: time of the first subtitle to be the same as the
                    - code [ref=e8351]: begin
                    - text: time of the following subtitle.
                - listitem [ref=e8352]:
                  - paragraph [ref=e8353]:
                    - text: Format lines. Ensure that lines are not too long and that a
                    - code [ref=e8354]:
                      - generic [ref=e8355]:
                        - generic [ref=e8356]: <tt:br
                        - text: />
                    - text: tag is present for every line break within a subtitle. Remove unnecessary line breaks and white space at the beginning or end of a subtitle.
                - listitem [ref=e8357]:
                  - paragraph [ref=e8358]:
                    - text: Escape characters. Replace special characters with their escaped version as detailed in
                    - link "Encoding characters" [ref=e8359] [cursor=pointer]:
                      - /url: "#Encoding-characters"
                    - text: .
                - listitem [ref=e8360]:
                  - paragraph [ref=e8361]:
                    - text: Create the span elements. Wrap each subtitle in a
                    - code [ref=e8362]:
