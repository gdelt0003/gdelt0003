            - generic [ref=e933]:
              - heading "7.3 Use dashes" [level=4] [ref=e934]
              - link "Link to Use dashes" [ref=e935] [cursor=pointer]:
                - /url: "#Use-dashes"
            - paragraph [ref=e937]: This is a legacy technique that is no longer used for new content (but may be present in files created before it was deprecated or sourced from outside the UK). Use colour to indicate a change of speaker.
            - paragraph [ref=e938]: If colour cannot be used (or if colour is being used but two consecutive speakers are both assigned the same colour), put each piece of speech on a separate line and insert a white dash (not a hyphen) before each piece of speech, thereby clearly distinguishing different speakers' lines. If possible, align the dashes so that they are proud of the text, although not all formats support this well.
            - paragraph [ref=e939]:
              - generic [ref=e940]: – Found anything? – If this is the next new weapon, we're in big trouble.
            - paragraph [ref=e941]: The longest line should be centred on the screen, with the shorter line/lines left-aligned with it (not centred). If one of the lines is long, inevitably all the text will be towards the left of the screen, but generally the aim is to keep the lines in the centre of the screen.
            - paragraph [ref=e942]: Note that dashes only work as a clear indication of speakers when each speaker is in a separate consecutive shot.
            - generic [ref=e943]:
              - heading "7.4 Use single quotes for voice-over" [level=4] [ref=e944]
              - link "Link to Use single quotes for voice-over" [ref=e945] [cursor=pointer]:
                - /url: "#Use-single-quotes-for-voice-over"
            - paragraph [ref=e947]: If you need to distinguish between an in-vision speaker and a voice-over speaker, use single quotes for the voice-over, but only when there is likely to be confusion without them (single quotes are not normally necessary for a narrator, for example). Confusion is most likely to arise when the in-vision speaker and the voice-over speaker are the same person.
            - paragraph [ref=e948]: Put a single quote-mark at the beginning of each new subtitle (or segment, in live), but do not close the single quotes at the end of each subtitle/segment - only close them when the person has finished speaking, as is the case with paragraphs in a book.
