                    - paragraph [ref=e5310]:
                      - text: Teletext subtitle lines begin with at least 3 or 4 spacing control characters, which set the box colour and the text colour if not white. Lines do not need to
                      - emphasis [ref=e5311]: end
                      - text: with control characters, but may do so if the text does not run to the end of the line. Therefore there are a maximum of 37 characters per line, occupying positions 3-39 inclusive (zero-indexed).
                    - paragraph [ref=e5312]: The left edge of a character at position 3 must be positioned no less than 12.5% from the left of the root container region. The right edge of a character at position 39 must be positioned no more than 87.5% from the left of the root container region.
                  - generic [ref=e5313]:
                    - generic [ref=e5314]:
                      - heading "25.4.2 Alignment of groups of lines" [level=5] [ref=e5315]
                      - link "Link to Alignment of groups of lines" [ref=e5316] [cursor=pointer]:
                        - /url: "#Groups-of-Teletext-lines"
                    - paragraph [ref=e5318]: Since Teletext does not signal any authorial intent behind the positioning of text, implementations may need to make inferences about how to align groups of more than one adjacent line that are visible at the same time. The algorithms for making those inferences may include content-based preferences and analysis of sequences of subtitles as they change over time, for example.
                    - paragraph [ref=e5319]: Groups of lines may each be considered as being aligned horizontally to their centre position if they are within a character of that position. For example, if three adjacent lines have respective centre points at positions 20.5, 21, and 21.5, a heuristic may consider them all to be centered about position 21.
                    - paragraph [ref=e5320]: Lines that are aligned to a left or right position should have the same position for their first or last character respectively.
                    - paragraph [ref=e5321]: In some cases it may be that more than one possible alignment exists. For example, those same three adjacent lines could all have the same left position. If there is any other indication of authorial intent available, then that should be honoured where possible. For example, within a sequence of left-aligned subtitles, a single centered subtitle looks strange, and is unlikely to have been intended. Conversely, within a sequence of centered subtitles, a single left-aligned subtitle looks odd. When subtitles are cumulative, centered subtitles should not be preferred, because the change in position when words are added to a line makes the text difficult to read.
                    - paragraph [ref=e5322]:
                      - text: Such adjacent lines should be placed within the same
                      - link [ref=e5323] [cursor=pointer]:
