                          - text: ">"
                      - text: element or a
                      - code [ref=e6031]:
                        - generic [ref=e6032]:
                          - generic [ref=e6033]: <region
                          - text: ">"
                      - text: element, has an
                      - code [ref=e6034]: xml:id
                      - text: attribute.
                    - listitem [ref=e6035]:
                      - text: The element referencing it uses a particular attribute to reference that kind of element, for example a
