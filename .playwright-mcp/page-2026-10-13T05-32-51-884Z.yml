                    - /url: "#EBU-TT-and-EBU-TT-D-Documents-in-detail"
                  - text: . Scanning through the examples will also give you a good understanding of how subtitles are made.
              - listitem [ref=e153]:
                - paragraph [ref=e154]:
                  - text: "Editing and styling subtitles: read the"
                  - link "Presentation" [ref=e155] [cursor=pointer]:
