            - paragraph [ref=e2102]: Be wary of timing the appearance of the second/third line of a cumulative to coincide with a shot-change, as this may cause the viewer to reread the first line.
            - generic [ref=e2103]:
              - heading "19.5 Avoid obscuring important information" [level=4] [ref=e2104]
