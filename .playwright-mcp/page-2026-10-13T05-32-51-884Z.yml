            - paragraph [ref=e2129]: What could you do with the heat from the incinerator?
            - paragraph [ref=e2130]: "Difficult words should also be omitted rather than changed. For example:"
            - paragraph [ref=e2131]: First thing we're going to do is make his big, ugly, bad-tempered head.
            - paragraph [ref=e2132]: First we're going to make his big, ugly head.
            - paragraph [ref=e2133]: All she had was her beloved rat collection.
            - paragraph [ref=e2134]: She only had her beloved rat collection.
            - paragraph [ref=e2135]: Where possible the grammatical structure should be simplified while maintaining the word order.
            - paragraph [ref=e2136]: You can see how metal is recycled if we follow the aluminium.
            - paragraph [ref=e2137]: See how metal is recycled by following the aluminium.
            - paragraph [ref=e2138]: We need energy so our bodies can grow and stay warm.
            - paragraph [ref=e2139]: We need energy to grow and stay warm.
            - paragraph [ref=e2140]: "Difficult and complex words in an unfamiliar context should remain on screen for as long as possible. Few other words should be used. For example:"
            - paragraph [ref=e2141]: Nurse, we'll test the reflexes again.
            - paragraph [ref=e2142]: Nurse, we'll test the reflexes.
            - paragraph [ref=e2143]: Air is displaced as water is poured into the bottle.
            - paragraph [ref=e2144]: The water in the bottle displaces the air.
            - paragraph [ref=e2145]: Care should be taken that simplifying does not change the meaning, particularly when meaning is conveyed by the intonation of words.
            - paragraph [ref=e2146]: Often, the aim of schools programmes is to introduce new vocabulary and to familiarize pupils with complex terminology. When subtitling schools programmes, introduce complex vocabulary in very simple sentences and keep it on screen for as long as possible.
            - generic [ref=e2147]:
              - heading "20.2 Preferred timing" [level=4] [ref=e2148]
              - link "Link to Preferred timing" [ref=e2149] [cursor=pointer]:
                - /url: "#Preferred-timing"
            - paragraph [ref=e2151]: In general, subtitles for children should follow the speed of speech. However, there may be occasions when matching the speed of speech will lead to subtitle rate that is not appropriate for the age group. The producer/assistant producer should seek advice on the appropriate subtitle timing for a programme.
            - generic [ref=e2152]:
              - heading "20.3 Avoid variable timing" [level=4] [ref=e2153]
              - link "Link to Avoid variable timing" [ref=e2154] [cursor=pointer]:
                - /url: "#Avoid-variable-timing"
            - paragraph [ref=e2156]:
              - text: There will be occasions when you will feel the need to go faster or slower than the standard timings - the same guidelines apply here as with adult timings (see
              - link "Timing" [ref=e2157] [cursor=pointer]:
                - /url: "#Timing"
              - text: ). You should however avoid inconsistent timings e.g. a two-line subtitle of 6 seconds immediately followed by a two-line subtitle of 8 seconds, assuming equivalent scores for visual context and complexity of subject matter.
            - generic [ref=e2158]:
              - heading "20.4 Allow more time for visuals" [level=4] [ref=e2159]
              - link "Link to Allow more time for visuals" [ref=e2160] [cursor=pointer]:
                - /url: "#Allow-more-time-for-visuals"
            - paragraph [ref=e2162]: More time should be given when there are visuals that are important for following the plot, or when there is particularly difficult language.
            - generic [ref=e2163]:
              - heading "20.5 Syntax and Vocabulary" [level=4] [ref=e2164]
              - link "Link to Syntax and Vocabulary" [ref=e2165] [cursor=pointer]:
                - /url: "#Syntax-and-Vocabulary"
            - paragraph [ref=e2167]: Do not simplify sentences, unless the sentence construction is very difficult or sloppy.
            - paragraph [ref=e2168]: Avoid splitting sentences across subtitles. Unless this is unavoidable, keep to complete clauses.
            - paragraph [ref=e2169]: Vocabulary should not be simplified.
            - paragraph [ref=e2170]: There should be no extra spaces inserted before punctuation.
          - generic [ref=e2171]:
