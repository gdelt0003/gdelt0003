            - paragraph [ref=e2123]: There should be a match between the voice and subtitles as far as possible.
            - paragraph [ref=e2124]: A strategy should be developed where words are omitted rather than changed to reduce the length of sentences.
            - paragraph [ref=e2125]: For example,
