                - generic [ref=e3622]:
                  - generic [ref=e3623]:
                    - heading "24.7 Extended BBC metadata (v1.0)" [level=4] [ref=e3624]
                    - link "Link to Extended BBC metadata (v1.0)" [ref=e3625] [cursor=pointer]:
                      - /url: "#Extended-BBC-metadata--v1-0"
                  - paragraph [ref=e3627]: This section lists the required extended BBC metadata values for BBC subtitle documents based on EBU-TT Part 1 v1.0, which is the current actively used format.
                  - paragraph [ref=e3628]:
                    - text: In addition to the standard EBU-TT elements listed above, the BBC requires the below metadata elements within a
                    - code [ref=e3629]:
                      - generic [ref=e3630]:
                        - generic [ref=e3631]: <bbctt:metadata
                        - text: ">"
                    - text: element. The
                    - code [ref=e3632]:
                      - generic [ref=e3633]:
                        - generic [ref=e3634]: <bbctt:metadata
                        - text: ">"
                    - text: element is the last child of
                    - code [ref=e3635]:
                      - generic [ref=e3636]:
                        - generic [ref=e3637]: <tt:metadata
                        - text: ">"
                    - text: . See
                    - link "Appendix - Sample files" [ref=e3638] [cursor=pointer]:
                      - /url: "#Appendix-Sample-files"
                    - text: for a sample XML and
                    - link "Appendix - BBC metadata XSD" [ref=e3639] [cursor=pointer]:
                      - /url: "#Appendix-BBC-metadata-XSD"
                    - text: for the XML schema.
                  - paragraph [ref=e3640]: "In the following tables, prefixes are used as shortcuts for the following namespaces:"
