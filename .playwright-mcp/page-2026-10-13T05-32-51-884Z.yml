                        - text: a region.
                      - paragraph [ref=e7329]: For a 16:9 aspect ratio video, setting the width of a region to 71.25%, with zero padding, should be sufficient to carry all 38 possible characters across a Teletext line and add 0.5c line padding. A region of such a size should be centred horizontally (i.e. have an origin x coordinate of 14.375%) to allow for it to be displayed in its entirety even if a centre cut out is used to display the central 4:3 area of a 16:9 root container region.
                      - paragraph [ref=e7330]: For a 9:16 or 1:1 aspect ratio video, where it is assumed that the subtitles have not been authored with Teletext line length constraints, or for 4:3 aspect ratio video, where 4:3 centre cut out considerations do not apply, the width of the region can be extended to 90% to avoid requiring too many lines, while also using a safe proportion of the video width.
                      - paragraph [ref=e7331]: The region should not overlap the top or bottom 5% of the rendering area.
