            - paragraph [ref=e587]: broadcast In dialogue sequences it is often helpful to use horizontal displacement in order to distinguish between different speakers. ‘Short and fat’ subtitles permit greater latitude for this technique.
            - generic [ref=e588]:
              - heading "3.8 Short sentences" [level=4] [ref=e589]
              - link "Link to Short sentences" [ref=e590] [cursor=pointer]:
                - /url: "#Short-sentences"
            - paragraph [ref=e592]: Short sentences may be combined into a single subtitle if the available reading time is limited. However, you should also consider the image and the action on screen. For example, consecutive subtitles may reflect better the pace of speech.
            - generic [ref=e593]:
              - heading "3.9 Long sentences" [level=4] [ref=e594]
              - link "Link to Long sentences" [ref=e595] [cursor=pointer]:
                - /url: "#Long-sentences"
            - paragraph [ref=e597]:
              - text: In most cases verbatim subtitles are preferred to edited subtitles (see this
              - link "research by BBC R&D" [ref=e598] [cursor=pointer]:
                - /url: https://www.bbc.co.uk/rd/blog/2015-09-how-fast-should-subtitles-be
              - text: ") so avoid breaking long sentences into two shorter sentences. Instead, allow a single long sentence to extend over more than one subtitle. Sentences should be segmented at natural linguistic breaks such that each subtitle forms an integrated linguistic unit. Thus, segmentation at clause boundaries is to be preferred. For example:"
            - paragraph [ref=e599]: When I jumped on the bus
            - paragraph [ref=e600]:
              - generic [ref=e601]: I saw the man who had taken the basket from the old lady.
            - paragraph [ref=e602]: "Segmentation at major phrase boundaries can also be accepted as follows:"
            - paragraph [ref=e603]:
              - generic [ref=e604]: On two minor occasions immediately following the war,
            - paragraph [ref=e605]:
              - generic [ref=e606]: small numbers of people were seen crossing the border.
            - paragraph [ref=e607]: There is considerable evidence from the psycho-linguistic literature that normal reading is organised into word groups corresponding to syntactic clauses and phrases, and that linguistically coherent segmentation of text can significantly improve readability.
            - paragraph [ref=e608]: "Random segmentation must certainly be avoided:"
            - paragraph [ref=e609]:
              - generic [ref=e610]: On two minor occasions immediately following the war, small
            - paragraph [ref=e612]:
