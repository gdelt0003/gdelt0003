                    - text: "<!-- The layout element defines the regions where subtitle text is displayed. Here, a top and a bottom regions are defined, with a clearance of 2 lines of text from the top and bottom. With a cell resolution of 32 by 15, a font height of 100% (of cell height) equals 6.66% (100/15). A line height of 120% of the font size equals 8% of the height of the active video (1.2 x 6.66). Each region accommodates 3 lines of text: 3 x 8% = 24% which sets the region's height. The width of the regions is set at 71.25% to take into account any potential centre cut of 16:9 video on 4:3 displays. The amount of text that can fit within one line is restricted by its size and also by the required application of 1c of line padding (2 x 0.5c). This width has been calculated also to accommodate the maximum 38 characters that can be practically put on a Teletext line at this font size, where the font is not unusually wide. -->"
