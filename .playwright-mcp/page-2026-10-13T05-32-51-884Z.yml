                - generic [ref=e5242]:
                  - heading "25 EBU-TT-D file" [level=3] [ref=e5243]
                  - link "Link to EBU-TT-D file" [ref=e5244] [cursor=pointer]:
                    - /url: "#EBU-TT-D-file"
                - paragraph [ref=e5246]: online The file must conform to both EBU-TT-D 1.0.1 and IMSC 1.0.1 Text Profile standards. Subtitles must be relative to a programme begin time of 00:00:00.000. The timebase must be set to 'media'.
                - generic [ref=e5247]:
                  - generic [ref=e5248]:
                    - heading "25.1 Conformance with IMSC 1.0.1 Text Profile" [level=4] [ref=e5249]
                    - link "Link to Conformance with IMSC 1.0.1 Text Profile" [ref=e5250] [cursor=pointer]:
                      - /url: "#Conformance-with-IMSC-1-0-1-Text-Profile"
                  - paragraph [ref=e5252]:
                    - text: To allow the file to be played on as many devices as possible, the EBU-TT-D must also conform to the
                    - link "IMSC 1.0.1 Text Profile" [ref=e5253] [cursor=pointer]:
                      - /url: https://www.w3.org/TR/ttml-imsc1.0.1/
                    - text: ", a closely related profile of TTML. In general, a valid EBU-TT-D document that conforms to these Guidelines will also conform to IMSC 1.0.1, provided that:"
                  - list [ref=e5254]:
                    - listitem [ref=e5255]:
                      - paragraph [ref=e5256]: It uses UTF-8 encoding
                    - listitem [ref=e5257]:
                      - paragraph [ref=e5258]: No more than 4 regions are active at the same time (any number of regions can be defined in the document, but no more than four can be used simultaneously).
                    - listitem [ref=e5259]:
                      - paragraph [ref=e5260]:
                        - text: The metadata element
                        - code [ref=e5261]: ebuttm:conformsToStandard
                        - text: "is included with the value that corresponds to IMSC 1.0.1 (as well as the value that corresponds to EBU-TT-D 1.0.1):"
                      - code [ref=e5263]:
                        - generic [ref=e5264]:
                          - generic [ref=e5265]: <ebuttm:conformsToStandard
                          - text: ">"
                        - text: http://www.w3.org/ns/ttml/profile/imsc1/text
                        - generic [ref=e5266]:
                          - generic [ref=e5267]: </ebuttm:conformsToStandard
                          - text: ">"
                        - generic [ref=e5268]:
                          - generic [ref=e5269]: <ebuttm:conformsToStandard
                          - text: ">"
                        - text: urn:ebu:tt:distribution:2018-04
                        - generic [ref=e5270]:
                          - generic [ref=e5271]: </ebuttm:conformsToStandard
                          - text: ">"
                  - paragraph [ref=e5272]:
                    - text: IMSC 1.0.1 also imposes
                    - link "complexity contraints" [ref=e5273] [cursor=pointer]:
                      - /url: https://www.w3.org/TR/ttml-imsc1.0.1/#hypothetical-render-model
                    - text: ", however these are not likely to be exceeded if you follow these guidelines."
                - generic [ref=e5274]:
                  - generic [ref=e5275]:
                    - heading "25.2 File name" [level=4] [ref=e5276]
                    - link "Link to File name" [ref=e5277] [cursor=pointer]:
                      - /url: "#File-name-3"
                  - paragraph [ref=e5279]: online For scheduled programmes (with an On Air UID), the file must be named [UID with slash removed].ebuttd.xml. Contact the commissioning editor for guidance on file names for for non-scheduled content (where no UID exists).
                  - paragraph [ref=e5280]: Note that embedded STL files should not be included within EBU-TT-D documents.
                - generic [ref=e5281]:
                  - generic [ref=e5282]:
                    - heading "25.3 Character encoding" [level=4] [ref=e5283]
                    - link "Link to Character encoding" [ref=e5284] [cursor=pointer]:
                      - /url: "#Character-encoding-2"
                  - paragraph [ref=e5286]: The file must be UTF-8 encoded.
                  - paragraph [ref=e5287]: The file must not begin with a byte order mark (BOM).
                  - paragraph [ref=e5288]:
                    - text: See also
                    - link "Encoding characters" [ref=e5289] [cursor=pointer]:
                      - /url: "#Encoding-characters"
                    - text: .
                - generic [ref=e5290]:
                  - generic [ref=e5291]:
                    - heading "25.4 Mapping Teletext positions to percentage positions" [level=4] [ref=e5292]
                    - link "Link to Mapping Teletext positions to percentage positions" [ref=e5293] [cursor=pointer]:
                      - /url: "#Mapping-Teletext-positions-to-percentage-positions"
                  - paragraph [ref=e5295]: This section applies when creating subtitles for landscape 16:9 aspect ratio videos.
                  - paragraph [ref=e5296]: There is no standard specification stating where the Teletext rendering area is located over video. Teletext was created when televisions had a 4:3 aspect ratio, so it is reasonable to assume that the Teletext rendering area was intended also to be 4:3. However most implementations avoid the edges of the screen, because televisions typically overscanned, which meant that the edges were not visible to the viewer.
                  - paragraph [ref=e5297]: As a rough basis then, positioning a 4:3 area in the central 90% vertically is a good starting point to keep the subtitles within the "safe area". Such an area within a 16:9 aspect ratio video would have a horizontal width of 67.5% of that root container region.
                  - paragraph [ref=e5298]: "However, whereas Teletext was designed to be displayed using a monospaced font, modern systems typically use a proportionally spaced font. For double height text, as was traditionally used for subtitles, the Teletext approach was simply to create glyphs twice as tall, without modifying the width. Adopting the same approach today with proportionally spaced fonts is likely to result in text that is unpleasant to look at and hard to read: it would have to be a highly condensed variant of the font."
                  - paragraph [ref=e5299]: Instead, we need to find a balance between font size and line width that presents the text at a readable size while minimising the chance of unwanted line breaks in case the rendered text does not fit within the allocated space. Therefore the width available is extended to 75% of the 16:9 video area, with any additional space needed to accommodate line padding added on either side.
                  - generic [ref=e5300]:
