                      - /url: "#Element-references-and-xml-id-attributes"
                  - paragraph [ref=e6024]:
                    - text: In the following sections the concept of
                    - emphasis [ref=e6025]: referencing
                    - text: "is used. For example a content element can reference a style or a region (or both). A single generic mechanism is used for this:"
                  - list [ref=e6026]:
                    - listitem [ref=e6027]:
                      - text: The element that needs to be referenced, for example a
                      - code [ref=e6028]:
                        - generic [ref=e6029]:
