              - paragraph [ref=e1239]:
                - text: "The 8% value originates in Teletext, where it is approximately the height of a double height line, with the Teletext rendering area covering around 90% of the video area height, as is typical when they are rendered within a safe area which accommodates overscan. We currently broadcast teletext subtitles on our digital satellite platforms: in principle, by connecting a television to a set top box using for example a SCART connector it would still be possible to display subtitles in this way, though in practice few if any new products are available that support such a mechanism. The double height line was used instead of a single height line for readability when commonly used television sizes were much smaller than today's median sizes (see"
                - link "BBC R&D White Paper 287 (PDF)" [ref=e1240] [cursor=pointer]:
                  - /url: http://downloads.bbc.co.uk/rd/pubs/whp/whp-pdf-files/WHP287.pdf
                - text: for relevant research on this).
              - paragraph [ref=e1241]: The 4.5% value results from adjusting the 8% value as applied to a 16:9 aspect ratio video for a 9:16 vertical video, i.e. by multiplying it by 9/16, so that subtitle text is approximately the same size on a landscape video as on a portrait/vertical video; since text size is proportional to the video height, 8% of a vertical video is much larger than 8% of a landscape video, when each is rotated to fill the same 16:9 ratio display.
            - generic [ref=e1242]:
              - heading "9.2.2 Presentation font size" [level=5] [ref=e1243]
              - link "Link to Presentation font size" [ref=e1244] [cursor=pointer]:
                - /url: "#Presentation-font-size"
            - paragraph [ref=e1246]:
              - text: Depending on device size, viewing distance, screen resolution etc., a processor (such as a player) may choose to reduce (but not to increase) the authored font size so that the final presentation font size is smaller than the authored font size. For example, on a very large TV the subtitles may appear too large when displayed at the original authored size, so the processor can apply a scaling factor, or a multiplier of less than 1, to the value of
              - code [ref=e1247]:
                - link "tts:fontSize" [ref=e1248] [cursor=pointer]:
                  - /url: "#tts-fontSize"
              - text: .
            - paragraph [ref=e1249]:
              - text: For most screen sizes, the preferred font size is between 0.6 and 0.8 times the required
              - link "authoring font size" [ref=e1250] [cursor=pointer]:
                - /url: "#Authoring-font-size"
              - text: . For small mobile phones (e.g. 4" diagonal screen size) the presentation size should be the unmodified authored font size (i.e. a multiplier of 1).
            - paragraph [ref=e1251]: Along with reading distance, the physical height of the video when displayed on the device's screen is the most direct determinant of font size as a proportion of video height. In practice, however, a processor may not know the actual physical height and may have to rely on other data, for example pixel size and resolution (which may not be reliable indicators of physical size). The examples below illustrate devices and their recommended multipliers. For devices that support configurable sizes, a recommended range is shown. When the processor cannot determine the screen size, it should use the unmodified authored size to mitigate the risk of illegibly small text (i.e. default to a multiplier of 1).
