                  - heading "24.8 Extended BBC metadata (EBU-TT Part M)" [level=4] [ref=e4477]
                  - link "Link to Extended BBC metadata (EBU-TT Part M)" [ref=e4478] [cursor=pointer]:
                    - /url: "#Extended-BBC-metadata--EBU-TT-Part-M"
                - paragraph [ref=e4480]: BBC specifications for version 1.2 of EBU-TT Part 1 and EBU-TT Part M are still in development and are not yet in active use. Information in this section is therefore subject to change. This section lists the required extended BBC metadata values for BBC subtitle documents based on EBU-TT Part M.
                - paragraph [ref=e4481]:
                  - text: Some metadata that the BBC requires in version 1.0 of EBU-TT Part 1 were incorporated into version 1.1 and then transferred into EBU-TT Part M, which is incorporated by reference into EBU-TT Part 1 v1.2, meaning that BBC-specific elements (in the
                  - code [ref=e4482]: bbctt
                  - text: namespace) can be replaced by elements in the standard EBU-TT namespace (
                  - code [ref=e4483]: ebuttm
                  - text: "). The following table summarises the changes:"
