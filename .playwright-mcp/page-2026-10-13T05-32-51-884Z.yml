                  - generic [ref=e6097]:
                    - generic [ref=e6098]:
                      - heading "27.6.1 Applying style attributes to content elements" [level=5] [ref=e6099]
                      - link "Link to Applying style attributes to content elements" [ref=e6100] [cursor=pointer]:
                        - /url: "#Applying-style-attributes-to-content-elements"
                    - paragraph [ref=e6102]:
                      - text: The style attributes listed within this section can be applied to
                      - link "content elements" [ref=e6103] [cursor=pointer]:
                        - /url: "#Content-Elements"
                      - text: to modify the appearance of the subtitles.
                    - generic [ref=e6104]:
                      - heading "Document Requirements" [level=6] [ref=e6105]
                      - list [ref=e6106]:
                        - listitem [ref=e6107]:
                          - paragraph [ref=e6108]:
                            - strong [ref=e6109]: "Shall requirement:"
                          - paragraph [ref=e6110]:
                            - text: All style attributes must be applied to content elements by specifying them on a
                            - code [ref=e6111]:
                              - generic [ref=e6112]:
                                - generic [ref=e6113]: <style
                                - text: ">"
                            - text: element and
                            - link "referencing" [ref=e6114] [cursor=pointer]:
                              - /url: "#elementReferences"
                            - text: that style from the content element. (EBU-TT-D requirement)
                  - generic [ref=e6115]:
                    - generic [ref=e6116]:
                      - heading "27.6.2 tts:fontFamily" [level=5] [ref=e6117]
                      - link "Link to tts:fontFamily" [ref=e6118] [cursor=pointer]:
                        - /url: "#tts-fontFamily"
                    - generic [ref=e6120]:
                      - heading "Description" [level=6] [ref=e6121]
                      - paragraph [ref=e6122]: Sets a generic or a named font family. This attribute can contain a prioritised list of font names, which are typically processed in order until a match is found, thus allowing predictable fallbacks to be used. This list may be evaluated on a per glyph basis to deal with the case where most glyphs are present in a font but later fonts include specific required glyphs omitted from earlier fonts, for example.
                      - table [ref=e6123]:
                        - rowgroup [ref=e6127]:
                          - row [ref=e6128]:
                            - rowheader "Cardinality" [ref=e6129]
                            - cell "0..1" [ref=e6130]
                          - row [ref=e6131]:
                            - rowheader "BBC requirement" [ref=e6132]
                            - cell [ref=e6133]:
                              - text: Set the font family to
                              - code [ref=e6134]: ReithSans, Arial, Roboto, proportionalSansSerif, default
                              - text: for all content in the document. This can be done efficiently for example by referencing a style that includes a
                              - code [ref=e6135]: tts:fontFamily
                              - text: specification from the
                              - code [ref=e6136]: body
                              - text: element, or by ensuring that every
                              - code [ref=e6137]: style
                              - text: specifies a
                              - code [ref=e6138]: tts:fontFamily
                              - text: itself or, for EBU-TT, references another
                              - code [ref=e6139]: style
                              - text: that does.
                          - row [ref=e6140]:
                            - rowheader "Values" [ref=e6141]
                            - cell [ref=e6142]:
                              - code [ref=e6143]: "\"default\" | \"monospace\" | \"sansSerif\" | \"serif\" | \"monospaceSansSerif\" | \"monospaceSerif\" | \"proportionalSansSerif\" | \"proportionalSerif\" | [named font]"
                          - row [ref=e6144]:
                            - rowheader "Default value" [ref=e6145]
                            - cell [ref=e6146]:
                              - code [ref=e6147]: "\"default\""
                          - row [ref=e6148]:
                            - rowheader "Reference" [ref=e6149]
                            - cell [ref=e6150]:
                              - text: See informative discussion of font usage in section 2.7 of
                              - link "EBU-TT part 1." [ref=e6151] [cursor=pointer]:
                                - /url: https://tech.ebu.ch/publications/tech3350
                              - text: The font family data type is defined in
                              - link "https://www.w3.org/TR/ttml1/#style-attribute-fontFamily" [ref=e6152] [cursor=pointer]:
                                - /url: https://www.w3.org/TR/ttml1/#style-attribute-fontFamily
                          - row [ref=e6153]:
                            - rowheader "Presentation" [ref=e6154]
                            - cell [ref=e6155]:
                              - text: Used to specify the subtitle
                              - link "font" [ref=e6156] [cursor=pointer]:
                                - /url: "#Fonts"
                              - text: . The choice of font also determines the
                              - link "line height" [ref=e6157] [cursor=pointer]:
                                - /url: "#Size"
                              - text: and may also affect the
                              - link "supported characters" [ref=e6158] [cursor=pointer]:
                                - /url: "#Supported-characters"
                              - text: . Because fonts have different widths, changing the font may also alter the
                              - link "width of each line" [ref=e6159] [cursor=pointer]:
                                - /url: "#Line-length"
                              - text: .
                    - generic [ref=e6160]:
                      - heading "Document Requirements" [level=6] [ref=e6161]
                      - list [ref=e6162]:
                        - listitem [ref=e6163]:
                          - paragraph [ref=e6164]:
                            - strong [ref=e6165]: Shall
                            - text: "requirement:"
                          - paragraph [ref=e6166]: Set to Reith Sans, fall back to device-specific and then generic proportional sans-serif fonts so that the end device uses its default font (e.g. Roboto in Android).
                          - generic [ref=e6167]:
                            - paragraph [ref=e6168]: "Example:"
                            - code [ref=e6170]:
                              - generic [ref=e6171]:
                                - generic [ref=e6172]: <tt:style
                                - generic [ref=e6173]: xml:id
                                - generic [ref=e6174]: ="s0"
                                - generic [ref=e6175]: tts:fontFamily
                                - generic [ref=e6176]: ="ReithSans, Arial, Roboto, proportionalSansSerif, default"
                                - text: ...>
                    - generic [ref=e6177]:
                      - heading "Processor Requirements" [level=6] [ref=e6178]
                      - list [ref=e6179]:
                        - listitem [ref=e6180]:
                          - paragraph [ref=e6181]:
                            - strong [ref=e6182]: Shall
                            - text: "requirement:"
                          - paragraph [ref=e6183]: Map a generic font family name to the best appropriate matching font on the device.
                        - listitem [ref=e6184]:
                          - paragraph [ref=e6185]:
                            - strong [ref=e6186]: Shall
                            - text: "requirement:"
                          - paragraph [ref=e6187]: Use downloadable fonts if available.
                        - listitem [ref=e6188]:
                          - paragraph [ref=e6189]:
                            - strong [ref=e6190]: Shall
                            - text: "requirement:"
                          - paragraph [ref=e6191]: Fall back to the system defined sans serif font if a downloadable font is not available. Prefer proportional fonts if there is a choice.
                  - generic [ref=e6192]:
                    - generic [ref=e6193]:
                      - heading "27.6.3 tts:fontSize" [level=5] [ref=e6194]
                      - link "Link to tts:fontSize" [ref=e6195] [cursor=pointer]:
                        - /url: "#tts-fontSize"
                    - paragraph [ref=e6197]:
                      - emphasis [ref=e6198]: BBC-specific requirements apply.
                    - generic [ref=e6199]:
                      - heading "Description" [level=6] [ref=e6200]
                      - paragraph [ref=e6201]: EBU-TT 1.0 Sets the font size using percent, pixel or cell values. Double values can be used to set height and width separately, known as anamorphic font sizing - this scales the font by different amounts horizontally and vertically.
                      - paragraph [ref=e6202]:
                        - text: EBU-TT-D Sets the font size using a percentage of cell height value (see
                        - link "cell resolution" [ref=e6203] [cursor=pointer]:
                          - /url: "#ttp:cellResolution"
                        - text: ). A single value only can be used.
                      - paragraph [ref=e6204]: Percentage values are relative to the parent element's font size, or the cell size when the parent element (and every ancestor) has no specified font size.
                      - table [ref=e6205]:
                        - rowgroup [ref=e6209]:
                          - row [ref=e6210]:
                            - rowheader "Cardinality" [ref=e6211]
                            - cell "0..1" [ref=e6212]
                          - row [ref=e6213]:
                            - rowheader "BBC requirement" [ref=e6214]
                            - cell [ref=e6215]:
                              - text: The font size shall be explicitly set, without relying on the default initial value. The computed value of font size must be appropriate to result in the correct size relative to the active video. This can be achieved by setting a value of
                              - link [ref=e6216] [cursor=pointer]:
                                - /url: "#ttp-cellResolution"
                                - code [ref=e6217]: ttp:cellResolution
                              - text: and referencing a
                              - code [ref=e6218]: style
                              - text: that includes a
                              - code [ref=e6219]: tts:fontSize
                              - text: specification from the
                              - code [ref=e6220]: body
                              - text: element, or by ensuring that the
                              - code [ref=e6221]: style
                              - text: specifies a
                              - code [ref=e6222]: tts:fontSize
                              - text: itself or references another
                              - code [ref=e6223]: style
                              - text: that does.
                              - strong [ref=e6224]: Note
                              - text: that applying
                              - code [ref=e6225]: tts:fontSize
                              - text: attributes to more than one element in the same hierarchy, e.g. both a
                              - code [ref=e6226]: div
                              - text: and its parent
                              - code [ref=e6227]: p
                              - text: results in the percentages being multiplied together, not overridding each other.
                          - row [ref=e6228]:
                            - rowheader "Values" [ref=e6229]
                            - cell "EBU-TT 1.0one or two positive decimals followed by \"%\", \"px\" or \"c\". If a single value is specified, then this length applies equally to horizontal and vertical scaling; if two values are specified, then the first expresses the horizontal scaling and the second expresses vertical scaling. If \"c\" is used then ttp:cellResolution must be specified. If \"px\" is used, then tts:extent must be specified. EBU-TT-D one percentage value (of cell height). \"c\" and \"px\" are not allowed." [ref=e6230]
                          - row [ref=e6231]:
                            - rowheader "Default value" [ref=e6232]
                            - cell "EBU-TT 1.0 \"1c 2c\" EBU-TT-D \"100%\"" [ref=e6233]
                          - row [ref=e6234]:
                            - rowheader "Example" [ref=e6235]
                            - cell [ref=e6236]:
                              - text: "EBU-TT-D font size at 80%:"
                              - link "XML" [ref=e6237] [cursor=pointer]:
                                - /url: https://github.com/IRT-Open-Source/irt-ebu-tt-d-application-samples/blob/master/ttml/fontsize-001-ttml.xml
                              - text: "|"
                              - link "Image" [ref=e6238] [cursor=pointer]:
                                - /url: https://github.com/IRT-Open-Source/irt-ebu-tt-d-application-samples/blob/master/png/fontsize-001-image.png
                          - row [ref=e6239]:
                            - rowheader "Reference" [ref=e6240]
                            - cell [ref=e6241]:
                              - text: "EBU-TT 1.0 data type:"
                              - link "Section 4.5 of the specification" [ref=e6242] [cursor=pointer]:
                                - /url: https://tech.ebu.ch/docs/tech/tech3350v1-0.pdf
                              - text: "EBU-TT-D:"
                              - link "Section 4.7 of the specification" [ref=e6243] [cursor=pointer]:
                                - /url: https://tech.ebu.ch/publications/tech3380
                          - row [ref=e6244]:
                            - rowheader "Presentation" [ref=e6245]
                            - cell [ref=e6246]:
                              - text: Used to set the font
                              - link "size" [ref=e6247] [cursor=pointer]:
                                - /url: "#Size"
                              - text: .
                    - generic [ref=e6248]:
                      - heading "Document Requirements" [level=6] [ref=e6249]
                      - list [ref=e6250]:
                        - listitem [ref=e6251]:
                          - paragraph [ref=e6252]:
                            - strong [ref=e6253]: Should
                            - text: "requirement:"
                          - paragraph [ref=e6254]: "For BBC subtitles for 16:9, 4:3 or 1:1 aspect ratio videos, set the font size to be approximately 1/16th (6.25%) of the height of the root container, for example by setting:"
