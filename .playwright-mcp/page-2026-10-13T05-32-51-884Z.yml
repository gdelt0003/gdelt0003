                      - paragraph [ref=e5971]: Describes the area within the root container region that contains subtitles, i.e. the area that needs to be minimally visible to the viewer. This area typically fully contains all of the referenced regions within the Document Instance.
                      - paragraph [ref=e5972]: The active area may be used by a player to ensure that the subtitles remain in the visible area of the screen if the player area is not the same shape as the video image, for example.
                      - table [ref=e5973]:
