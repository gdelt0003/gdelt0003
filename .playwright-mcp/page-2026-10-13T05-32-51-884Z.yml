            - paragraph [ref=e559]: This is centre justified. The eye now has least distance to travel from ‘are’ to ‘feeling’.
            - paragraph [ref=e560]: Problems occur with justification when a short sentence or phrase is followed by a longer one.
            - paragraph [ref=e561]:
