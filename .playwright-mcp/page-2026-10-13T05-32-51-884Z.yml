              - generic [ref=e951]: "'I never want to leave this area. I've been very happy here."
            - paragraph [ref=e952]: "'I love the fresh air and the beautiful scenery.'"
            - paragraph [ref=e953]: If more than one speaker in the same subtitle is a voice-over, just put single quotes at the beginning and end of the subtitle.
            - paragraph [ref=e954]:
              - generic [ref=e955]: "'What do you think about it? I'm not sure.'"
            - paragraph [ref=e956]: The single quotes will be in the same colour as the adjoining text.
            - generic [ref=e957]:
              - heading "7.5 Use single quotes for out-of-vision speaker" [level=4] [ref=e958]
              - link "Link to Use single quotes for out-of-vision speaker" [ref=e959] [cursor=pointer]:
                - /url: "#Use-single-quotes-for-out-of-vision-speaker"
            - paragraph [ref=e961]: When two white text speakers are having a telephone conversation, you will need to distinguish the speakers. Using single quotes placed around the speech of the out-of-vision speaker is the recommended approach. They should be used throughout the conversation, whenever one of the speakers is out of vision.
            - paragraph [ref=e962]:
              - generic [ref=e963]: Hello. Victor Meldrew speaking. 'Hello, Mr Meldrew. I'm calling about your car.'
