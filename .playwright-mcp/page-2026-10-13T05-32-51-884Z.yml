                  - text: section for text, format and timing guidelines.
              - listitem [ref=e156]:
                - paragraph [ref=e157]:
                  - text: "Making subtitle files for online-only content: if your software does not support EBU-TT-D you will need to create an XML file yourself. Assuming you are familiar with XML and CSS, start with"
                  - link "Introduction to the TTML document structure" [ref=e158] [cursor=pointer]:
