                    - paragraph [ref=e5337]:
                      - text: Whereas Teletext is a monospaced system, typically the resulting subtitles will be presented using a proportionally spaced font. When the text is rendered, it may occupy more width than the original Teletext. To allow for this, where all the text in a
                      - link [ref=e5338] [cursor=pointer]:
