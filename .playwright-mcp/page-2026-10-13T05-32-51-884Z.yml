                - /url: "#General"
            - paragraph [ref=e2180]: The subtitler should have a direct pre-broadcast-encoding feed from the broadcaster, so they can hear the output a few seconds earlier than if relying on the broadcast service.
            - paragraph [ref=e2181]: Maintain a regular subtitle output with no long gaps (unless it is obvious from the picture that there is no commentary) even if this means subtitling the picture or providing background information rather than subtitling the commentary.
            - paragraph [ref=e2182]: Aim for continuity in subtitles by following through a train of thought where possible, rather than sampling the commentary at intervals.
            - paragraph [ref=e2183]: Do not subtitle over existing video captions where avoidable (in news, this is often unavoidable, in which case a speaker's name can be included in the subtitle if available).
            - generic [ref=e2184]:
