                  - generic [ref=e5890]:
                    - generic [ref=e5891]:
                      - heading "27.4.2 ttp:cellResolution" [level=5] [ref=e5892]
                      - link "Link to ttp:cellResolution" [ref=e5893] [cursor=pointer]:
                        - /url: "#ttp-cellResolution"
                    - paragraph [ref=e5895]:
                      - emphasis [ref=e5896]: BBC-specific requirements apply.
                    - generic [ref=e5897]:
                      - heading "Description" [level=6] [ref=e5898]
                      - paragraph [ref=e5899]:
                        - text: Expresses a virtual 2 dimensional grid of cells. The first value defines the number of columns and the second value defines the number of rows. The cell height ('c' unit) is used as the basis for computing font size and therefore indirectly line height. For example, the default value
                        - code [ref=e5900]: "\"32 15\""
                        - text: creates a cell with height 6.66% (=100/15) and width 3.125% (=100/32) of the root container region's height and width. The root container region is defined as the active video area in EBU-TT but implementation defined in EBU-TT-D.
                      - paragraph [ref=e5901]: Font size percentages are relative to the parent element's font size, or if none is set, the cell height. For example a font size of 100% set on an element with no ancestor that sets font size would be computed as 1/15 (=6.66%) of the root container region height; a line height of 120% applied to that would be 120% of the font size, i.e. 1.2 * 1/15 = 8%.
                      - paragraph [ref=e5902]:
                        - text: EBU-TT 1.0 If the ‘cell’ measurement unit is used (e.g. as part of a
                        - code [ref=e5903]: tts:fontSize
                        - text: attribute value) then the
                        - code [ref=e5904]: ttp:cellResolution
                        - text: attribute must be specified.
                      - table [ref=e5905]:
                        - rowgroup [ref=e5909]:
                          - row [ref=e5910]:
                            - rowheader "Cardinality" [ref=e5911]
                            - cell "0..1" [ref=e5912]
                          - row [ref=e5913]:
                            - rowheader "BBC requirement" [ref=e5914]
                            - 'cell "EBU-TT-D This attribute is optional (cardinality: 0..1). EBU-TT 1.0 This attribute is required (cardinality: 1..1)." [ref=e5915]': "EBU-TT-D This attribute is optional (cardinality: 0..1).EBU-TT 1.0 This attribute is required (cardinality: 1..1)."
                          - row [ref=e5916]:
                            - rowheader "Values" [ref=e5917]
                            - cell "Two integers separated by a space." [ref=e5918]
                          - row [ref=e5919]:
                            - rowheader "Default value" [ref=e5920]
                            - cell "EBU-TT-D \"32 15\" EBU-TT 1.0 \"40 24\"" [ref=e5921]
                          - row [ref=e5922]:
                            - rowheader "Example" [ref=e5923]
                            - cell [ref=e5924]:
                              - link "XML" [ref=e5925] [cursor=pointer]:
                                - /url: https://github.com/IRT-Open-Source/irt-ebu-tt-d-application-samples/blob/master/ttml/cellresolution-001-ttml.xml
                              - text: "|"
                              - link "Image" [ref=e5926] [cursor=pointer]:
                                - /url: https://github.com/IRT-Open-Source/irt-ebu-tt-d-application-samples/blob/master/png/cellresolution-001-image.png
                          - row [ref=e5927]:
                            - rowheader "Reference" [ref=e5928]
                            - cell [ref=e5929]:
                              - link "https://www.w3.org/TR/ttml1/#parameter-attribute-cellResolution" [ref=e5930] [cursor=pointer]:
                                - /url: https://www.w3.org/TR/ttml1/#parameter-attribute-cellResolution
                          - row [ref=e5931]:
                            - rowheader "Presentation" [ref=e5932]
                            - cell [ref=e5933]:
                              - text: Cell resolution is used for setting the
                              - link "font size" [ref=e5934] [cursor=pointer]:
                                - /url: "#Size"
                              - text: and therefore the
                              - link "line length" [ref=e5935] [cursor=pointer]:
                                - /url: "#Line-length"
                              - text: . It is also used to set the
                              - link "line padding of the background colour" [ref=e5936] [cursor=pointer]:
                                - /url: "#Size"
                              - text: . Cell units may also be used in the definition of regions that control
