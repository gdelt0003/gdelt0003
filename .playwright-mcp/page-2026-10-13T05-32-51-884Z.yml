            - paragraph [ref=e1136]:
              - text: Subtitle fonts are determined by the platform, the delivery mechanism and the client as detailed below. Since fonts have different character widths, the final pixel width of a line of subtitles cannot be accurately determined when authoring. See also
              - link "Line Breaks" [ref=e1137] [cursor=pointer]:
