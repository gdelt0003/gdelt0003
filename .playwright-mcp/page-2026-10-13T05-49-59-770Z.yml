            - 'heading "Transcript: Trump Delivers Remarks at Anduril Industries in Baltimore, MD" [level=1] [ref=f45e83]'
            - list [ref=f45e84]:
              - listitem [ref=f45e85]:
                - time [ref=f45e86]: October 7, 2026 2:19 am
                - text: /
              - listitem [ref=f45e87]:
                - generic [ref=f45e88]:
                  - text: by
                  - link "Pangambam S" [ref=f45e89] [cursor=pointer]:
                    - /url: https://singjupost.com/author/singju/
                - text: /
              - listitem [ref=f45e90]:
                - link "Politics (category)" [ref=f45e91] [cursor=pointer]:
                  - /url: https://singjupost.com/category/politics/
                  - text: Politics
                  - generic [ref=f45e92]: (category)
          - generic [ref=f45e94]:
            - generic [ref=f45e95]:
              - paragraph [ref=f45e96]:
                - emphasis [ref=f45e97]: President Donald Trump joined Anduril Industries at Sparrows Point in Baltimore County, Maryland, October 6, 2026 to launch construction of Arsenal-2, a new shipyard that will build components for the Navy’s Virginia class attack submarines and autonomous undersea systems. Anduril CEO Brian Schimpf, Vice Admiral Rob Gaucher, Acting Navy Secretary Hung Cao, and Secretary of War Pete Hegseth also spoke, outlining the project’s 3,100 jobs, the push to rebuild America’s submarine industrial base, and the administration’s “Golden Fleet” vision
                - text: .
                - strong [ref=f45e99]: Read the full transcript below
                - text: .
              - heading "Anduril CEO Brian Schimpf on Rebuilding the Submarine Industrial Base" [level=2] [ref=f45e100]
              - paragraph [ref=f45e101]:
                - strong [ref=f45e102]: "BRIAN SCHIMPF:"
                - text: The quality of the systems that we produce, and the strength of the industrial base that constructs and sustains those systems. As the security environment has become more demanding, so too have the questions that the nation is facing.
              - paragraph [ref=f45e103]: The problems we now must address extend beyond whether industry can design the best military technology in the world. We now need to prove that we can produce it, maintain it, and deliver it at the pace and scale that The United States requires.
              - status "Loading" [ref=f45e117] [cursor=pointer]
              - paragraph [ref=f45e119]: There are a few weapons systems where the convergence of build speed and scale is more important than the Virginia class attack submarine. The United States builds the most capable nuclear powered submarines in the world, supported by expertise across shipyards, suppliers, workforce, and the navy.
              - paragraph [ref=f45e120]: But at the same time, the demands on that expertise have grown well beyond the capacity available today. Existing shipyards and suppliers are investing heavily to increase output. Meeting the Navy’s requirements, however, will demand substantially more production.
              - paragraph [ref=f45e121]: Whether can contribute to that production was not always obvious to us. Over two years ago, the Navy began a conversation with Anduril about whether we could assist the submarine enterprise in a larger way. At first, our answer was no.
              - paragraph [ref=f45e122]: For years, Anduril have built autonomous aircraft, missiles, and the software that connects them. But even our most advanced systems sit at a different order of complexity than the Virginia class submarine.
              - paragraph [ref=f45e123]: We kept returning to the submarine challenge anyway though, because its principal problem was too important to walk away from. The more time that Anduril spent learning about industrial base challenges, the clearer the need became to us. The country requires substantially more places where submarine components can be built.
              - paragraph [ref=f45e124]: We have worked closely with the Navy and companies throughout the submarine industrial base, including General Dynamics Electric Boat and Huntington Ingalls Newport News Shipbuilding, to understand how the production system operates. We wanted to know where the most persistent constraints exist and where a new industrial player could make a meaningful contribution.
              - paragraph [ref=f45e125]: We also started testing what we were learning. We stood up a proto factory in California where our teams are already proving new manufacturing approaches and developing components for the Virginia class program. All these efforts have led us to this moment.
              - heading "Announcing Arsenal-2 at Sparrows Point" [level=2] [ref=f45e129]
              - paragraph [ref=f45e130]:
                - strong [ref=f45e131]: "BRIAN SCHIMPF:"
                - text: Today, Anduril is announcing Arsenal-2, a new shipyard right here at Sparrows Point in Baltimore County. Arsenal-2 will be 2 million square feet of manufacturing space and will create more than 3,100 direct jobs and thousands more indirect jobs.
              - paragraph [ref=f45e132]: Arsenal-2 will be built to produce a range of assets that are integral to the Virginia class attack submarine. It will add an entirely new source of capacity to the program, and it will significantly increase the amount of work that the broader undersea industrial base can move through the system.
              - paragraph [ref=f45e133]: Building Arsenal-2 from the ground up means we can design the factory around how the submarine components move through production. We will minimize unnecessary movement, put equipment where it’s needed most, and connect engineering directly to the factory floor through software. Anduril has spent years developing manufacturing systems around those same principles.
              - paragraph [ref=f45e134]: We are putting that model into practice at Arsenal-1, our manufacturing facility in Ohio. Tomorrow, we’ll do the same here in Baltimore County. But Arsenal-2 represents a much more ambitious application of this approach. Submarine manufacturing poses a different level of complexity and rigor and comes with an even higher level of responsibility.
              - paragraph [ref=f45e135]: We intend to pair what Anduril already knows about building at scale with the extraordinary technical expertise and high standards currently in operation across the submarine industrial base.
              - paragraph [ref=f45e136]: Where we are doing this work also matters. Anduril chose Sparrows Point in part because of what this waterfront has done for the country. The Bethlehem Steel Mill here became the largest steel producer in the world. During the second world war, hull after hull of Liberty ships were built at the shipyard on this site.
              - paragraph [ref=f45e137]: That legacy doesn’t need to stay in the past. In the years ahead, Arsenal-2 will bring thousands of skilled manufacturing jobs back to the site and return Sparrows Point to shipbuilding.
              - heading "Thanking the Partners Behind Arsenal-2" [level=2] [ref=f45e138]
              - paragraph [ref=f45e139]:
                - strong [ref=f45e140]: "BRIAN SCHIMPF:"
                - text: An event of this magnitude and building a shipyard of this size comes with an equally long list of people who we need to acknowledge and thank. None of what we are announcing today could happen without the many local and national leaders who have helped us get to this point. America’s fleet is stronger for having their steadfast support.
              - paragraph [ref=f45e141]: Vice Admiral Gaucher and his team have helped us understand where the production system is most constrained and where new capacity can have the greatest impact. Electric Boat and Newport News have shared decades of hard earned expertise with us and welcomed Anduril into an enterprise whose standards for quality and performance are exceptionally high.
              - paragraph [ref=f45e142]: Governor Moore, county executive Klausmeier, the federal congressional delegation, as well as state and local leaders throughout Maryland have all moved with urgency to help bring an industrial investment of this scale to Baltimore County. They’ve also worked closely with us across the many requirements necessary to make this investment come to fruition.
              - paragraph [ref=f45e146]: Secretary Hegseth and acting secretary Cao have pushed the department and industry to move faster, expand production, and create the conditions for both companies and new capital to contribute to established programs.
              - paragraph [ref=f45e147]: President Trump has made rebuilding American manufacturing, expanding shipbuilding capacity, and strengthening the defense industrial base all major priorities during his administration.
