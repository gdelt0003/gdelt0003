    - paragraph [ref=f2e15]: 本页展示仓库静态清单快照，不执行实时检索、夜间复核或自动验证。播放量、托管平台和发布方不等同于来源可信度；未知或未核验字段不会被推定。来源按视频/新闻/社交/其他类别分组，并按各类别内已记录证据排序；不设全局 10 条硬上限。证据覆盖分 0–100 仅表示当前静态快照中已记录事实的字段覆盖度，不等同于来源真实性、可信度或质量评估；它只衡量“证据是否出现在记录里”，不是客观真相判定。新闻/社交/其他类别为 0 条，不代表全网不存在，也不表示已做广泛检索；仅表示本静态目录当前未收录/本次检索未覆盖，且本静态快照中未检出更多已核验候选。可见证据经准确匹配后才会被加入并评分，未见可验证证据的条目不会被补造。未知项记 0 分并显式标注 unknown/unreviewed。用户主观参考分仅在单独区块展示，不计入证据覆盖分，也不作为来源可信度。当前页面仅说明静态证据，不代表云端真实渲染已按要求合格。