<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editorial 与 Punchy 样式对比</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        color: #e5edf9;
        background: #0b1020;
        font: 16px/1.5 "Segoe UI", sans-serif;
      }
      h1, p { text-align: center; }
      .comparison {
        display: block;
        width: 100%;
        height: auto;
        max-width: 1200px;
        margin: 24px auto;
      }
    </style>
  </head>
  <body>
    <h1>同一段话：Editorial vs Punchy</h1>
    <p>白宫视频 12:03 处，同一帧（短片第 5 秒）；画面、英文与中文字幕内容一致。</p>
    <img class="comparison" src="side-by-side.jpg" alt="同一视频帧与双语字幕的左右对比：左侧 Editorial，字幕较小；右侧 Punchy，字幕更大更粗。" />
    <p>左：字幕较小、常规字重，整体更克制。右：字幕更大更粗、描边更明显，主体也略放大。</p>
    <p>字幕原文：Arsenal 2 will help us attack production bottlenecks with the footprint to add up to 9 million production hours per year into our submarine supply chain.</p>
  </body>
</html>
